version: "3.8"

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  DEPLOY NUR VIA  /root/deploy-stack.sh  (sourcet /root/.env)              ║
# ║  ----------------------------------------------------------------------  ║
# ║  'docker stack deploy' expandiert ${VAR} aus der Aufrufer-Shell. Ist eine ║
# ║  Var dort ungesetzt -> LEERSTRING -> Secret wird still gewiped.           ║
# ║  Der Wrapper macht 'set -a; . /root/.env; set +a' davor -> alle ${VAR}    ║
# ║  (auch Traefik-Command-Arg + CIFS-Volume) interpolieren korrekt.          ║
# ║  Zusaetzlich liest 'api' Secrets per env_file: /root/.env (deckt auch die ║
# ║  frueher nur per --env-add gesetzten ab). EINZIGE Quelle: /root/.env.     ║
# ║  NIEMALS 'docker stack deploy' nackt aufrufen.                            ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  # ============================================
  # Traefik - Reverse Proxy mit Let's Encrypt
  # ============================================
  traefik:
    image: traefik:v3
    command:
      - "--api.dashboard=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"
      # HTTP-Provider: liest dynamic config (Routes/Redirects/Middlewares)
      # alle 30s aus dem API. Befuellt via isp-admin.html + isp-mein-zugang.html.
      - "--providers.http.endpoint=http://tasks.rosenweg_api:3000/api/isp/traefik-config"
      - "--providers.http.pollInterval=30s"
      # Shared-Secret: der Endpoint exponiert Backend-IPs und ist nicht mehr
      # offen. WICHTIG: ${TRAEFIK_CONFIG_SECRET} wird beim stack-deploy aus dem
      # Shell-Env expandiert — vorher `set -a; . /root/.env; set +a`, sonst
      # Leerstring -> Provider bekommt 403 -> Routing-Updates stoppen.
      - "--providers.http.headers.X-Traefik-Secret=${TRAEFIK_CONFIG_SECRET}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # TCP-Entrypoint fuer Multi-Tenant IMAPS via HostSNI passthrough
      - "--entrypoints.imaps.address=:993"
      # SMTPS (Submission ueber TLS) — als Vorbereitung fuer Phase-2 multi-tenant
      - "--entrypoints.smtps.address=:465"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=stefan+rosenweg@juroct.ch"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # DNS-01 via Cloudflare — umgeht http-01-redirect-Probleme bei Hosts
      # die zugleich Backend-Routes haben, und vermeidet das Rate-Limit-
      # Risiko aus wiederholten failed authorizations.
      - "--certificatesresolvers.cf.acme.dnschallenge=true"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cf.acme.dnschallenge.delayBeforeCheck=10"
      - "--certificatesresolvers.cf.acme.email=stefan+rosenweg@juroct.ch"
      - "--certificatesresolvers.cf.acme.storage=/letsencrypt/acme-cf.json"
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "443:443"
      - "993:993"
      - "465:465"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - traefik-logs:/var/log/traefik
    environment:
      # Fuer den CF-Resolver — Token muss Zone:DNS:Edit + Zone:Read auf den
      # benutzten Zonen haben (rosenweg4303.ch + rosenweg9.ch).
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    networks:
      - rosenweg-net
    deploy:
      placement:
        constraints:
          - node.hostname == docker-pve1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=Host(`www.rosenweg4303.ch`) && PathPrefix(`/traefik`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=cf"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$10$$CHANGE_THIS_HASH"
        - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

  # ============================================
  # Website - Static Files via Nginx
  # ============================================
  website:
    image: ghcr.io/rosenweg/rosenweg-website:latest
    networks:
      - rosenweg-net
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.hostname
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.rosenweg.rule=Host(`www.rosenweg4303.ch`) || Host(`rosenweg4303.ch`)"
        - "traefik.http.routers.rosenweg.entrypoints=websecure"
        - "traefik.http.routers.rosenweg.tls.certresolver=cf"
        - "traefik.http.services.rosenweg.loadbalancer.server.port=80"
        # Hinweis: Cloudflare→Origin laeuft als HTTP (Flexible SSL), darum https? im regex.
        - "traefik.http.middlewares.rosenweg-www.redirectregex.regex=^https?://rosenweg4303\\.ch/(.*)"
        - "traefik.http.middlewares.rosenweg-www.redirectregex.replacement=https://www.rosenweg4303.ch/$${1}"
        - "traefik.http.middlewares.rosenweg-www.redirectregex.permanent=true"
        # Saubere URLs ohne .html (z.B. /reklamationen -> /reklamationen.html)
        # ISP-Pfade (isp, isp-admin, isp-mein-zugang, wlan, tv, netzwerk,
        # verbindungen, dmarc) bewusst raus — die leben auf isp.rosenweg4303.ch.
        - "traefik.http.middlewares.rosenweg-clean-urls.redirectregex.regex=^https?://www\\.rosenweg4303\\.ch/(reklamationen|vollmachten|telefonbuch|handwerker|profil|hilfe|abholung|anfahrt|auslagen|brief-tracking|dashboard|echtheitspruefung|email-archiv|email-log|email-verteiler|energie-config|energie-monitor|entsorgung|grundbuch|loeschungen|mail-compose|mail-templates|objektverwaltung|personen|projekte|proxmox-verwaltung|rechteverwaltung|verwaltung|verwaltung-admin|verwaltung-2026|waschkueche|wohnungsverwaltung|zaehler|mail-approval-config|mail-empfaenger-admin|shelly-emulator-howto|auslagen-stundensatz|verwaltung-mail-outbox)/?$$"
        - "traefik.http.middlewares.rosenweg-clean-urls.redirectregex.replacement=https://www.rosenweg4303.ch/$${1}.html"
        - "traefik.http.middlewares.rosenweg-clean-urls.redirectregex.permanent=true"
        # Freundliche Alias-URL: /defekt-melden -> /reklamationen.html
        - "traefik.http.middlewares.rosenweg-alias-defekt.redirectregex.regex=^https?://www\\.rosenweg4303\\.ch/defekt-melden/?$$"
        - "traefik.http.middlewares.rosenweg-alias-defekt.redirectregex.replacement=https://www.rosenweg4303.ch/reklamationen.html"
        - "traefik.http.middlewares.rosenweg-alias-defekt.redirectregex.permanent=false"
        - "traefik.http.routers.rosenweg.middlewares=rosenweg-www,rosenweg-clean-urls,rosenweg-alias-defekt"
        # rosenweg9.ch wird NICHT mehr hierher umgeleitet — die Domain serviert
        # jetzt direkt den stweg3-Container (Router am stweg3-Service unten).
        - "shepherd.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================
  # ISP Frontend (isp.rosenweg4303.ch) — Frontend-only, /api/* wird im
  # nginx.isp.conf auf das geteilte api-Service weitergeleitet.
  # ============================================
  isp:
    image: ghcr.io/rosenweg/rosenweg-isp:latest
    networks:
      - rosenweg-net
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.hostname
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - "traefik.http.routers.rosenweg-isp.rule=Host(`isp.rosenweg4303.ch`)"
        - traefik.http.routers.rosenweg-isp.entrypoints=websecure
        - traefik.http.routers.rosenweg-isp.tls.certresolver=cf
        - traefik.http.services.rosenweg-isp.loadbalancer.server.port=80
        # noc.rosenweg4303.ch wird vom selben Container bedient (eigener
        # nginx-vhost in nginx.isp.conf -> noc-fullscreen.html).
        - "traefik.http.routers.noc.rule=Host(`noc.rosenweg4303.ch`)"
        - traefik.http.routers.noc.entrypoints=websecure
        - traefik.http.routers.noc.tls.certresolver=cf
        - traefik.http.routers.noc.service=rosenweg-isp
        - shepherd.enable=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================
  # API Backend - Node.js/Express
  # ============================================
  api:
    image: ghcr.io/rosenweg/rosenweg-api:latest
    # Port 3000 im LAN published, damit die Standalone-PBX-API (CT 220, NICHT im
    # Swarm) den Authentik-Login DIREKT reverse-proxien kann — nur der direkte
    # Ingress-Pfad (kein Traefik dazwischen) bewahrt X-Forwarded-Host=pbx, sonst
    # baut oauthRedirectUri den Callback faelschlich auf www. Nur LAN (100.64.2.x).
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    # ── Secrets via env_file (/root/.env) statt ${VAR} ──────────────────────
    # WICHTIG: KEINE Secret-${VAR} mehr in environment! Bei 'docker stack deploy'
    # expandiert ${VAR} aus der Aufrufer-Shell -> wenn ungesetzt = LEERSTRING und
    # ueberschreibt das Secret. env_file liest /root/.env direkt (shell-unabhaengig)
    # und bringt AUCH die frueher nur per --env-add gesetzten Secrets mit
    # (SMTP2GO_API_KEY, TRACKER_SHARED_SECRET, MAILCOW_API_*, GATEWAY_API_KEY ...).
    # NUR Nicht-Secret-Config + selbst-schuetzende ${VAR:-default} bleiben hier.
    env_file:
      - /root/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rosenweg
      DB_USER: rosenweg
      SMTP_HOST: mail-eu.smtp2go.com
      SMTP_PORT: "2525"
      MAIL_FROM: "noreply@rosenweg4303.ch"
      PORT: "3000"
      AUTHENTIK_URL: "http://100.64.2.37:9000"
      AUTHENTIK_EXTERNAL_URL: "https://authentik.rosenweg4303.ch"
      SITE_URL: "https://www.rosenweg4303.ch"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      ENERGY_DB_HOST: energy-db
      ENERGY_DB_PORT: "5432"
      ENERGY_DB_NAME: energy
      ENERGY_DB_USER: energy
      PVE_API_URL: https://100.64.2.20:8006
      DOCS_PATH: /documents
      WG_CONTROL_URL: "${WG_CONTROL_URL:-http://100.64.2.34:3001}"
      # NOC-Public-Dashboard hart offen (OPEN=1), unabhaengig vom Token.
      NOC_PUBLIC_OPEN: "1"
    volumes:
      - rosenweg-documents:/documents
    networks:
      - rosenweg-net
      - authentik_authentik-net
    deploy:
      replicas: 1
      # CIFS-Mount zum Fileserver (LXC 106 auf PVE1) ist nur von
      # docker-pve1 stabil (selber Host). Auf den anderen Nodes
      # scheitert der Mount mit input/output error.
      placement:
        constraints:
          - node.hostname == docker-pve1
      resources:
        limits:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "shepherd.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rosenweg
      POSTGRES_USER: rosenweg
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - rosenweg-pgdata:/var/lib/postgresql/data
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 256M
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosenweg"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Energy Collector - Modbus TCP → PostgreSQL
  # ============================================
  energy-collector:
    image: ghcr.io/rosenweg/energy-collector:latest
    # Port 3001 im LAN published, damit die nativen Frontend-LXCs (De-Swarm) die
    # /api/energy/-Upstream (rw_energy = 100.64.2.27:3001) ausserhalb des Overlays
    # erreichen. Interim bis energy-collector selbst in ein LXC zieht (Schritt 4).
    ports:
      - target: 3001
        published: 3001
        mode: ingress
    environment:
      METERS: "${ENERGY_METERS:-100.64.90.70:502:1:r9-haupt,100.64.90.71:502:1:r9-produktion,100.64.90.72:502:1:r9-allgemein,100.64.90.73:502:1:r9-eg1,100.64.90.74:502:1:r9-eg2,100.64.90.75:502:1:r9-eg3,100.64.90.76:502:1:r9-1og1,100.64.90.77:502:1:r9-1og2,100.64.90.78:502:1:r9-1og3,100.64.90.79:502:1:r9-2og1,100.64.90.80:502:1:r9-2og2,100.64.90.81:502:1:r9-2og3,100.64.90.82:502:1:r9-keller-neziri}"
      POLL_INTERVAL: "5"
      API_PORT: "3001"
      DB_HOST: energy-db
      DB_PORT: "5432"
      DB_NAME: energy
      DB_USER: energy
      DB_PASSWORD: "${ENERGY_DB_PASSWORD:-energy2026}"
      # MQTT-Publish der Zaehlerdaten (Broker = CT105 Mosquitto, VLAN2 .51).
      # MQTT_ENERGY_PASS kommt aus /root/.env (deploy-stack.sh sourct das).
      # Leer => Publish aus, Collector laeuft normal weiter.
      MQTT_URL: "${MQTT_URL:-mqtt://100.64.2.51:1883}"
      MQTT_USER: "${MQTT_USER:-collector}"
      MQTT_PASS: "${MQTT_ENERGY_PASS:-}"
      MQTT_PREFIX: "${MQTT_PREFIX:-energy}"
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "shepherd.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================
  # Energy Database - Separate PostgreSQL
  # ============================================
  energy-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: "${ENERGY_DB_PASSWORD:-energy2026}"
    volumes:
      - energy-pgdata:/var/lib/postgresql/data
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 256M
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Document Converter - LibreOffice via Gotenberg
  # ============================================
  doc-converter:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=120s"
      - "--libreoffice-disable-routes=false"
      - "--chromium-disable-routes=true"
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ============================================
  # TV Proxy (udpxy) ist BEWUSST nicht hier — Docker-Overlay leitet kein
  # Multicast durch (VXLAN dropt IGMP). udpxy laeuft in LXC 109 auf pve1
  # (100.64.9.200:4022, VLAN 9 = Init7-WAN). API-Default-UDPXY_HOST in
  # api/server.js zeigt direkt dorthin.
  # ============================================

  # ============================================
  # WhatsApp-Bot - bridged Bewohner-Bot via whatsapp-web.js
  # ============================================
  # Setup:
  #   1. WHATSAPP_SHARED_SECRET in .env setzen (gleicher Wert wie api)
  #   2. Service starten: docker service logs rosenweg_whatsapp-bot → QR scannen
  #   3. Session wird im Volume rosenweg-whatsapp-data persistiert
  # Deaktivieren: replicas auf 0 setzen oder ganzen Service entfernen
  whatsapp-bot:
    image: ghcr.io/rosenweg/rosenweg-whatsapp-bot:latest
    environment:
      # Node.js fetch (undici) toleriert Underscores im Hostnamen,
      # aber das interne Docker-Swarm-DNS resolved den Service unter
      # Stack-Prefix-Namen. 'api' alone wuerde nur klappen mit network alias.
      API_BASE: http://rosenweg_api:3000
      WHATSAPP_SHARED_SECRET: "${WHATSAPP_SHARED_SECRET}"
      WA_POLL_MS: "15000"
      WA_HEARTBEAT_MS: "30000"
      WA_HEALTH_PORT: "8080"
      WA_RECONNECT_MS: "30000"
      # ── Messaging-Gateway (eigener API-Server + SMTP-in + Web-UI) ──
      WA_GATEWAY_PORT: "8090"
      GW_SMTP_PORT: "2525"
      MAIN_API_BASE: http://rosenweg_api:3000
      GW_PUBLIC_HOST: whatsapp.rosenweg4303.ch
      # WA->Mail-Versand (Status, Bridge-Auto-Reply, Weiterleitungsregeln) ueber
      # PMG (CT 230, 100.64.2.31:25) -> SMTP2GO. Kein Auth (mynetworks-Trust).
      GW_NOTIFY_RELAY_HOST: "100.64.2.31"
      GW_NOTIFY_RELAY_PORT: "25"
      GW_NOTIFY_FROM: whatsapp-gateway@whatsapp.rosenweg4303.ch
    # SMTP-in (Mail->WhatsApp) host-published auf der gepinnten Node (.24), damit
    # PMG (nicht im Overlay) inbound Mail fuer whatsapp.rosenweg4303.ch hierher
    # transportieren kann. Absicherung: smtp_senders-Whitelist + iptables (nur PMG).
    ports:
      - target: 2525
        published: 2525
        protocol: tcp
        mode: host
    volumes:
      - whatsapp-data:/data
    networks:
      - rosenweg-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 0
      update_config:
        order: stop-first
      labels:
        - traefik.enable=true
        - "traefik.http.routers.whatsapp-gw.rule=Host(`whatsapp.rosenweg4303.ch`)"
        - traefik.http.routers.whatsapp-gw.entrypoints=websecure
        - traefik.http.routers.whatsapp-gw.tls.certresolver=cf
        - traefik.http.services.whatsapp-gw.loadbalancer.server.port=8090
        - shepherd.enable=true

  # ============================================
  # Syslog Collector - FPÜV Connection Logging
  # PBX (Asterisk) laeuft NICHT in Docker — eigenes LXC CT 220 auf pve2.
  # Configs unter pbx/ im Repo sind Source-of-Truth, werden via scp/Ansible
  # nach /etc/asterisk/ im LXC deployed. Siehe pbx/README.md.

  # ============================================
  # Shelly Pro 3EM Emulator (PV-Ueberschuss Rosenweg 9)
  # Emuliert ein virtuelles Shelly-Geraet das die zwei PV-Ueberschuss-
  # Datenpunkte als Phase-Leistungen ausspielt. mDNS-Announce fuer
  # Auto-Discovery in der Shelly-App.
  # ============================================
  shelly-emulator:
    image: ghcr.io/rosenweg/shelly-emulator:latest
    environment:
      BACKEND_URL: "https://www.rosenweg4303.ch/api/energy/shelly"
      POLL_MS: "10000"
      ENERGY_GROUP: "r9"
      SHELLY_HOSTNAME: "shellypvrosenweg9"
      PORT: "8089"
    ports:
      - target: 8089
        published: 8089
        mode: host
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "shepherd.enable=true"

  # ============================================
  syslog-collector:
    image: ghcr.io/rosenweg/syslog-collector:latest
    environment:
      SYSLOG_PORT: "5514"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rosenweg
      DB_USER: rosenweg
      DB_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "shepherd.enable=true"

  # ============================================
  # Shepherd - Auto-update Docker Swarm services
  # ============================================
  shepherd:
    image: mazzolino/shepherd:latest
    environment:
      SLEEP_TIME: "1m"
      FILTER_SERVICES: "label=shepherd.enable=true"
      IMAGE_AUTOCLEAN_LIMIT: "5"
      ROLLBACK_ON_FAILURE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ============================================
  # STWEG/MEG-Frontend-Container — ein Image (rosenweg-stweg), nginx waehlt
  # docroot per Host-Header (~^(stweg[1-7]|meg)\.). Pro Subdomain ein
  # Service (Isolation). meg = Tiefeinstellhalle (ex-stweg8).
  # ============================================

  stweg1:
    image: ghcr.io/rosenweg/rosenweg-stweg:latest
    networks:
      - rosenweg-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - "traefik.http.routers.stweg1.rule=Host(`stweg1.rosenweg4303.ch`)"
        - traefik.http.routers.stweg1.entrypoints=websecure
        - traefik.http.routers.stweg1.tls.certresolver=cf
        - traefik.http.services.stweg1.loadbalancer.server.port=80
        - shepherd.enable=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  stweg2:
