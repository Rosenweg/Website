<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitzungs-Doodle — Rosenweg</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/authentik-auth.js?v=2"></script>
  <script src="/js/nav.js?v=3"></script>
  <style>
    .vbtn { border:1px solid #e2e8f0; border-radius:.5rem; padding:.3rem .55rem; font-size:.95rem; cursor:pointer; background:#fff; }
    .vbtn.sel-ja { background:#16a34a; border-color:#16a34a; color:#fff; }
    .vbtn.sel-vielleicht { background:#f59e0b; border-color:#f59e0b; color:#fff; }
    .vbtn.sel-nein { background:#dc2626; border-color:#dc2626; color:#fff; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <nav id="main-nav" class="bg-white shadow sticky top-0 z-50"></nav>
  <script>try { RosenwegNav.init({ active: 'sitzungs-doodle' }); } catch (e) {}</script>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
      <h1 class="text-2xl font-bold text-teal-800">🗓️ Sitzungs-Doodle</h1>
      <div id="authbar" class="text-sm text-slate-600"></div>
    </div>

    <!-- Login-Gate für Nicht-Mitglieder -->
    <div id="login-box" class="hidden bg-white rounded-xl shadow p-5 mb-6 max-w-md">
      <p class="font-semibold mb-1">Anmelden zum Abstimmen</p>
      <p class="text-sm text-slate-500 mb-3">Mitglieder melden sich mit dem Rosenweg-Konto an. Eingeladene (z.&nbsp;B. Verwaltung) bekommen einen Code per E-Mail.</p>
      <button onclick="AuthentikAuth.login()" class="w-full mb-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 font-semibold">Mit Rosenweg-Konto anmelden</button>
      <div class="border-t pt-3">
        <div id="step-email">
          <label class="text-sm font-medium">E-Mail-Adresse</label>
          <input id="in-email" type="email" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="name@example.ch">
          <button onclick="requestCode()" class="w-full mt-2 bg-teal-700 hover:bg-teal-800 text-white rounded-lg py-2 font-semibold">Code anfordern</button>
        </div>
        <div id="step-code" class="hidden">
          <label class="text-sm font-medium">Code aus der E-Mail</label>
          <input id="in-code" inputmode="numeric" class="w-full border rounded-lg px-3 py-2 mt-1 tracking-widest text-center text-lg" placeholder="123456">
          <button onclick="verifyCode()" class="w-full mt-2 bg-teal-700 hover:bg-teal-800 text-white rounded-lg py-2 font-semibold">Anmelden</button>
          <button onclick="resetLogin()" class="w-full mt-1 text-sm text-slate-500">andere E-Mail</button>
        </div>
        <p id="login-msg" class="text-sm mt-2"></p>
      </div>
    </div>

    <div id="toolbar" class="hidden mb-4">
      <button id="btn-new" onclick="showCreate()" class="bg-teal-700 hover:bg-teal-800 text-white rounded-lg px-4 py-2 font-semibold">+ Neue Terminumfrage</button>
    </div>

    <div id="list" class="space-y-3"></div>
    <div id="detail" class="hidden"></div>
    <div id="create" class="hidden"></div>
  </main>

  <script>
    // ── Auth-Helfer: Mitglied (Authentik) ODER externer Code-Token ──────────
    function isMember() { return !!(window.AuthentikAuth && AuthentikAuth.isLoggedIn()); }
    function authToken() { return isMember() ? AuthentikAuth.getToken() : localStorage.getItem('doodleToken'); }
    function isAuthed() { return !!authToken(); }
    async function dFetch(path, opts = {}) {
      const t = authToken();
      const headers = Object.assign({}, opts.headers || {});
      if (t) headers.Authorization = 'Bearer ' + t;
      let body = opts.body;
      if (body && typeof body === 'object') { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
      const r = await fetch(path, Object.assign({}, opts, { headers, body }));
      if (r.status === 401 && !isMember()) { localStorage.removeItem('doodleToken'); render(); }
      return r;
    }
    let ME = null;
    let ZD = { stwegen: [], projekte: [], gremien: ['Ausschuss', 'Präsidium', 'Technik'] };
    const FILTER = { stweg: null, project: null, gremium: null };
    const $ = id => document.getElementById(id);
    async function loadZuordnung() {
      try { const r = await fetch('/site-config.json'); const c = await r.json(); ZD.stwegen = (c.stwegen || []).map(s => ({ n: parseInt(String(s.slug || '').replace(/\D/g, ''), 10), name: s.name || s.label || s.slug })); } catch (e) {}
      if (isMember()) { try { const r = await dFetch('/api/projects-mini'); const d = await r.json(); ZD.projekte = d.projekte || []; } catch (e) {} }
    }
    const stwegName = n => { const s = ZD.stwegen.find(x => x.n === Number(n)); return s ? (s.name || ('STWEG ' + n)) : ('STWEG ' + n); };
    const projName = slug => { const p = ZD.projekte.find(x => x.slug === slug); return p ? (p.title || slug) : slug; };
    function zBadges(p) {
      let h = '';
      if (p.stweg) h += `<span class="text-xs bg-sky-100 text-sky-700 rounded-full px-2 py-0.5">🏠 ${escapeHtml(stwegName(p.stweg))}</span> `;
      if (p.project_slug) h += `<span class="text-xs bg-violet-100 text-violet-700 rounded-full px-2 py-0.5">🏗 ${escapeHtml(projName(p.project_slug))}</span> `;
      if (p.gremium) h += `<span class="text-xs bg-amber-100 text-amber-700 rounded-full px-2 py-0.5">👥 ${escapeHtml(p.gremium)}</span> `;
      return h;
    }
    const fmtDate = s => { if (!s) return ''; try { return new Date(s).toLocaleString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return s; } };
    const fmtDay = s => { if (!s) return ''; try { return new Date(s).toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }); } catch { return s; } };
    const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ── E-Mail-Code-Login ───────────────────────────────────────────────────
    async function requestCode() {
      const email = $('in-email').value.trim().toLowerCase();
      $('login-msg').textContent = '';
      if (!email) return;
      const r = await fetch('/api/doodle/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('login-msg').className = 'text-sm mt-2 text-red-600'; $('login-msg').textContent = d.error || 'Fehler'; return; }
      window._doodleEmail = email;
      $('step-email').classList.add('hidden'); $('step-code').classList.remove('hidden');
      $('login-msg').className = 'text-sm mt-2 text-green-700'; $('login-msg').textContent = 'Code gesendet — bitte E-Mail prüfen.';
    }
    async function verifyCode() {
      const code = $('in-code').value.trim();
      const r = await fetch('/api/doodle/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: window._doodleEmail, code }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('login-msg').className = 'text-sm mt-2 text-red-600'; $('login-msg').textContent = d.error || 'Fehler'; return; }
      localStorage.setItem('doodleToken', d.token);
      if (d.voter) localStorage.setItem('doodleVoter', JSON.stringify(d.voter));
      render();
    }
    function resetLogin() { $('step-code').classList.add('hidden'); $('step-email').classList.remove('hidden'); $('login-msg').textContent = ''; }
    function logoutDoodle() { localStorage.removeItem('doodleToken'); localStorage.removeItem('doodleVoter'); render(); }

    // ── Haupt-Render ────────────────────────────────────────────────────────
    async function render() {
      const authed = isAuthed();
      $('login-box').classList.toggle('hidden', authed);
      $('toolbar').classList.add('hidden');
      $('detail').classList.add('hidden'); $('create').classList.add('hidden');
      $('list').classList.remove('hidden');
      if (!authed) {
        $('authbar').innerHTML = '';
        $('list').innerHTML = '<p class="text-slate-500">Bitte zuerst anmelden.</p>';
        return;
      }
      // Auth-Bar
      let who = '';
      if (isMember()) { const u = AuthentikAuth.getUser(); who = `Angemeldet als <b>${escapeHtml(u?.name || u?.email || '')}</b>`; }
      else { const v = JSON.parse(localStorage.getItem('doodleVoter') || '{}'); who = `Angemeldet als <b>${escapeHtml(v.name || v.email || '')}</b> (Gast) · <a href="#" onclick="logoutDoodle();return false" class="text-teal-700 underline">abmelden</a>`; }
      $('authbar').innerHTML = who;
      await loadZuordnung();
      const q = new URLSearchParams(location.search);
      FILTER.stweg = q.get('stweg'); FILTER.project = q.get('project'); FILTER.gremium = q.get('gremium');
      if (q.get('new') === '1' && isMember()) { await loadList(); showCreate(); return; }
      await loadList();
      const pid = q.get('poll');
      if (pid) openPoll(parseInt(pid, 10));
    }

    async function loadList() {
      const qs = [];
      if (FILTER.stweg) qs.push('stweg=' + encodeURIComponent(FILTER.stweg));
      if (FILTER.project) qs.push('project=' + encodeURIComponent(FILTER.project));
      if (FILTER.gremium) qs.push('gremium=' + encodeURIComponent(FILTER.gremium));
      const r = await dFetch('/api/doodle/polls' + (qs.length ? '?' + qs.join('&') : ''));
      if (!r.ok) { $('list').innerHTML = '<p class="text-red-600">Konnte Umfragen nicht laden.</p>'; return; }
      const d = await r.json(); ME = d.me || null;
      $('toolbar').classList.toggle('hidden', !(ME && ME.isMember));
      const polls = d.polls || [];
      let head = '';
      if (FILTER.stweg || FILTER.project || FILTER.gremium) {
        const lbl = FILTER.project ? ('Projekt: ' + projName(FILTER.project)) : FILTER.stweg ? stwegName(FILTER.stweg) : ('Gremium: ' + FILTER.gremium);
        head = `<div class="flex items-center justify-between mb-2"><span class="text-sm text-slate-600">Gefiltert auf <b>${escapeHtml(lbl)}</b></span><a href="${location.pathname}" class="text-sm text-teal-700 underline">alle anzeigen</a></div>`;
      }
      if (!polls.length) { $('list').innerHTML = head + '<p class="text-slate-500">Keine Terminumfragen.</p>'; return; }
      $('list').innerHTML = head + polls.map(p => {
        const closed = p.status !== 'offen';
        const badge = closed ? '<span class="text-xs bg-slate-200 text-slate-600 rounded-full px-2 py-0.5">geschlossen</span>'
          : '<span class="text-xs bg-green-100 text-green-700 rounded-full px-2 py-0.5">offen</span>';
        const voted = p.i_voted ? '<span class="text-xs text-teal-700">✓ abgestimmt</span>' : '';
        const termin = (closed && p.final_starts_at) ? '<span class="text-emerald-700 font-medium">📅 ' + fmtDate(p.final_starts_at) + '</span>'
          : (closed && p.final_label) ? '<span class="text-emerald-700 font-medium">📅 ' + escapeHtml(p.final_label) + '</span>' : '';
        const zb = zBadges(p);
        return `<div class="bg-white rounded-xl shadow p-4 cursor-pointer hover:shadow-md" onclick="openPoll(${p.id})">
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-semibold text-lg">${escapeHtml(p.titel)}</h3>${badge}
          </div>
          ${zb ? '<div class="mt-1 flex flex-wrap gap-1">' + zb + '</div>' : ''}
          <div class="text-sm text-slate-500 mt-1 flex flex-wrap gap-x-4 gap-y-1">
            ${p.ort ? '<span>📍 ' + escapeHtml(p.ort) + '</span>' : ''}
            <span>📋 ${p.options_count} Termine</span>
            <span>👥 ${p.voters_count} Stimmen</span>
            ${p.deadline && !closed ? '<span>⏰ bis ' + fmtDay(p.deadline) + '</span>' : ''}
            ${termin}
            ${voted}
          </div>
          <div class="text-xs text-slate-400 mt-1">von ${escapeHtml(p.creator_name || '—')}</div>
        </div>`;
      }).join('');
    }

    // ── Detail / Abstimmen ──────────────────────────────────────────────────
    let CUR = null, MYVOTES = {};
    async function openPoll(id) {
      const r = await dFetch('/api/doodle/polls/' + id);
      if (!r.ok) { const d = await r.json().catch(() => ({})); alert(d.error || 'Fehler'); return; }
      CUR = await r.json();
      MYVOTES = {};
      const myEmail = (CUR.me.email || '').toLowerCase();
      CUR.votes.filter(v => (v.voter_email || '').toLowerCase() === myEmail).forEach(v => { MYVOTES[v.option_id] = v.wert; });
      renderDetail();
    }
    function setVote(optId, wert) {
      if (CUR.poll.status !== 'offen') return;
      MYVOTES[optId] = (MYVOTES[optId] === wert) ? undefined : wert;
      if (MYVOTES[optId] === undefined) delete MYVOTES[optId];
      renderDetail(true);
    }
    function renderDetail(keepScroll) {
      const y = keepScroll ? window.scrollY : 0;
      $('list').classList.add('hidden'); $('toolbar').classList.add('hidden'); $('create').classList.add('hidden');
      $('detail').classList.remove('hidden');
      const p = CUR.poll, opts = CUR.options, votes = CUR.votes;
      // Zählungen je Option
      const cnt = {}; opts.forEach(o => cnt[o.id] = { ja: 0, vielleicht: 0, nein: 0 });
      votes.forEach(v => { if (cnt[v.option_id]) cnt[v.option_id][v.wert]++; });
      const maxJa = Math.max(0, ...opts.map(o => cnt[o.id].ja));
      const finalId = p.final_option_id;
      const closed = p.status !== 'offen';
      // Wähler-Liste (Matrix)
      const voters = [...new Set(votes.map(v => (v.voter_email || '').toLowerCase()))];
      const voterName = {}; votes.forEach(v => { voterName[(v.voter_email || '').toLowerCase()] = v.voter_name || v.voter_email; });
      const voteOf = {}; votes.forEach(v => { voteOf[(v.voter_email || '').toLowerCase() + '|' + v.option_id] = v.wert; });
      const sym = { ja: '<span class="text-green-600">✓</span>', vielleicht: '<span class="text-amber-500">?</span>', nein: '<span class="text-red-500">✗</span>' };

      const needName = !isMember() && !(JSON.parse(localStorage.getItem('doodleVoter') || '{}').name);

      $('detail').innerHTML = `
        <button onclick="backToList()" class="text-teal-700 mb-3">← zurück</button>
        <div class="bg-white rounded-xl shadow p-5">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <h2 class="text-xl font-bold">${escapeHtml(p.titel)}</h2>
            <span class="text-xs ${closed ? 'bg-slate-200 text-slate-600' : 'bg-green-100 text-green-700'} rounded-full px-2 py-0.5">${closed ? 'geschlossen' : 'offen'}</span>
          </div>
          ${p.ort ? '<p class="text-slate-500 mt-1">📍 ' + escapeHtml(p.ort) + '</p>' : ''}
          ${zBadges(p) ? '<div class="mt-2 flex flex-wrap gap-1">' + zBadges(p) + '</div>' : ''}
          ${p.beschreibung ? '<p class="mt-2 whitespace-pre-line">' + escapeHtml(p.beschreibung) + '</p>' : ''}
          ${p.deadline && !closed ? '<p class="text-sm text-slate-400 mt-1">⏰ Frist: ' + fmtDate(p.deadline) + '</p>' : ''}
          ${closed && finalId ? (() => { const fo = opts.find(o => o.id === finalId) || {}; return '<div class="mt-3 bg-green-50 border border-green-200 rounded-lg p-3">✅ <b>Termin steht fest:</b> ' + escapeHtml(fo.label || '') + (fo.starts_at ? ' — <b>' + fmtDate(fo.starts_at) + '</b>' : '') + '</div>'; })() : ''}

          <h3 class="font-semibold mt-5 mb-2">${closed ? 'Ergebnis' : 'Deine Stimme'}</h3>
          ${needName ? '<input id="voter-name" placeholder="Dein Name" class="border rounded-lg px-3 py-2 mb-3 w-full max-w-xs">' : ''}
          <div class="space-y-2">
            ${opts.map(o => {
              const c = cnt[o.id]; const best = c.ja === maxJa && maxJa > 0;
              const mine = MYVOTES[o.id];
              return `<div class="border rounded-lg p-3 ${best ? 'bg-green-50 border-green-200' : ''} ${finalId === o.id ? 'ring-2 ring-green-500' : ''}">
                <div class="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div class="font-medium">${escapeHtml(o.label)}${o.added_by ? " <span class='text-xs text-slate-400'>(ergänzt)</span>" : ''}</div>
                    ${o.starts_at ? '<div class="text-sm text-slate-500">' + fmtDate(o.starts_at) + '</div>' : ''}
                    <div class="text-xs text-slate-500 mt-0.5">✓ ${c.ja} · ? ${c.vielleicht} · ✗ ${c.nein}</div>
                  </div>
                  ${!closed ? `<div class="flex gap-1">
                    <button class="vbtn ${mine === 'ja' ? 'sel-ja' : ''}" onclick="setVote(${o.id},'ja')">Ja</button>
                    <button class="vbtn ${mine === 'vielleicht' ? 'sel-vielleicht' : ''}" onclick="setVote(${o.id},'vielleicht')">Vielleicht</button>
                    <button class="vbtn ${mine === 'nein' ? 'sel-nein' : ''}" onclick="setVote(${o.id},'nein')">Nein</button>
                  </div>` : (CUR.me.canManage ? `<button onclick="setFinal(${o.id})" class="text-sm text-teal-700 underline">als Termin wählen</button>` : '')}
                </div>
              </div>`;
            }).join('')}
          </div>

          ${(!closed && p.allow_add_options) ? `<div class="mt-3">
            <input id="add-opt" placeholder="Eigenen Terminvorschlag hinzufügen" class="border rounded-lg px-3 py-2 w-full max-w-md">
            <button onclick="addOption()" class="ml-1 text-sm text-teal-700 underline">+ hinzufügen</button>
          </div>` : ''}

          ${!closed ? `<button onclick="saveVote()" class="mt-4 bg-teal-700 hover:bg-teal-800 text-white rounded-lg px-5 py-2 font-semibold">Stimme speichern</button>
            <span id="vote-msg" class="ml-3 text-sm"></span>` : ''}

          ${voters.length ? `<h3 class="font-semibold mt-6 mb-2">Übersicht (${voters.length})</h3>
            <div class="overflow-x-auto"><table class="text-sm border-collapse">
              <tr><th class="text-left p-1"></th>${opts.map(o => '<th class="p-1 text-center">' + escapeHtml((o.label || '').slice(0, 16)) + '</th>').join('')}</tr>
              ${voters.map(ve => '<tr class="border-t"><td class="p-1 pr-3">' + escapeHtml(voterName[ve]) + '</td>' + opts.map(o => '<td class="p-1 text-center">' + (sym[voteOf[ve + '|' + o.id]] || '·') + '</td>').join('') + '</tr>').join('')}
            </table></div>` : ''}

          ${CUR.me.canManage ? `<div class="mt-6 pt-4 border-t flex flex-wrap gap-2">
            ${!closed ? `<button onclick="closePoll()" class="bg-slate-700 text-white rounded-lg px-4 py-2 text-sm">Umfrage schliessen</button>` : `<button onclick="reopenPoll()" class="bg-slate-200 rounded-lg px-4 py-2 text-sm">wieder öffnen</button>`}
            <button onclick="deletePoll()" class="text-red-600 text-sm px-2">löschen</button>
            ${CUR.invites && CUR.invites.length ? '<span class="text-xs text-slate-400 self-center">Eingeladen: ' + CUR.invites.map(i => escapeHtml(i.email)).join(', ') + '</span>' : ''}
          </div>` : ''}
        </div>`;
      window.scrollTo(0, y);
    }
    function backToList() { history.replaceState(null, '', location.pathname); CUR = null; render(); }
    let _pendingNewOpts = [];
    function addOption() {
      const el = $('add-opt'); const label = el.value.trim(); if (!label) return;
      _pendingNewOpts.push(label);
      CUR.options.push({ id: 'new' + _pendingNewOpts.length, label, starts_at: null, added_by: CUR.me.email });
      el.value = ''; renderDetail(true);
    }
    async function saveVote() {
      const votes = {}; Object.entries(MYVOTES).forEach(([k, v]) => { if (!String(k).startsWith('new')) votes[k] = v; });
      const body = { votes };
      if (_pendingNewOpts.length) body.new_options = _pendingNewOpts;
      const nameEl = $('voter-name'); if (nameEl && nameEl.value.trim()) body.name = nameEl.value.trim();
      const r = await dFetch('/api/doodle/polls/' + CUR.poll.id + '/vote', { method: 'POST', body });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { if ($('vote-msg')) { $('vote-msg').className = 'ml-3 text-sm text-red-600'; $('vote-msg').textContent = d.error || 'Fehler'; } return; }
      if (nameEl && nameEl.value.trim()) { const v = JSON.parse(localStorage.getItem('doodleVoter') || '{}'); v.name = nameEl.value.trim(); localStorage.setItem('doodleVoter', JSON.stringify(v)); }
      _pendingNewOpts = [];
      openPoll(CUR.poll.id);
    }
    async function setFinal(optId) { await dFetch('/api/doodle/polls/' + CUR.poll.id, { method: 'PUT', body: { final_option_id: optId } }); openPoll(CUR.poll.id); }
    async function closePoll() {
      let finalId = CUR.poll.final_option_id;
      if (!finalId) {
        const c = {}; CUR.options.forEach(o => c[o.id] = 0); CUR.votes.forEach(v => { if (v.wert === 'ja' && c[v.option_id] != null) c[v.option_id]++; });
        const best = CUR.options.slice().sort((a, b) => c[b.id] - c[a.id])[0];
        if (best && confirm('Umfrage schliessen und "' + best.label + '" als Termin festlegen? (Teilnehmer werden per E-Mail informiert)')) finalId = best.id;
        else if (!confirm('Umfrage ohne festgelegten Termin schliessen?')) return;
      }
      await dFetch('/api/doodle/polls/' + CUR.poll.id, { method: 'PUT', body: { status: 'geschlossen', final_option_id: finalId || null } });
      openPoll(CUR.poll.id);
    }
    async function reopenPoll() { await dFetch('/api/doodle/polls/' + CUR.poll.id, { method: 'PUT', body: { status: 'offen' } }); openPoll(CUR.poll.id); }
    async function deletePoll() { if (!confirm('Diese Umfrage wirklich löschen?')) return; await dFetch('/api/doodle/polls/' + CUR.poll.id, { method: 'DELETE' }); backToList(); }

    // ── Anlegen ─────────────────────────────────────────────────────────────
    function showCreate() {
      $('list').classList.add('hidden'); $('toolbar').classList.add('hidden'); $('detail').classList.add('hidden');
      $('create').classList.remove('hidden');
      $('create').innerHTML = `
        <button onclick="history.replaceState(null,'',location.pathname);FILTER.stweg=FILTER.project=FILTER.gremium=null;render()" class="text-teal-700 mb-3">← zurück</button>
        <div class="bg-white rounded-xl shadow p-5 space-y-3">
          <h2 class="text-xl font-bold">Neue Terminumfrage</h2>
          <div><label class="text-sm font-medium">Titel *</label><input id="c-titel" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="z.B. Eigentümerversammlung Herbst"></div>
          <div><label class="text-sm font-medium">Beschreibung</label><textarea id="c-besch" class="w-full border rounded-lg px-3 py-2 mt-1" rows="2"></textarea></div>
          <div class="flex gap-3 flex-wrap">
            <div class="flex-1 min-w-[160px]"><label class="text-sm font-medium">Ort</label><input id="c-ort" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="optional"></div>
            <div class="flex-1 min-w-[160px]"><label class="text-sm font-medium">Abstimm-Frist</label><input id="c-deadline" type="date" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
          </div>
          <div>
            <label class="text-sm font-medium">Terminvorschläge *</label>
            <div id="c-options" class="space-y-2 mt-1"></div>
            <button onclick="addOptRow()" class="text-sm text-teal-700 underline mt-1">+ Vorschlag</button>
          </div>
          <label class="flex items-center gap-2 text-sm"><input id="c-allowadd" type="checkbox"> Teilnehmer dürfen eigene Vorschläge ergänzen</label>
          <div>
            <label class="text-sm font-medium">Zuordnung <span class="text-slate-400 font-normal">(optional — für Direktanzeige am richtigen Ort)</span></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-1">
              <select id="c-stweg" class="border rounded-lg px-3 py-2"><option value="">STWEG —</option></select>
              <select id="c-project" class="border rounded-lg px-3 py-2"><option value="">Projekt —</option></select>
              <select id="c-gremium" class="border rounded-lg px-3 py-2"><option value="">Gremium —</option></select>
            </div>
          </div>
          <div><label class="text-sm font-medium">Externe einladen (E-Mails, z.B. Verwaltung)</label>
            <textarea id="c-invites" class="w-full border rounded-lg px-3 py-2 mt-1" rows="2" placeholder="verwaltung@example.ch, ..."></textarea>
            <p class="text-xs text-slate-400">Komma- oder zeilengetrennt. Sie erhalten eine Einladung und stimmen per E-Mail-Code ab.</p>
          </div>
          <button onclick="createPoll()" class="bg-teal-700 hover:bg-teal-800 text-white rounded-lg px-5 py-2 font-semibold">Umfrage erstellen</button>
          <span id="c-msg" class="ml-3 text-sm"></span>
        </div>`;
      addOptRow(); addOptRow();
      const ss = $('c-stweg'); ZD.stwegen.filter(s => s.n).sort((a, b) => a.n - b.n).forEach(s => { const o = document.createElement('option'); o.value = s.n; o.textContent = s.name || ('STWEG ' + s.n); ss.appendChild(o); });
      const ps = $('c-project'); ZD.projekte.forEach(p => { const o = document.createElement('option'); o.value = p.slug; o.textContent = p.title || p.slug; ps.appendChild(o); });
      const gs = $('c-gremium'); ZD.gremien.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; gs.appendChild(o); });
      if (FILTER.stweg) ss.value = FILTER.stweg;
      if (FILTER.project) ps.value = FILTER.project;
      if (FILTER.gremium) gs.value = FILTER.gremium;
    }
    function addOptRow() {
      const div = document.createElement('div');
      div.className = 'flex gap-2';
      div.innerHTML = `<input class="c-opt-label flex-1 border rounded-lg px-3 py-2" placeholder="Terminvorschlag (z.B. Mo 12. Okt, 19:30)">
        <input class="c-opt-dt border rounded-lg px-2 py-2" type="datetime-local" title="optional strukturiertes Datum">
        <button onclick="this.parentNode.remove()" class="text-red-500 px-2">✕</button>`;
      $('c-options').appendChild(div);
    }
    async function createPoll() {
      const titel = $('c-titel').value.trim();
      if (!titel) { $('c-msg').className = 'ml-3 text-sm text-red-600'; $('c-msg').textContent = 'Titel fehlt'; return; }
      const options = [...document.querySelectorAll('#c-options > div')].map(d => {
        const label = d.querySelector('.c-opt-label').value.trim();
        const dt = d.querySelector('.c-opt-dt').value;
        return label ? { label, starts_at: dt || null } : null;
      }).filter(Boolean);
      if (!options.length) { $('c-msg').className = 'ml-3 text-sm text-red-600'; $('c-msg').textContent = 'Mindestens ein Terminvorschlag'; return; }
      const invites = $('c-invites').value.split(/[\s,;]+/).map(s => s.trim()).filter(s => s.includes('@'));
      const body = {
        titel, beschreibung: $('c-besch').value.trim() || null, ort: $('c-ort').value.trim() || null,
        deadline: $('c-deadline').value || null, allow_add_options: $('c-allowadd').checked, options, invites,
        stweg: $('c-stweg').value || null, project_slug: $('c-project').value || null, gremium: $('c-gremium').value || null,
      };
      const r = await dFetch('/api/doodle/polls', { method: 'POST', body });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('c-msg').className = 'ml-3 text-sm text-red-600'; $('c-msg').textContent = d.error || 'Fehler'; return; }
      history.replaceState(null, '', location.pathname); FILTER.stweg = FILTER.project = FILTER.gremium = null; render();
    }

    // ── Init ────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      try { await AuthentikAuth.init({ requireAuth: false }); } catch (e) {}
      render();
    });
  </script>
</body>
</html>
