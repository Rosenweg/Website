# PMG: Postfix-Zeilen (smtpd, postscreen, submission, smtps-edge) an CrowdSec
# auf dem Edge (100.64.2.40:4514/udp, nur fuer PMG freigegeben). Dort werten
# die Parser crowdsecurity/postfix-logs und postscreen-logs sie aus
# (Spam-Bots, Relay-Versuche, HELO-Missbrauch, Nicht-SMTP-Befehle).
# Die Mail-Protokollierung in /var/log/mail.log bleibt unveraendert.
if ($programname startswith "postfix") then {
  action(type="omfwd" target="100.64.2.40" port="4514" protocol="udp"
         template="RSYSLOG_SyslogProtocol23Format"
         queue.type="LinkedList" queue.size="10000" action.resumeRetryCount="-1")
}
