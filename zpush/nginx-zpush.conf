server {
    listen 80 default_server;
    server_name contacts.rosenweg4303.ch _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name contacts.rosenweg4303.ch _;
    ssl_certificate     /etc/letsencrypt/live/contacts.rosenweg4303.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contacts.rosenweg4303.ch/privkey.pem;
    root /usr/share/z-push/src;
    client_max_body_size 64m;
    location /Microsoft-Server-ActiveSync {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 3600;
        fastcgi_buffers 64 256k;
    }
    location ~ ^/[Aa]utodiscover/[Aa]utodiscover.xml$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/autodiscover/autodiscover.php;
        include fastcgi_params;
    }
    location / { return 200 "Rosenweg Kontakte-Sync (ActiveSync)\n"; default_type text/plain; }
}
