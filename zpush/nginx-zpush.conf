# Obergrenze fuer ActiveSync-Anfragen (D-7, 17.11.2026): jede Anfrage ist ein
# LDAP-Bind gegen Authentik. Achtung: edge-traefik reicht TCP ohne PROXY-Protokoll
# durch -> $binary_remote_addr ist fuer ALLE Clients die Edge-IP, das Limit wirkt
# also gemeinsam (Deckel gegen Massen-Raten, nicht je Client). Je Benutzer sperrt
# backend-rosenweg.php nach Fehlversuchen. Datei liegt in sites-enabled (http-Kontext).
limit_req_zone $binary_remote_addr zone=zpush_as:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name contacts.rosenweg4303.ch _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name contacts.rosenweg4303.ch _;
    ssl_certificate     /etc/letsencrypt/live/contacts.rosenweg4303.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contacts.rosenweg4303.ch/privkey.pem;
    root /usr/share/z-push/src;
    client_max_body_size 64m;
    location /Microsoft-Server-ActiveSync {
        limit_req zone=zpush_as burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 3600;
        fastcgi_buffers 64 256k;
    }
    location ~ ^/[Aa]utodiscover/[Aa]utodiscover.xml$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/autodiscover/autodiscover.php;
        include fastcgi_params;
    }
    location / { return 200 "Rosenweg Kontakte-Sync (ActiveSync)\n"; default_type text/plain; }
}
