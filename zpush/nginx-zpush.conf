# Obergrenze fuer ActiveSync-Anfragen (D-7, 17.11.2026): jede Anfrage ist ein
# LDAP-Bind gegen Authentik. Seit 18.11.2026 endet TLS auf edge-traefik (CT 245),
# der per HTTP mit X-Forwarded-For weiterreicht -> real_ip setzt die echte
# Client-Adresse, Limit und Fehlversuch-Sperre (backend-rosenweg.php) wirken je
# Client. Datei liegt in sites-enabled (http-Kontext).
limit_req_zone $binary_remote_addr zone=zpush_as:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name contacts.rosenweg4303.ch _;
    # Nur edge-traefik darf liefern (TLS endet dort). $realip_remote_addr ist die
    # Verbindungsadresse vor real_ip - allow/deny saehe schon die Client-IP.
    set_real_ip_from 100.64.2.40;
    real_ip_header X-Forwarded-For;
    if ($realip_remote_addr != "100.64.2.40") { return 403; }
    root /usr/share/z-push/src;
    client_max_body_size 64m;
    location /Microsoft-Server-ActiveSync {
        limit_req zone=zpush_as burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/index.php;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 3600;
        fastcgi_buffers 64 256k;
    }
    location ~ ^/[Aa]utodiscover/[Aa]utodiscover.xml$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/z-push/src/autodiscover/autodiscover.php;
        include fastcgi_params;
        fastcgi_param HTTPS on;
    }
    location / { return 200 "Rosenweg Kontakte-Sync (ActiveSync)\n"; default_type text/plain; }
}
