<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verwaltungssuche 2026 - STWEG-Kooperation Rosenweg</title>
    <link rel="icon" href="/logo-rosenweg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/mobile.css?v=1">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Minimaler Header (kein Login nötig) -->
    <header class="bg-white shadow">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="/logo-rosenweg.png" alt="Rosenweg" class="h-10 w-auto">
                <span class="text-lg font-semibold text-gray-800">Rosenweg</span>
            </a>
            <span class="text-sm text-gray-500">STWEG-Kooperation</span>
        </div>
    </header>

    <section class="bg-gradient-to-r from-emerald-600 to-emerald-800 text-white py-12">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-2 text-sm text-emerald-100 mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                Oeffentlich zugaenglich — kein Login erforderlich
            </div>
            <h1 id="title" class="text-3xl font-bold mb-2">Verwaltungssuche 2026</h1>
            <p id="description" class="text-lg opacity-90"></p>
            <p id="status-badge" class="inline-block mt-3 px-3 py-1 rounded-full text-sm font-medium"></p>
        </div>
    </section>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">
        <div id="loading" class="text-center text-gray-400 py-12">Lade Projektdaten...</div>
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center text-red-700"></div>
        <div id="content" class="hidden space-y-10"></div>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-8 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-sm">
            <p>STWEG-Kooperation Rosenweg, 4303 Kaiseraugst &nbsp;&middot;&nbsp; <a href="mailto:ausschuss@rosenweg4303.ch" class="hover:text-white">ausschuss@rosenweg4303.ch</a></p>
        </div>
    </footer>

    <script>
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const SLUG = new URLSearchParams(location.search).get('slug') || 'verwaltungssuche-2026';

    const STATUS_COLORS = {
        'aktiv': 'bg-green-200 text-green-900',
        'abgeschlossen': 'bg-gray-200 text-gray-700',
        'pausiert': 'bg-yellow-200 text-yellow-900',
    };
    const CAND_COLORS = {
        'angefragt': 'bg-gray-100 text-gray-700',
        'offerte erhalten': 'bg-blue-100 text-blue-700',
        'in bewertung': 'bg-amber-100 text-amber-800',
        'favorit': 'bg-emerald-100 text-emerald-800',
        'gewählt': 'bg-emerald-600 text-white',
        'abgelehnt': 'bg-red-100 text-red-700',
    };

    function fileIcon(path) {
        const ext = path.split('.').pop().toLowerCase();
        if (ext === 'pdf') return '\u{1F4C4}';
        if (['xlsx','xls'].includes(ext)) return '\u{1F4CA}';
        if (['docx','doc'].includes(ext)) return '\u{1F4DD}';
        return '\u{1F4CE}';
    }

    function fileName(path) { return decodeURIComponent(path).split('/').pop(); }

    async function load() {
        try {
            const r = await fetch('/api/public/project/' + encodeURIComponent(SLUG));
            if (!r.ok) {
                const e = await r.json().catch(() => ({}));
                throw new Error(e.error || 'Projekt nicht gefunden');
            }
            const p = await r.json();
            render(p);
        } catch(e) {
            document.getElementById('loading').classList.add('hidden');
            const errEl = document.getElementById('error');
            errEl.textContent = e.message;
            errEl.classList.remove('hidden');
        }
    }

    function render(p) {
        document.title = p.title + ' - Rosenweg';
        document.getElementById('title').textContent = p.title;
        document.getElementById('description').textContent = p.description || '';
        const sb = document.getElementById('status-badge');
        sb.textContent = 'Status: ' + p.status;
        sb.className = 'inline-block mt-3 px-3 py-1 rounded-full text-sm font-medium ' + (STATUS_COLORS[p.status] || 'bg-gray-200');

        // Group attachments by candidate / timeline
        const attsByCand = {};
        const attsByTl = {};
        for (const a of p.attachments || []) {
            if (a.target_type === 'kandidaten') (attsByCand[a.target_id] ||= []).push(a);
            else if (a.target_type === 'timeline') (attsByTl[a.target_id] ||= []).push(a);
        }

        let html = '';

        // Timeline
        if (p.timeline?.length) {
            html += `<section>
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Zeitplan
                </h2>
                <div class="bg-white rounded-lg shadow-sm divide-y">`;
            for (const t of p.timeline) {
                const date = new Date(t.datum).toLocaleDateString('de-CH', { day: '2-digit', month: 'short', year: 'numeric' });
                const tlAtts = attsByTl[t.id] || [];
                const attHtml = tlAtts.map(a => `<a href="/api/public/project/${encodeURIComponent(SLUG)}/document/${encodeURIComponent(a.doc_path)}" target="_blank" class="inline-flex items-center gap-1 text-emerald-600 hover:underline text-xs ml-2 mt-1">${fileIcon(a.doc_path)} ${esc(fileName(a.doc_path))}</a>`).join('');
                html += `<div class="p-4 flex gap-4">
                    <div class="flex-shrink-0 w-6 h-6 rounded-full ${t.erledigt ? 'bg-emerald-500' : 'bg-gray-300'} flex items-center justify-center">
                        ${t.erledigt ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                    </div>
                    <div class="flex-1">
                        <div class="text-xs text-gray-500">${date}</div>
                        <h3 class="font-semibold text-gray-800">${esc(t.titel)}</h3>
                        ${t.beschreibung ? `<p class="text-sm text-gray-600 mt-1">${esc(t.beschreibung)}</p>` : ''}
                        ${attHtml}
                    </div>
                </div>`;
            }
            html += '</div></section>';
        }

        // Candidates
        if (p.candidates?.length) {
            html += `<section>
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    Anbieter / Offerten
                </h2>
                <div class="space-y-4">`;

            // Sort: favorit first, then in bewertung, then offerte erhalten, angefragt, abgelehnt
            const order = { 'gewählt': -1, 'favorit': 0, 'in bewertung': 1, 'offerte erhalten': 2, 'angefragt': 3, 'abgelehnt': 9 };
            const sorted = [...p.candidates].sort((a, b) => (order[a.status] ?? 5) - (order[b.status] ?? 5));

            for (const c of sorted) {
                const atts = attsByCand[c.id] || [];
                const statusCls = CAND_COLORS[c.status] || 'bg-gray-100 text-gray-700';
                const isFavorit = c.status === 'favorit' || c.status === 'gewählt';
                const cardCls = isFavorit ? 'border-2 border-emerald-400 ring-1 ring-emerald-200' : 'border';

                html += `<div class="bg-white rounded-lg shadow-sm p-5 ${cardCls}">
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">${esc(c.name)}${isFavorit ? ' <span class="ml-1">⭐</span>' : ''}</h3>
                            ${c.webseite ? `<a href="${esc(c.webseite)}" target="_blank" class="text-sm text-emerald-600 hover:underline">${esc(c.webseite)}</a>` : ''}
                        </div>
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${statusCls}">${esc(c.status)}</span>
                    </div>
                    ${c.offerte_betrag ? `<p class="text-sm text-gray-600 mb-2"><strong>Offerte-Betrag:</strong> ${esc(c.offerte_betrag)}</p>` : ''}
                    ${c.offerte_details ? `<p class="text-sm text-gray-600 mb-2">${esc(c.offerte_details)}</p>` : ''}
                    ${atts.length > 0 ? `<div class="mt-3 pt-3 border-t">
                        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Dokumente (${atts.length})</p>
                        <div class="grid sm:grid-cols-2 gap-1">
                            ${atts.map(a => `<a href="/api/public/project/${encodeURIComponent(SLUG)}/document/${encodeURIComponent(a.doc_path)}" target="_blank" class="flex items-center gap-2 text-sm text-gray-700 hover:bg-emerald-50 rounded p-2 transition">
                                <span>${fileIcon(a.doc_path)}</span>
                                <span class="truncate">${esc(fileName(a.doc_path))}</span>
                            </a>`).join('')}
                        </div>
                    </div>` : ''}
                </div>`;
            }
            html += '</div></section>';
        }

        // Hinweis
        html += `<div class="bg-blue-50 border-l-4 border-blue-400 p-4 rounded">
            <p class="text-sm text-blue-900">
                <strong>Diese Seite ist oeffentlich zugaenglich</strong> und richtet sich an alle Eigentümer der STWEG-Kooperation Rosenweg.
                Für Rueckfragen oder Anmerkungen schreibe an
                <a href="mailto:ausschuss@rosenweg4303.ch" class="underline">ausschuss@rosenweg4303.ch</a>.
            </p>
        </div>`;

        document.getElementById('content').innerHTML = html;
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('loading').classList.add('hidden');
    }

    load();
    </script>
</body>
</html>
