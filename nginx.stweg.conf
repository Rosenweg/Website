# Multi-STWEG-Frontend. EINE Config bedient stweg1..8.rosenweg4303.ch.
# Host-Regex extrahiert die STWEG-Nummer (sid) -> docroot-Prefix /stwegN.
# Shared Assets (/js, /css, site-config.json, Logos) liegen am html-Root und
# werden host-unabhaengig serviert. /api wird zur geteilten rosenweg_api
# (Docker-Overlay-Alias "api") geproxyt — gleiches Muster wie nginx.isp.conf.
#
# Precedence-Hinweis: ^~ (Shared-Prefixe) schlagen die ~* Regex-Locations,
# die wiederum den / Catch-all schlagen. Daher landen /js,/css,/api zuerst,
# dann HTML/Assets mit /stwegN-Prefix, sonst der index-Fallback.

server {
    # IPv4 + IPv6 explizit. Der nginx-Entrypoint-Hook fuegt IPv6 nur bei
    # exaktem "listen 80;" hinzu — mit default_server wuerde er es ueberspringen,
    # und der Docker-Healthcheck (wget localhost -> ::1) bekaeme Connection
    # refused -> Task nie healthy -> Swarm-Traefik routet nicht (404).
    listen 80;
    listen [::]:80;
    # site = docroot-Name. stweg1..7 + meg (Tiefeinstellhalle, ex-stweg8).
    server_name ~^(?<site>stweg[1-7]|meg)\.rosenweg4303\.ch$ localhost;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API-Proxy zur geteilten rosenweg_api. X-Forwarded-Proto hardcoded https
    # (Edge-Traefik spricht intern HTTP zur Origin) — sonst baut die API
    # http://-Callback-URLs und der Authentik-OAuth-Flow scheitert.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Shared JS/CSS + site-config (host-unabhaengig, am html-Root)
    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /css/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
    location = /site-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Waschkueche-Modul (zuschaltbar via Env WASCHKUECHE=1 pro Service).
    # Exact-Match schlaegt die \.html$-Regex. Bei !=1 -> 404 (Modul aus).
    # ${WASCHKUECHE} wird beim Container-Start per envsubst gesetzt
    # (Default 0 via Dockerfile-ENV). Datei liegt als _waschkueche.html
    # im Image; Kontext leitet die Seite aus dem Hostname ab.
    location = /waschkueche.html {
        set $wk "${WASCHKUECHE}";
        if ($wk != "1") { return 404; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /_waschkueche.html =404;
    }

    # STWEG-spezifischer HTML-Content (kein Cache, unter /stwegN).
    # Existiert die Seite nicht im STWEG-Dir -> @www_fallback (Cross-Site-
    # Links wie ../energie-monitor.html landen so auf www statt im 404).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /$site$uri @www_fallback;
    }

    # Bild/Font/PDF: erst im STWEG-Dir, dann shared am Root (z.B. Logo)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|pdf)$ {
        try_files /$site$uri $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # Bare-Root explizit (sonst landet /stwegN/ als Dir im try_files und
    # erzeugt einen re-entranten Loop -> 404).
    location = / {
        try_files /$site/index.html =404;
    }

    # Catch-all: saubere URLs ohne .html, Verzeichnisse via index.html.
    # KEIN bare-dir-Eintrag (/stwegN$uri/) — der wuerde wieder loopen.
    location / {
        try_files /$site$uri /$site$uri.html /$site$uri/index.html @www_fallback;
    }

    # In-Page-Cross-Links der STWEG/MEG-Seiten (z.B. ../energie-monitor.html,
    # /waschkueche.html) zeigen auf Hauptseiten-Inhalte. Was im STWEG/MEG-Dir
    # nicht existiert, wird auf www umgeleitet — erspart das Rewriten der Links.
    location @www_fallback {
        return 302 https://www.rosenweg4303.ch$uri$is_args$args;
    }
}
