<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STWEG-Seite bearbeiten — Rosenweg</title>
    <link rel="icon" href="/logo-rosenweg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/authentik-auth.js?v=2"></script>
    <!-- CKEditor 5 Classic-Build: Rich-Text + Tabellen + Bilder, OHNE Premium/Collaboration.
         Exponiert global window.ClassicEditor. -->
    <script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* CKEditor-Inhaltsbereich auf eine angenehme Mindesthöhe bringen */
        .ck-editor__editable_inline { min-height: 180px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Gemeinsame Navigation -->
    <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
    <script src="/js/nav.js?v=2"></script>
    <script>RosenwegNav.init({ active: '' });</script>

    <!-- Gradient-Banner-Header -->
    <section class="bg-gradient-to-r from-blue-600 to-blue-800 text-white py-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold mb-1">STWEG-Seite bearbeiten</h1>
            <p class="text-lg opacity-90">Inhaltsabschnitte der eigenen STWEG-Seite (WYSIWYG)</p>
        </div>
    </section>

    <!-- Login-Gate: wird vor erfolgreichem Login angezeigt -->
    <div id="gate" class="max-w-4xl mx-auto px-4 py-12 text-center text-gray-600"></div>

    <!-- App-Inhalt: erst nach Login sichtbar -->
    <main class="max-w-4xl mx-auto px-4 py-6" id="app" style="display:none">

        <!-- STWEG-Auswahl (nur sichtbar, wenn mehrere STWEGs wählbar sind) -->
        <div id="stweg-picker" class="bg-white rounded-lg shadow p-5 mb-6" style="display:none">
            <label for="stweg-select" class="block font-medium text-gray-900 mb-2">STWEG auswählen</label>
            <select id="stweg-select"
                    class="w-full sm:w-64 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
        </div>

        <!-- Hinweis-Bereich (Modul nicht aktiv / keine STWEG-Zugehörigkeit) -->
        <div id="notice"></div>

        <!-- Editor-Bereich: hier werden die Abschnitts-Karten dynamisch eingehängt -->
        <div id="sections"></div>
    </main>

    <script>
    // ===============================================================
    // Konfiguration
    // ===============================================================

    // Modul-Key, der das Bearbeitungsrecht für die Seiten freischaltet
    const EDITOR_MODULE = 'seiten-editor';

    // Feste Abschnitte (genau diese 4, in dieser Reihenfolge)
    const SECTIONS = [
        { key: 'willkommen', title: 'Willkommen / Begrüßung' },
        { key: 'aktuelles',  title: 'Aktuelles / News' },
        { key: 'termine',    title: 'Termine' },
        { key: 'infos',      title: 'Wichtige Infos / Hinweise' },
    ];

    // Anzeige-Name einer STWEG (8 = MEG / Tiefeinstellhalle)
    function stwegLabel(n) { return n === 8 ? 'MEG' : ('STWEG ' + n); }

    // ===============================================================
    // Lokaler Zustand
    // ===============================================================
    let sichtbareStwegs = [];   // welche STWEGs darf der User sehen?
    let istAdmin = false;
    let aktuelleStweg = null;   // aktuell ausgewählte STWEG
    // Map<key, CKEditor-Instanz> der aktuell aktiven Abschnitts-Editoren
    let editoren = {};

    // ===============================================================
    // HTML-Escaping für Hinweis-/Statustexte (kein roher User-Input)
    // ===============================================================
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ===============================================================
    // Base64-Bild-Upload-Adapter: Bilder werden inline als data:-URL
    // eingebettet (KEIN Upload-Server). Wird CKEditor als extraPlugin
    // übergeben und greift via FileRepository in den Upload-Pfad ein.
    // ===============================================================
    function Base64UploadAdapterPlugin(editor) {
        editor.plugins.get('FileRepository').createUploadAdapter = function (loader) {
            return {
                upload: () => loader.file.then(file => new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve({ default: r.result });
                    r.onerror = reject;
                    r.readAsDataURL(file);
                })),
                abort() {}
            };
        };
    }

    // ===============================================================
    // Bootstrap: Auth + Daten laden
    // ===============================================================
    (async function () {
        const currentUser = await AuthentikAuth.init({
            requireAuth: true,
            onLogout: () => AuthentikAuth.createLoginButton('gate'),
        });
        if (!currentUser) return; // nicht eingeloggt -> Gate zeigt Login-Button

        // Gate ausblenden, App zeigen
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        const groups = (currentUser.groups || []).map(g => String(g).toLowerCase());

        // Admin = isAdmin-Flag ODER Mitglied von technik / präsident
        istAdmin = currentUser.isAdmin === true
            || groups.some(g => g === 'technik' || g === 'präsident' || g === 'praesident');

        // Eigene STWEGs aus den Gruppen ableiten
        const eigeneStwegs = new Set();
        for (const g of groups) {
            const m = g.match(/^stweg(\d+)-/);      // z.B. stweg3-ausschuss / stweg3-eigentuemer
            if (m) eigeneStwegs.add(parseInt(m[1], 10));
            if (/^meg-/.test(g)) eigeneStwegs.add(8); // meg-* = STWEG 8 (MEG)
        }

        // Sichtbare STWEGs bestimmen
        if (istAdmin) {
            sichtbareStwegs = [1, 2, 3, 4, 5, 6, 7, 8]; // 8 = MEG
        } else {
            sichtbareStwegs = [...eigeneStwegs].sort((a, b) => a - b);
        }

        // Nicht-Admin ohne STWEG-Zugehörigkeit -> Hinweis und Schluss
        if (sichtbareStwegs.length === 0) {
            zeigeNotice('gray', 'Keine STWEG-Zugehörigkeit',
                'Ihrem Konto ist keine STWEG zugeordnet. Wenden Sie sich an den Ausschuss.');
            return;
        }

        // STWEG-Auswahl aufbauen
        bauePicker();

        // Erste STWEG laden
        aktuelleStweg = sichtbareStwegs[0];
        await ladeStweg(aktuelleStweg);
    })();

    // ===============================================================
    // STWEG-Auswahl (Dropdown) aufbauen
    // ===============================================================
    function bauePicker() {
        const picker = document.getElementById('stweg-picker');
        const select = document.getElementById('stweg-select');

        // Bei genau einer STWEG: kein Dropdown nötig
        if (sichtbareStwegs.length <= 1) {
            picker.style.display = 'none';
            return;
        }

        // Optionen erzeugen (textContent -> kein XSS)
        select.innerHTML = '';
        for (const s of sichtbareStwegs) {
            const opt = document.createElement('option');
            opt.value = String(s);
            opt.textContent = stwegLabel(s);
            select.appendChild(opt);
        }
        picker.style.display = 'block';

        // Wechsel -> alte Editoren zerstören, Modul-Check + neu aufbauen
        select.addEventListener('change', async () => {
            aktuelleStweg = parseInt(select.value, 10);
            await ladeStweg(aktuelleStweg);
        });
    }

    // ===============================================================
    // Eine STWEG laden: Editoren aufräumen, Modul-Check, danach Aufbau
    // ===============================================================
    async function ladeStweg(stweg) {
        // Sauberes Cleanup: bestehende Editoren zerstören (sonst doppelte Instanzen)
        await zerstoereEditoren();
        document.getElementById('sections').innerHTML = '';
        clearNotice();

        // 1) Modul-Status prüfen
        const aktiv = await istModulAktiv(stweg);
        if (!aktiv) {
            zeigeNotice('yellow',
                'Modul „Seiten-Editor“ nicht aktiviert',
                'Das Modul „Seiten-Editor“ ist für ' + stwegLabel(stweg) + ' nicht aktiviert '
                + '(unter „STWEG-Module“ einschalten).');
            return; // Editoren werden NICHT initialisiert
        }

        // 2) Vorhandene Inhalte laden + Editoren aufbauen
        const data = await ladeSections(stweg);
        await baueEditoren(stweg, data);
    }

    // ===============================================================
    // Prüfen, ob das Editor-Modul für die STWEG aktiv ist
    // GET /api/stweg-modules -> { "<stweg>": ["<modulkey>", ...] }
    // ===============================================================
    async function istModulAktiv(stweg) {
        try {
            const r = await fetch('/api/stweg-modules');
            if (!r.ok) return false;
            const map = await r.json() || {};
            const arr = map[String(stweg)] || map[stweg];
            return Array.isArray(arr) && arr.includes(EDITOR_MODULE);
        } catch (e) {
            return false;
        }
    }

    // ===============================================================
    // Abschnitts-Inhalte laden
    // GET /api/stweg-sections/<stweg>
    //   -> { "<key>": { html, updated_at }, ... } (nur befüllte vorhanden)
    // ===============================================================
    async function ladeSections(stweg) {
        try {
            const r = await fetch('/api/stweg-sections/' + encodeURIComponent(stweg));
            if (r.ok) {
                return (await r.json()) || {};
            }
        } catch (e) {
            // Bei Fehler werden leere Editoren aufgebaut
        }
        return {};
    }

    // ===============================================================
    // Editoren aufbauen: pro Abschnitt eine Karte + CKEditor-Instanz
    // ===============================================================
    async function baueEditoren(stweg, data) {
        const container = document.getElementById('sections');

        for (const section of SECTIONS) {
            const eintrag = data[section.key] || null;

            // --- Karte aufbauen (DOM-API -> kein XSS über Titel) ---
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow p-5 mb-6';

            const h2 = document.createElement('h2');
            h2.className = 'text-xl font-semibold text-gray-900 mb-3';
            h2.textContent = section.title;
            card.appendChild(h2);

            // Editor-Ziel
            const editorEl = document.createElement('div');
            card.appendChild(editorEl);

            // Aktionsleiste: Speichern-Button + Status + zuletzt-geändert
            const bar = document.createElement('div');
            bar.className = 'flex flex-wrap items-center gap-3 mt-3';

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2 rounded-md '
                + 'transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-60';
            btn.textContent = 'Speichern';
            bar.appendChild(btn);

            const status = document.createElement('span');
            status.className = 'text-sm';
            bar.appendChild(status);

            const updatedEl = document.createElement('span');
            updatedEl.className = 'text-sm text-gray-500 ml-auto';
            updatedEl.textContent = (eintrag && eintrag.updated_at)
                ? ('zuletzt geändert: ' + formatZeit(eintrag.updated_at))
                : '';
            bar.appendChild(updatedEl);

            card.appendChild(bar);
            container.appendChild(card);

            // --- CKEditor 5 initialisieren — Superbuild exponiert CKEDITOR.ClassicEditor (kein globales ClassicEditor) ---
            const ClassicEditorRef = (window.CKEDITOR && window.CKEDITOR.ClassicEditor) || window.ClassicEditor;
            let editor;
            try {
                if (!ClassicEditorRef) throw new Error('CKEDITOR/ClassicEditor nicht verfügbar (CDN nicht geladen?)');
                editor = await ClassicEditorRef.create(editorEl, {
                    toolbar: [
                        'heading', '|',
                        'bold', 'italic', 'link',
                        'bulletedList', 'numberedList', 'blockQuote', '|',
                        'insertTable', 'uploadImage', '|',
                        'undo', 'redo'
                    ],
                    table: { contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells'] },
                    extraPlugins: [Base64UploadAdapterPlugin]
                });
            } catch (e) {
                console.error('CKEditor init fehlgeschlagen:', e);
                status.className = 'text-sm text-red-600';
                status.textContent = 'Editor konnte nicht geladen werden: ' + (e && e.message ? e.message : e);
                continue;
            }

            // Anfangsinhalt setzen (fehlende Abschnitte = leer)
            editor.setData((eintrag && eintrag.html) || '');

            // Instanz merken (für Cleanup beim STWEG-Wechsel)
            editoren[section.key] = editor;

            // Speichern verdrahten (eigene Closure pro Abschnitt)
            btn.addEventListener('click', () =>
                speichern(stweg, section.key, editor, btn, status, updatedEl));
        }
    }

    // ===============================================================
    // Einen Abschnitt speichern
    // POST /api/stweg-sections/<stweg>/<key>  body: { html }
    //   -> 200 { ok:true, html:"<sanitisiertes html>" } | 4xx { error }
    // ===============================================================
    async function speichern(stweg, key, editor, btn, status, updatedEl) {
        btn.disabled = true;
        status.className = 'text-sm';
        status.textContent = '';

        try {
            const r = await AuthentikAuth.apiFetch(
                '/api/stweg-sections/' + encodeURIComponent(stweg) + '/' + encodeURIComponent(key),
                { method: 'POST', body: { html: editor.getData() } }
            );

            if (r.ok) {
                // Server liefert sanitisiertes HTML zurück -> zurück in den Editor
                let resp = {};
                try { resp = (await r.json()) || {}; } catch (e) {}
                if (typeof resp.html === 'string') editor.setData(resp.html);

                status.className = 'text-sm text-green-600';
                status.textContent = 'gespeichert';
                updatedEl.textContent = 'zuletzt geändert: '
                    + formatZeit(resp.updated_at || new Date().toISOString());
                setTimeout(() => { if (status.textContent === 'gespeichert') status.textContent = ''; }, 2500);
            } else {
                // Fehlertext aus { error } herauslesen (z.B. 403)
                let msg = 'Fehler ' + r.status;
                try { const d = await r.json(); if (d && d.error) msg = d.error; } catch (e) {}
                status.className = 'text-sm text-red-600';
                status.textContent = msg;
            }
        } catch (e) {
            status.className = 'text-sm text-red-600';
            status.textContent = 'Speichern fehlgeschlagen';
        } finally {
            btn.disabled = false;
        }
    }

    // ===============================================================
    // Cleanup: alle aktiven CKEditor-Instanzen zerstören
    // ===============================================================
    async function zerstoereEditoren() {
        const instanzen = Object.values(editoren);
        editoren = {};
        for (const ed of instanzen) {
            try { await ed.destroy(); } catch (e) { /* ignorieren */ }
        }
    }

    // ===============================================================
    // Hilfsfunktionen: Hinweis-Box
    // ===============================================================
    function zeigeNotice(farbe, titel, text) {
        // Tailwind-Klassen statisch halten (kein dynamisches Class-Name-Bauen,
        // damit der CDN-JIT die Farben kennt)
        const stile = {
            yellow: 'bg-yellow-50 border-yellow-300 text-yellow-800',
            gray:   'bg-white border-gray-200 text-gray-700',
        };
        const cls = stile[farbe] || stile.gray;
        const notice = document.getElementById('notice');
        notice.innerHTML =
            '<div class="rounded-lg shadow p-5 mb-6 border ' + cls + '">'
            + '<div class="font-semibold mb-1">' + esc(titel) + '</div>'
            + '<div class="text-sm">' + esc(text) + '</div>'
            + '</div>';
    }
    function clearNotice() { document.getElementById('notice').innerHTML = ''; }

    // ISO-Zeit hübsch (lokal, deutsch) formatieren; bei Fehler Rohwert zurückgeben
    function formatZeit(iso) {
        try {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso);
            return d.toLocaleString('de-CH', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit',
            });
        } catch (e) {
            return String(iso);
        }
    }
    </script>
</body>
</html>
