<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#f9fafb" rx="8"/>

  <!-- Header -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="800" height="56" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="20" width="800" height="36" fill="url(#hdr)"/>
  <text x="24" y="32" fill="white" font-size="18" font-weight="700">Verwaltung</text>
  <text x="24" y="48" fill="#93bbfd" font-size="11">Wohnungen, Bewohner und Gruppen verwalten</text>

  <!-- Tabs -->
  <text x="24" y="80" fill="#2563eb" font-size="13" font-weight="600">Wohnungen</text>
  <line x1="24" y1="86" x2="96" y2="86" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="80" fill="#6b7280" font-size="13">Bewohner</text>
  <text x="200" y="80" fill="#6b7280" font-size="13">Gruppen</text>

  <!-- STWEG Selector -->
  <text x="24" y="112" fill="#374151" font-size="12" font-weight="500">STWEG:</text>
  <rect x="76" y="98" width="32" height="24" rx="6" fill="#2563eb"/>
  <text x="86" y="114" fill="white" font-size="11" font-weight="600" text-anchor="middle">1</text>
  <rect x="114" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="124" y="114" fill="#374151" font-size="11" text-anchor="middle">2</text>
  <rect x="152" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="162" y="114" fill="#374151" font-size="11" text-anchor="middle">3</text>
  <rect x="190" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="200" y="114" fill="#374151" font-size="11" text-anchor="middle">4</text>
  <rect x="228" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="238" y="114" fill="#374151" font-size="11" text-anchor="middle">5</text>
  <rect x="266" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="276" y="114" fill="#374151" font-size="11" text-anchor="middle">6</text>
  <rect x="304" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="314" y="114" fill="#374151" font-size="11" text-anchor="middle">7</text>
  <rect x="342" y="98" width="32" height="24" rx="6" fill="#e5e7eb"/>
  <text x="352" y="114" fill="#374151" font-size="11" text-anchor="middle">8</text>

  <!-- Stats Cards -->
  <rect x="24" y="134" width="180" height="56" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="114" y="162" fill="#1f2937" font-size="22" font-weight="700" text-anchor="middle">12</text>
  <text x="114" y="178" fill="#6b7280" font-size="10" text-anchor="middle">Wohnungen</text>

  <rect x="214" y="134" width="180" height="56" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="304" y="162" fill="#16a34a" font-size="22" font-weight="700" text-anchor="middle">8</text>
  <text x="304" y="178" fill="#6b7280" font-size="10" text-anchor="middle">Selbstbewohnt</text>

  <rect x="404" y="134" width="180" height="56" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="494" y="162" fill="#2563eb" font-size="22" font-weight="700" text-anchor="middle">3</text>
  <text x="494" y="178" fill="#6b7280" font-size="10" text-anchor="middle">Vermietet</text>

  <rect x="594" y="134" width="180" height="56" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="684" y="162" fill="#ca8a04" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="684" y="178" fill="#6b7280" font-size="10" text-anchor="middle">Leer</text>

  <!-- Search & Buttons -->
  <rect x="24" y="206" width="200" height="32" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="44" y="226" fill="#9ca3af" font-size="12">Suchen...</text>

  <rect x="520" y="206" width="60" height="32" rx="6" fill="#f3f4f6"/>
  <text x="536" y="226" fill="#374151" font-size="11">Excel</text>
  <rect x="586" y="206" width="52" height="32" rx="6" fill="#f3f4f6"/>
  <text x="598" y="226" fill="#374151" font-size="11">CSV</text>
  <rect x="644" y="206" width="130" height="32" rx="6" fill="#2563eb"/>
  <text x="678" y="226" fill="white" font-size="11" font-weight="600">+ Neue Wohnung</text>

  <!-- Table rows -->
  <rect x="24" y="252" width="750" height="40" rx="6" fill="white" stroke="#e5e7eb"/>
  <circle cx="44" cy="272" r="6" fill="#16a34a"/>
  <text x="62" y="268" fill="#1f2937" font-size="12" font-weight="600">EG.1</text>
  <text x="62" y="282" fill="#6b7280" font-size="10">Erdgeschoss - 3.5 Zi - 78 m²</text>
  <text x="350" y="276" fill="#374151" font-size="11">M. Mustermann</text>
  <rect x="500" y="264" width="84" height="18" rx="9" fill="#dcfce7"/>
  <text x="520" y="277" fill="#166534" font-size="10">Selbstbewohnt</text>

  <rect x="24" y="298" width="750" height="40" rx="6" fill="white" stroke="#e5e7eb"/>
  <circle cx="44" cy="318" r="6" fill="#2563eb"/>
  <text x="62" y="314" fill="#1f2937" font-size="12" font-weight="600">1.OG.1</text>
  <text x="62" y="328" fill="#6b7280" font-size="10">1. Obergeschoss - 4.5 Zi - 95 m²</text>
  <text x="350" y="322" fill="#374151" font-size="11">A. Beispiel</text>
  <rect x="500" y="310" width="64" height="18" rx="9" fill="#dbeafe"/>
  <text x="514" y="323" fill="#1e40af" font-size="10">Vermietet</text>

  <rect x="24" y="344" width="750" height="40" rx="6" fill="white" stroke="#e5e7eb"/>
  <circle cx="44" cy="364" r="6" fill="#ca8a04"/>
  <text x="62" y="360" fill="#1f2937" font-size="12" font-weight="600">2.OG.2</text>
  <text x="62" y="374" fill="#6b7280" font-size="10">2. Obergeschoss - 3.5 Zi - 72 m²</text>
  <text x="350" y="368" fill="#374151" font-size="11">K. Fischer</text>
  <rect x="500" y="356" width="40" height="18" rx="9" fill="#fef9c3"/>
  <text x="508" y="369" fill="#854d0e" font-size="10">Leer</text>

  <!-- Annotation arrows -->
  <rect x="600" y="98" width="180" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="116" fill="#92400e" font-size="10">1. STWEG auswählen</text>
  <line x1="596" y1="110" x2="380" y2="110" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="600" y="390" width="180" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="408" fill="#92400e" font-size="10">2. Wohnung anklicken zum Bearbeiten</text>
  <line x1="596" y1="404" x2="530" y2="364" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
</svg>
