# Erzeugt von Hand am 15. August 2026.
#
# Warum: 'unicast_src_ip' der IPv6-Instanz ist die SLAAC-Adresse von eth0, und
# die entsteht erst, wenn die Router-Ankuendigung da ist. keepalived ist beim
# Systemstart schneller — findet seine Quelladresse nicht, geht in FAULT STATE
# und versucht es NIE wieder.
#
# Am 12. August 2026 um 17:24:03 genau so passiert und drei Tage unbemerkt
# geblieben: die virtuelle Adresse 2a02:16a:1400:9::29 existierte nirgends,
# das AAAA im DNS zeigte ins Leere. Weil getaddrinfo IPv6 bevorzugt, lief
# danach jede Anmeldung im Haus zuerst sieben Sekunden in EHOSTUNREACH und
# wurde wiederholt — rund dreissig Sekunden pro Anmeldung, auf jeder Station.
#
# Also warten, bis eine globale IPv6-Adresse auf eth0 steht. Der Bindestrich
# vor 'timeout' ist Absicht: laeuft die Frist ab, startet keepalived trotzdem.
# Ohne IPv6-Instanz ist schlechter als mit, aber immer noch viel besser als
# ein Fileserver ohne IPv4-VIP.

[Unit]
After=network-online.target
Wants=network-online.target

[Service]
# Nicht nur auf DA warten, sondern auf BENUTZBAR. Eine frisch angelegte
# IPv6-Adresse ist erst 'tentative': der Kernel prueft per DAD, ob sie schon
# jemand hat, und in dieser Zeit laesst sie sich nicht als Quelladresse
# binden. Genau daran scheiterte der erste Versuch dieses Riegels am
# 15. August 2026 — keepalived sagte es woertlich:
#
#   (fileserver_vip6): entering FAULT state (src address not configured)
ExecStartPre=-/usr/bin/timeout 30 sh -c 'until ip -6 -o addr show dev eth0 scope global | grep -v tentative | grep -q inet6; do sleep 1; done; sleep 2'
