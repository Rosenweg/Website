# Freigabe [scans] — ersetzt den bisherigen Abschnitt in /etc/samba/smb.conf
# auf CT 106 (fileserver) UND CT 206 (fileserver2). Beide gleich halten.
#
# Je Scanner ein AD-Konto scan-<name> in der Gruppe scanner-geraete. %u ist
# der Unix-Name des angemeldeten Kontos (winbind use default domain = yes,
# also "scan-r13" ohne Domäne): jedes Gerät landet in seinem eigenen Ordner
# und sieht die der anderen nicht. Der Ordner wird beim Anlegen des Kontos
# von Hand erstellt (README.md); fehlt er, lehnt Samba die Verbindung ab.
#
# Bisher: path = /mnt/cephfs-stage/Scans, valid users = ROSENWEG\scanner
[scans]
	comment = Scanner-Ablage (je Gerät ein Konto)
	path = /mnt/cephfs-stage/Scans/%u
	valid users = @scanner-geraete
	read only = No
	browseable = No
