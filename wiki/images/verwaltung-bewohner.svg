<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="320" fill="#f9fafb" rx="8"/>

  <!-- Header -->
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="800" height="56" fill="url(#hdr2)" rx="8"/>
  <rect x="0" y="20" width="800" height="36" fill="url(#hdr2)"/>
  <text x="24" y="32" fill="white" font-size="18" font-weight="700">Verwaltung</text>
  <text x="24" y="48" fill="#93bbfd" font-size="11">Wohnungen, Bewohner und Gruppen verwalten</text>

  <!-- Tabs -->
