  <line x1="120" y1="86" x2="184" y2="86" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="80" fill="#6b7280" font-size="13">Gruppen</text>

  <!-- Search & Add -->
  <rect x="24" y="100" width="200" height="32" rx="6" fill="white" stroke="#d1d5db"/>
