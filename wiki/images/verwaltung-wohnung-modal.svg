<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" font-family="Inter, system-ui, sans-serif">
  <!-- Backdrop -->
  <rect width="480" height="620" fill="#00000066" rx="4"/>

  <!-- Modal -->
  <rect x="24" y="16" width="432" height="590" rx="12" fill="white" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>

  <!-- Title -->
  <text x="44" y="50" fill="#1f2937" font-size="16" font-weight="700">Wohnung bearbeiten</text>

  <!-- Section: Wohnung -->
  <text x="44" y="78" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.05em">WOHNUNG</text>

  <!-- Row 1: Bezeichnung + Stockwerk -->
  <text x="44" y="100" fill="#374151" font-size="11" font-weight="500">Bezeichnung *</text>
  <rect x="44" y="106" width="196" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="54" y="125" fill="#1f2937" font-size="12">EG.1</text>

  <text x="252" y="100" fill="#374151" font-size="11" font-weight="500">Stockwerk</text>
  <rect x="252" y="106" width="188" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="262" y="125" fill="#1f2937" font-size="12">Erdgeschoss</text>

  <!-- Row 2: Zimmer + Fläche + Typ -->
  <text x="44" y="154" fill="#374151" font-size="11" font-weight="500">Zimmer</text>
  <rect x="44" y="160" width="120" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="54" y="179" fill="#1f2937" font-size="12">3.5</text>

  <text x="176" y="154" fill="#374151" font-size="11" font-weight="500">Fläche m²</text>
  <rect x="176" y="160" width="120" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="186" y="179" fill="#1f2937" font-size="12">78</text>

  <text x="308" y="154" fill="#374151" font-size="11" font-weight="500">Typ</text>
  <rect x="308" y="160" width="132" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="318" y="179" fill="#1f2937" font-size="12">Wohnung</text>

  <!-- Besonderheiten -->
  <text x="44" y="208" fill="#374151" font-size="11" font-weight="500">Besonderheiten</text>
  <rect x="44" y="214" width="396" height="30" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="54" y="233" fill="#1f2937" font-size="12">Garten, Balkon</text>

  <!-- Section: Bewohnung -->
  <text x="44" y="268" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.05em">BEWOHNUNG</text>

  <!-- Radio buttons -->
  <circle cx="56" cy="290" r="7" fill="white" stroke="#2563eb" stroke-width="2"/>
  <circle cx="56" cy="290" r="4" fill="#2563eb"/>
  <text x="70" y="294" fill="#1f2937" font-size="12">Selbstbewohnt</text>

  <circle cx="186" cy="290" r="7" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <text x="200" y="294" fill="#1f2937" font-size="12">Vermietet</text>

  <circle cx="290" cy="290" r="7" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <text x="304" y="294" fill="#1f2937" font-size="12">Leer</text>

