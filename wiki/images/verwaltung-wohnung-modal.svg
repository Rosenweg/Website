  <text x="322" y="327" fill="#2563eb" font-size="10" font-weight="500">+ Kontakt hinzufügen</text>

  <!-- Contact 1 -->
  <rect x="44" y="340" width="396" height="86" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="54" y="358" fill="#6b7280" font-size="10">Rolle</text>
  <rect x="54" y="362" width="100" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="62" y="378" fill="#1f2937" font-size="11">Eigentümer</text>

  <text x="166" y="358" fill="#6b7280" font-size="10">Name</text>
  <rect x="166" y="362" width="150" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="174" y="378" fill="#1f2937" font-size="11">Max Mustermann</text>

  <text x="54" y="400" fill="#6b7280" font-size="10">Telefon</text>
  <rect x="54" y="404" width="130" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="62" y="420" fill="#1f2937" font-size="11">079 123 45 67</text>

  <text x="196" y="400" fill="#6b7280" font-size="10">E-Mail</text>
  <rect x="196" y="404" width="180" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="204" y="420" fill="#1f2937" font-size="11">max@example.com</text>

  <!-- × button -->
  <text x="420" y="358" fill="#ef4444" font-size="16" font-weight="bold" cursor="pointer">×</text>

  <!-- Contact 2 (Verwalter) -->
  <rect x="44" y="438" width="396" height="54" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="54" y="456" fill="#6b7280" font-size="10">Rolle</text>
  <rect x="54" y="460" width="100" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="62" y="476" fill="#1f2937" font-size="11">Verwalter</text>

  <text x="166" y="456" fill="#6b7280" font-size="10">Name</text>
  <rect x="166" y="460" width="150" height="24" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="174" y="476" fill="#1f2937" font-size="11">Lisa Fischer</text>

  <text x="420" y="458" fill="#ef4444" font-size="16" font-weight="bold">×</text>

  <!-- Section: Notizen -->
  <text x="44" y="516" fill="#374151" font-size="11" font-weight="500">Notizen</text>
  <rect x="44" y="522" width="396" height="36" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="54" y="544" fill="#9ca3af" font-size="11">Parkplatz Nr. 5 gehört dazu</text>

  <!-- Buttons -->
  <text x="44" y="582" fill="#ef4444" font-size="12" font-weight="500">Löschen</text>

  <rect x="300" y="568" width="72" height="32" rx="6" fill="white"/>
  <text x="316" y="588" fill="#6b7280" font-size="12">Abbrechen</text>

  <rect x="380" y="568" width="60" height="32" rx="6" fill="#2563eb"/>
  <text x="390" y="588" fill="white" font-size="12" font-weight="600">Speichern</text>

  <!-- Annotations -->
  <rect x="0" y="330" width="38" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="6" y="344" fill="#92400e" font-size="9" font-weight="600">Tipp</text>
</svg>
