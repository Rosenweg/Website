<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekte - Rosenweg</title>
    <link rel="icon" href="/logo-rosenweg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/authentik-auth.js?v=2"></script>
    <script src="/js/nav.js?v=3"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script src="/js/excel-export.js?v=1" defer></script>
</head>
<body class="bg-gray-50">
    <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
    <script>RosenwegNav.init({ active: 'projekte' });</script>

    <section class="bg-gradient-to-r from-emerald-600 to-emerald-800 text-white py-12">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold mb-2">Projekte</h1>
                <p class="text-lg opacity-90">Laufende und geplante Projekte der STWEG-Kooperation</p>
            </div>
            <button onclick="exportProjects()" class="text-sm bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded">⬇ Excel</button>
        </div>
    </section>

    <!-- Tabs -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex gap-4 border-b border-gray-200 mt-6 overflow-x-auto" id="project-tabs"></nav>
    </div>

    <!-- Content -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="project-content">
        <div class="text-center text-gray-400 py-12">Lädt...</div>
    </div>

    <script>
    let currentProject = null;
    let canEdit = false;
    let projectDocs = [];

    async function init() {
        const user = await AuthentikAuth.init({ requireAuth: true });
        if (!user) return;
        const groups = user.groups || [];
        canEdit = groups.some(g => {
            const gl = g.toLowerCase();
            return gl === 'technik' || gl.endsWith('-ausschuss') || gl === 'präsident';
        });
        loadProjects();
    }

    async function exportProjects() {
        try {
            const r = await AuthentikAuth.apiFetch('/api/projects');
            const projects = await r.json();
            if (!projects.length) { alert('Keine Projekte.'); return; }
            const rows = projects.map(p => ({
                'Titel': p.title || '',
                'Slug': p.slug || '',
                'Status': p.status || '',
                'Budget CHF': Number(p.budget_chf || 0).toFixed(2),
                'Verbraucht CHF': Number(p.verbraucht || 0).toFixed(2),
                'Auslastung %': p.budget_chf > 0 ? Math.round((p.verbraucht / p.budget_chf) * 100) : 0,
                'Warnung ab %': p.budget_warnung_pct || '',
                'Start': p.start_date || '',
                'Ende geplant': p.end_date || '',
                'Beschreibung': p.beschreibung || '',
            }));
            await RosenwegExcel.fromData(rows, 'projekte-{date}.xlsx', 'Projekte');
        } catch (e) { alert('Fehler: ' + e.message); }
    }

    async function loadProjects() {
        const resp = await AuthentikAuth.apiFetch('/api/projects');
        if (!resp.ok) { document.getElementById('project-content').innerHTML = '<p class="text-red-500">Fehler beim Laden</p>'; return; }
        const projects = await resp.json();
        const tabs = document.getElementById('project-tabs');
        tabs.innerHTML = projects.map((p, i) => `
            <button onclick="loadProject('${p.slug}')" id="tab-${p.slug}"
                class="whitespace-nowrap py-3 px-1 border-b-2 text-sm font-medium transition ${i === 0 ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-gray-500 hover:text-gray-700'}">
                ${esc(p.title)}
            </button>`).join('');
        if (projects.length > 0) loadProject(projects[0].slug);
    }

    async function loadProject(slug) {
        // Update tab styling
        document.querySelectorAll('#project-tabs button').forEach(b => {
            b.className = b.id === `tab-${slug}`
                ? 'whitespace-nowrap py-3 px-1 border-b-2 text-sm font-medium transition border-emerald-600 text-emerald-600'
                : 'whitespace-nowrap py-3 px-1 border-b-2 text-sm font-medium transition border-transparent text-gray-500 hover:text-gray-700';
        });

        const resp = await AuthentikAuth.apiFetch(`/api/projects/${slug}`);
        if (!resp.ok) return;
        currentProject = await resp.json();
        // Load all docs once, then render
        const docsResp = await AuthentikAuth.apiFetch('/api/documents');
        projectDocs = docsResp.ok ? await docsResp.json() : [];
        renderProject();
        renderProjectFiles();
    }

    function renderProject() {
        const p = currentProject;
        const el = document.getElementById('project-content');
        const editBtn = (onclick, label, cls = 'text-gray-400 hover:text-gray-600') =>
            canEdit ? `<button onclick="${onclick}" class="${cls} text-sm">${label}</button>` : '';

        // Timeline
        const timelineHtml = p.timeline.map(t => {
            const done = t.erledigt;
            const attachFolder = `projekte/${p.slug}/timeline/${t.id}/`;
            const attachments = projectDocs.filter(f => f.path.startsWith(attachFolder));
            return `<div class="flex gap-4 items-start">
                <div class="flex flex-col items-center">
                    <div class="w-4 h-4 rounded-full border-2 ${done ? 'bg-emerald-500 border-emerald-500' : 'bg-white border-gray-300'} ${canEdit ? 'cursor-pointer' : ''}"
                        ${canEdit ? `onclick="toggleTimeline(${t.id}, ${!done})"` : ''}></div>
                    <div class="w-0.5 h-full bg-gray-200 min-h-[2rem]"></div>
                </div>
                <div class="pb-6 flex-1">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400">${new Date(t.datum).toLocaleDateString('de-CH')}</span>
                        ${done ? '<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">erledigt</span>' : ''}
                        ${editBtn(`editTimeline(${t.id})`, '&#9998;')}
                        ${editBtn(`deleteTimeline(${t.id})`, '&times;', 'text-red-300 hover:text-red-500 text-sm')}
                    </div>
                    <p class="font-medium ${done ? 'text-gray-500 line-through' : 'text-gray-800'}">${esc(t.titel)}</p>
                    ${t.beschreibung ? `<p class="text-sm text-gray-500">${esc(t.beschreibung)}</p>` : ''}
                    ${renderAttachments(attachments, 'timeline', t.id)}
                </div>
            </div>`;
        }).join('');

        // Candidates
        const statusColors = {
            'angefragt': 'bg-yellow-100 text-yellow-700',
            'offerte erhalten': 'bg-blue-100 text-blue-700',
            'in bewertung': 'bg-purple-100 text-purple-700',
            'favorit': 'bg-emerald-100 text-emerald-700',
            'abgelehnt': 'bg-red-100 text-red-700',
        };

        const candidatesHtml = p.candidates.length === 0
            ? '<p class="text-gray-400 text-sm py-4">Noch keine Kandidaten erfasst.</p>'
            : p.candidates.map(c => {
                const attachFolder = `projekte/${p.slug}/kandidaten/${c.id}/`;
                const attachments = projectDocs.filter(f => f.path.startsWith(attachFolder));
                return `
            <div class="border rounded-lg p-4 hover:shadow-md transition">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h4 class="font-semibold text-gray-900">${esc(c.name)}</h4>
                            <span class="text-xs px-2 py-0.5 rounded-full ${statusColors[c.status] || 'bg-gray-100 text-gray-600'}">${esc(c.status)}</span>
                            ${c.bewertung ? `<span class="text-sm text-yellow-500">${'★'.repeat(c.bewertung)}${'☆'.repeat(5 - c.bewertung)}</span>` : ''}
                        </div>
                        ${c.kontakt ? `<p class="text-sm text-gray-600 mt-1">${esc(c.kontakt)}</p>` : ''}
                        <div class="flex flex-wrap gap-3 mt-2 text-sm text-gray-500">
                            ${c.telefon ? `<span>Tel: ${esc(c.telefon)}</span>` : ''}
                            ${c.email ? `<span>${esc(c.email)}</span>` : ''}
                            ${c.webseite ? `<a href="${esc(c.webseite)}" target="_blank" class="text-emerald-600 hover:underline">Webseite</a>` : ''}
                        </div>
                        ${c.offerte_betrag ? `<p class="mt-2 text-sm"><span class="font-medium">Offerte:</span> ${esc(c.offerte_betrag)}</p>` : ''}
                        ${c.offerte_details ? `<p class="text-sm text-gray-500">${esc(c.offerte_details)}</p>` : ''}
                        ${c.notizen ? `<p class="text-sm text-gray-400 mt-2 italic">${esc(c.notizen)}</p>` : ''}
                        ${renderAttachments(attachments, 'kandidaten', c.id)}
                    </div>
                    ${canEdit ? `<div class="flex gap-1">
                        <button onclick="editCandidate(${c.id})" class="text-gray-400 hover:text-gray-600 p-1" title="Bearbeiten">&#9998;</button>
                        <button onclick="deleteCandidate(${c.id})" class="text-red-300 hover:text-red-500 p-1" title="Löschen">&times;</button>
                    </div>` : ''}
                </div>
            </div>`;
            }).join('');

        // Comments
        const commentsHtml = p.comments.map(c => `
            <div class="flex gap-3 py-3 border-b last:border-0">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 text-xs font-bold flex-shrink-0">
                    ${esc(c.user_name.split(' ').map(w => w[0]).join('').slice(0, 2))}
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-medium">${esc(c.user_name)}</span>
                        <span class="text-xs text-gray-400">${new Date(c.created_at).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                        ${canEdit ? `<button onclick="deleteComment(${c.id})" class="text-red-300 hover:text-red-500 text-xs">&times;</button>` : ''}
                    </div>
                    <p class="text-sm text-gray-700 mt-1">${esc(c.text)}</p>
                </div>
            </div>`).join('') || '<p class="text-gray-400 text-sm py-2">Noch keine Kommentare.</p>';

        el.innerHTML = `
            <div class="grid gap-8">
                <!-- Status & Timeline -->
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Timeline</h2>
                        ${editBtn(`addTimeline()`, '+ Eintrag', 'text-emerald-600 hover:text-emerald-800 text-sm font-medium')}
                    </div>
                    <div class="ml-2">${timelineHtml}</div>
                </div>

                <!-- Candidates -->
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Kandidaten</h2>
                        ${editBtn(`addCandidate()`, '+ Kandidat', 'text-emerald-600 hover:text-emerald-800 text-sm font-medium')}
                    </div>
                    <div class="grid gap-3">${candidatesHtml}</div>
                </div>

                <!-- Dokumente -->
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Dokumente</h2>
                        ${canEdit ? `<label class="text-emerald-600 hover:text-emerald-800 text-sm font-medium cursor-pointer">
                            + Hochladen
                            <input type="file" class="hidden" multiple onchange="uploadProjectFiles(this.files)">
                        </label>` : ''}
                    </div>
                    <div id="project-files" class="text-sm text-gray-400">Lädt...</div>
                </div>

                <!-- Auslagen-Übersicht + Budget -->
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-bold text-gray-800">💰 Auslagen &amp; Budget</h2>
                        <div class="flex gap-3 items-center">
                            ${canEdit ? `<button onclick="editBudget()" class="text-xs text-gray-500 hover:text-gray-700">Budget bearbeiten</button>` : ''}
                            <a href="/auslagen.html?projekt=${esc(p.slug)}" class="text-xs text-blue-600 hover:underline">→ in Auslagen-Liste</a>
                        </div>
                    </div>
                    ${renderBudgetBar(p)}
                    ${renderAuslagenStat(p.auslagen_stat)}
                    <div id="auslagen-list" class="mt-3 text-sm">${renderAuslagenList(p.slug)}</div>
                </div>

                <!-- Comments -->
                <div class="bg-white rounded-xl shadow p-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Kommentare & Feedback</h2>
                    <form onsubmit="postComment(event)" class="flex gap-2 mb-4">
                        <input type="text" id="comment-input" placeholder="Kommentar schreiben..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" required>
                        <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700 transition">Senden</button>
                    </form>
                    <div>${commentsHtml}</div>
                </div>
            </div>`;

        // Auslagen-Liste asynchron nachladen
        loadProjektAuslagen(p.slug);
    }

    function renderBudgetBar(p) {
      const budget = Number(p.budget_chf) || 0;
      const verbraucht = (p.auslagen_stat?.total_chf || 0); // alle Status (eingereicht inkl.)
      const ausbezahlt = p.auslagen_stat?.by_status?.ausbezahlt?.summe || 0;
      const fmt = (n) => 'CHF ' + Number(n).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (budget <= 0) {
        return `<div class="bg-gray-50 border border-gray-200 rounded p-3 mb-3 text-sm text-gray-600">
          Kein Budget definiert. Bisherige Auslagen: <strong>${fmt(verbraucht)}</strong>
          ${canEdit ? `<button onclick="editBudget()" class="ml-2 text-blue-600 hover:underline text-xs">Budget setzen</button>` : ''}
        </div>`;
      }
      const pct = Math.min(100, Math.round((verbraucht / budget) * 100));
      const warnPct = Number(p.budget_warnung_pct) || 80;
      const isOver = verbraucht > budget;
      const isWarn = pct >= warnPct;
      const barColor = isOver ? 'bg-red-500' : isWarn ? 'bg-amber-500' : 'bg-emerald-500';
      const textColor = isOver ? 'text-red-700' : isWarn ? 'text-amber-700' : 'text-emerald-700';
      const restCHF = budget - verbraucht;
      return `<div class="bg-gray-50 rounded p-3 mb-3">
        <div class="flex justify-between text-sm mb-1">
          <span class="text-gray-700"><strong>Budget:</strong> ${fmt(budget)}</span>
          <span class="${textColor} font-semibold">${pct}% verbraucht ${isOver ? '⚠ ÜBERSCHRITTEN' : isWarn ? '⚠ knapp' : ''}</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
          <div class="${barColor} h-3 transition-all" style="width: ${pct}%"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-600 mt-1">
          <span>Verbraucht (alle Status): ${fmt(verbraucht)} · davon ausbezahlt: ${fmt(ausbezahlt)}</span>
          <span class="${isOver ? 'text-red-600' : ''}">
            ${isOver ? `Überschreitung: ${fmt(verbraucht - budget)}` : `Verfügbar: ${fmt(restCHF)}`}
          </span>
        </div>
      </div>`;
    }

    function editBudget() {
      const cur = currentProject;
      const budget = prompt('Budget in CHF (leer = kein Budget):', cur.budget_chf || '');
      if (budget === null) return; // Abbruch
      const warnung = budget !== '' ? prompt('Warnung-Schwelle in % (Standard 80):', cur.budget_warnung_pct || 80) : 80;
      AuthentikAuth.apiFetch(`/api/projects/${cur.slug}/budget`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          budget_chf: budget === '' ? null : parseFloat(budget),
          budget_warnung_pct: warnung ? parseInt(warnung, 10) : 80,
        }),
      }).then(r => r.json()).then(d => {
        if (d.error) { alert('Fehler: ' + d.error); return; }
        loadProject(cur.slug);
      });
    }

    function renderAuslagenStat(stat) {
        if (!stat || stat.total_count === 0) return '<p class="text-sm text-gray-500 italic">Noch keine Auslagen für dieses Projekt erfasst.</p>';
        const fmt = (n) => 'CHF ' + Number(n).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const box = (label, key, cls) => {
            const v = stat.by_status[key];
            return `<div class="bg-${cls}-50 border border-${cls}-200 rounded p-2 text-center">
                <div class="text-xs text-${cls}-700 uppercase">${label}</div>
                <div class="font-bold text-${cls}-900">${fmt(v?.summe || 0)}</div>
                <div class="text-xs text-${cls}-600">${v?.count || 0} Eintr.</div>
            </div>`;
        };
        return `<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">
            ${box('Eingereicht', 'eingereicht', 'yellow')}
            ${box('Genehmigt',   'genehmigt',   'blue')}
            ${box('Ausbezahlt',  'ausbezahlt',  'emerald')}
            ${box('Abgelehnt',   'abgelehnt',   'red')}
        </div>
        <div class="text-sm text-gray-700 text-right">Gesamt erfasst: <strong>${fmt(stat.total_chf)}</strong> (${stat.total_count} Auslagen)</div>`;
    }

    function renderAuslagenList(slug) {
        return '<p class="text-gray-400 italic">Lade …</p>';
    }

    async function loadProjektAuslagen(slug) {
        const target = document.getElementById('auslagen-list');
        if (!target) return;
        try {
            const r = await AuthentikAuth.apiFetch(`/api/projects/${slug}/auslagen`);
            if (!r.ok) { target.innerHTML = ''; return; }
            const data = await r.json();
            if (!data.auslagen || data.auslagen.length === 0) {
                target.innerHTML = '';
                return;
            }
            target.innerHTML = `<table class="min-w-full text-sm">
                <thead class="text-xs uppercase text-gray-500 border-b">
                    <tr><th class="text-left py-1">Datum</th><th class="text-left py-1">Eigentümer</th><th class="text-left py-1">Beschreibung</th><th class="text-right py-1">Betrag</th><th class="text-left py-1">Status</th></tr>
                </thead>
                <tbody>${data.auslagen.map(a => `<tr class="border-b last:border-0">
                    <td class="py-1 text-gray-700">${esc(new Date(a.datum).toLocaleDateString('de-CH'))}</td>
                    <td class="py-1 text-gray-700">${esc(a.user_name)}</td>
                    <td class="py-1 text-gray-700">${esc(a.beschreibung)}</td>
                    <td class="py-1 text-right font-mono">CHF ${Number(a.betrag_chf).toFixed(2)}</td>
                    <td class="py-1"><span class="text-xs px-1.5 py-0.5 rounded bg-gray-100">${esc(a.status)}</span></td>
                </tr>`).join('')}</tbody></table>`;
        } catch { target.innerHTML = ''; }
    }

    // ── Edit functions ──
    function showModal(title, fields, onSave) {
        const modal = document.createElement('div');
        modal.id = 'modal';
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4';
        const fieldsHtml = fields.map(f => {
            if (f.type === 'select') {
                const opts = f.options.map(o => `<option value="${o}" ${o === f.value ? 'selected' : ''}>${o}</option>`).join('');
                return `<div><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}</label>
                    <select id="modal-${f.name}" class="w-full border rounded-lg px-3 py-2">${opts}</select></div>`;
            }
            if (f.type === 'textarea') {
                return `<div><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}</label>
                    <textarea id="modal-${f.name}" rows="3" class="w-full border rounded-lg px-3 py-2">${esc(f.value || '')}</textarea></div>`;
            }
            if (f.type === 'checkbox') {
                return `<div><label class="flex items-center gap-2">
                    <input type="checkbox" id="modal-${f.name}" ${f.value ? 'checked' : ''} class="rounded">
                    <span class="text-sm font-medium text-gray-700">${f.label}</span></label></div>`;
            }
            return `<div><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}</label>
                <input type="${f.type || 'text'}" id="modal-${f.name}" value="${esc(f.value || '')}" class="w-full border rounded-lg px-3 py-2"></div>`;
        }).join('');

        modal.innerHTML = `<div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">${title}</h3>
            <div class="space-y-3">${fieldsHtml}</div>
            <div class="flex justify-end gap-3 pt-4">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600">Abbrechen</button>
                <button id="modal-save" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700">Speichern</button>
            </div>
        </div>`;
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.body.appendChild(modal);
        document.getElementById('modal-save').addEventListener('click', () => {
            const data = {};
            fields.forEach(f => {
                const el = document.getElementById(`modal-${f.name}`);
                data[f.name] = f.type === 'checkbox' ? el.checked : el.value;
            });
            onSave(data);
        });
    }

    function closeModal() {
        document.getElementById('modal')?.remove();
    }

    function addCandidate() {
        showModal('Kandidat hinzufügen', [
            { name: 'name', label: 'Firma / Name' },
            { name: 'kontakt', label: 'Kontaktperson' },
            { name: 'telefon', label: 'Telefon' },
            { name: 'email', label: 'E-Mail' },
            { name: 'webseite', label: 'Webseite' },
            { name: 'offerte_betrag', label: 'Offerte Betrag' },
            { name: 'offerte_details', label: 'Offerte Details', type: 'textarea' },
            { name: 'status', label: 'Status', type: 'select', value: 'angefragt', options: ['angefragt', 'offerte erhalten', 'in bewertung', 'favorit', 'abgelehnt'] },
            { name: 'notizen', label: 'Notizen', type: 'textarea' },
        ], async (data) => {
            await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/candidates`, { method: 'POST', body: data });
            closeModal();
            loadProject(currentProject.slug);
        });
    }

    function editCandidate(id) {
        const c = currentProject.candidates.find(x => x.id === id);
        if (!c) return;
        showModal('Kandidat bearbeiten', [
            { name: 'name', label: 'Firma / Name', value: c.name },
            { name: 'kontakt', label: 'Kontaktperson', value: c.kontakt },
            { name: 'telefon', label: 'Telefon', value: c.telefon },
            { name: 'email', label: 'E-Mail', value: c.email },
            { name: 'webseite', label: 'Webseite', value: c.webseite },
            { name: 'offerte_betrag', label: 'Offerte Betrag', value: c.offerte_betrag },
            { name: 'offerte_details', label: 'Offerte Details', type: 'textarea', value: c.offerte_details },
            { name: 'bewertung', label: 'Bewertung (1-5)', type: 'number', value: c.bewertung },
            { name: 'status', label: 'Status', type: 'select', value: c.status, options: ['angefragt', 'offerte erhalten', 'in bewertung', 'favorit', 'abgelehnt'] },
            { name: 'notizen', label: 'Notizen', type: 'textarea', value: c.notizen },
        ], async (data) => {
            await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/candidates/${id}`, { method: 'PUT', body: data });
            closeModal();
            loadProject(currentProject.slug);
        });
    }

    async function deleteCandidate(id) {
        if (!confirm('Kandidat wirklich löschen?')) return;
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/candidates/${id}`, { method: 'DELETE' });
        loadProject(currentProject.slug);
    }

    function addTimeline() {
        showModal('Timeline-Eintrag hinzufügen', [
            { name: 'datum', label: 'Datum', type: 'date', value: new Date().toISOString().split('T')[0] },
            { name: 'titel', label: 'Titel' },
            { name: 'beschreibung', label: 'Beschreibung', type: 'textarea' },
            { name: 'erledigt', label: 'Erledigt', type: 'checkbox' },
        ], async (data) => {
            await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/timeline`, { method: 'POST', body: data });
            closeModal();
            loadProject(currentProject.slug);
        });
    }

    function editTimeline(id) {
        const t = currentProject.timeline.find(x => x.id === id);
        if (!t) return;
        showModal('Timeline-Eintrag bearbeiten', [
            { name: 'datum', label: 'Datum', type: 'date', value: t.datum?.split('T')[0] },
            { name: 'titel', label: 'Titel', value: t.titel },
            { name: 'beschreibung', label: 'Beschreibung', type: 'textarea', value: t.beschreibung },
            { name: 'erledigt', label: 'Erledigt', type: 'checkbox', value: t.erledigt },
        ], async (data) => {
            await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/timeline/${id}`, { method: 'PUT', body: data });
            closeModal();
            loadProject(currentProject.slug);
        });
    }

    async function toggleTimeline(id, erledigt) {
        const t = currentProject.timeline.find(x => x.id === id);
        if (!t) return;
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/timeline/${id}`, {
            method: 'PUT', body: { ...t, datum: t.datum?.split('T')[0], erledigt }
        });
        loadProject(currentProject.slug);
    }

    async function deleteTimeline(id) {
        if (!confirm('Eintrag wirklich löschen?')) return;
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/timeline/${id}`, { method: 'DELETE' });
        loadProject(currentProject.slug);
    }

    async function postComment(e) {
        e.preventDefault();
        const input = document.getElementById('comment-input');
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/comments`, { method: 'POST', body: { text: input.value } });
        input.value = '';
        loadProject(currentProject.slug);
    }

    async function deleteComment(id) {
        if (!confirm('Kommentar löschen?')) return;
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/comments/${id}`, { method: 'DELETE' });
        loadProject(currentProject.slug);
    }

    // ── Document functions ──
    function renderProjectFiles() {
        const el = document.getElementById('project-files');
        if (!el) return;
        const folder = `projekte/${currentProject.slug}/`;
        // Only show root-level files (not in timeline/ or kandidaten/ subfolders)
        const files = projectDocs.filter(f =>
            f.path.startsWith(folder) &&
            !f.path.endsWith('.gitkeep') &&
            f.path.replace(folder, '').split('/').length === 1
        );
        if (files.length === 0) {
            el.innerHTML = '<p class="text-gray-400">Keine Dokumente vorhanden.</p>';
            return;
        }
        el.innerHTML = files.map(f => {
            const name = f.path.split('/').pop();
            const size = f.size ? ` <span class="text-gray-400">(${formatSize(f.size)})</span>` : '';
            return `<div class="flex items-center justify-between py-2 border-b last:border-0">
                <a href="${f.url}" target="_blank" class="text-emerald-700 hover:underline flex-1 truncate">${esc(name)}${size}</a>
                ${canEdit ? `<button onclick="deleteDoc('${f.path.replace(/'/g, "\\'")}')" class="text-red-300 hover:text-red-500 ml-2 text-xs" title="Löschen">&times;</button>` : ''}
            </div>`;
        }).join('');
    }

    function renderAttachments(directFiles, type, id) {
        // Direct uploads in subfolder
        const folder = `projekte/${currentProject.slug}/${type}/${id}/`;
        const directHtml = directFiles.map(f => {
            const name = f.path.split('/').pop();
            return `<span class="inline-flex items-center gap-1 bg-gray-50 rounded px-1.5 py-0.5">
                <a href="${f.url}" target="_blank" class="text-emerald-600 hover:underline">${esc(name)}</a>
                ${canEdit ? `<button onclick="deleteDoc('${f.path.replace(/'/g, "\\'")}')" class="text-red-300 hover:text-red-500">&times;</button>` : ''}
            </span>`;
        }).join(' ');

        // Linked docs from project_attachments
        const linked = (currentProject.attachments || []).filter(a => a.target_type === type && a.target_id === id);
        const linkedHtml = linked.map(a => {
            const name = a.doc_path.split('/').pop();
            const doc = projectDocs.find(d => d.path === a.doc_path);
            const url = doc ? doc.url : `/api/documents/${a.doc_path}`;
            return `<span class="inline-flex items-center gap-1 bg-blue-50 rounded px-1.5 py-0.5">
                <a href="${url}" target="_blank" class="text-blue-600 hover:underline">${esc(name)}</a>
                ${canEdit ? `<button onclick="unlinkDoc(${a.id})" class="text-red-300 hover:text-red-500" title="Verknüpfung lösen">&times;</button>` : ''}
            </span>`;
        }).join(' ');

        const buttons = canEdit ? `
            <label class="text-gray-400 hover:text-emerald-600 cursor-pointer" title="Neue Datei hochladen">
                &#128206;<input type="file" class="hidden" multiple onchange="uploadToFolder('${folder}', this.files)">
            </label>
            <button onclick="showLinkPicker('${type}', ${id})" class="text-gray-400 hover:text-blue-600" title="Bestehendes Dokument verknüpfen">&#128279;</button>
        ` : '';

        if (!directFiles.length && !linked.length && !canEdit) return '';
        return `<div class="flex flex-wrap items-center gap-2 mt-1 text-xs">${directHtml}${linkedHtml}${buttons}</div>`;
    }

    async function uploadToFolder(folder, fileList) {
        for (const file of fileList) {
            const name = file.name.replace(/[^a-zA-Z0-9äöüÄÖÜß._\-() ]/g, '_');
            const path = `${folder}${name}`;
            const buffer = await file.arrayBuffer();
            const token = AuthentikAuth.getToken();
            await fetch(`/api/documents/${path}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/octet-stream',
                    ...(token ? { Authorization: `Bearer ${token}` } : {})
                },
                body: buffer
            });
        }
        loadProject(currentProject.slug);
    }

    async function uploadProjectFiles(fileList) {
        const folder = `projekte/${currentProject.slug}/`;
        await uploadToFolder(folder, fileList);
    }

    async function deleteDoc(path) {
        if (!confirm('Dokument wirklich löschen?')) return;
        await AuthentikAuth.apiFetch(`/api/documents/${path}`, { method: 'DELETE' });
        loadProject(currentProject.slug);
    }

    function showLinkPicker(type, id) {
        const folder = `projekte/${currentProject.slug}/`;
        // Show all root-level project docs that aren't already linked to this target
        const linked = (currentProject.attachments || [])
            .filter(a => a.target_type === type && a.target_id === id)
            .map(a => a.doc_path);
        const available = projectDocs.filter(f =>
            f.path.startsWith(folder) &&
            !f.path.endsWith('.gitkeep') &&
            f.path.replace(folder, '').split('/').length === 1 &&
            !linked.includes(f.path)
        );
        if (available.length === 0) {
            alert('Keine Dokumente zum Verknüpfen vorhanden.\nLade zuerst Dokumente im Bereich "Dokumente" hoch.');
            return;
        }
        const modal = document.createElement('div');
        modal.id = 'modal';
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4';
        modal.innerHTML = `<div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">Dokument verknüpfen</h3>
            <div class="space-y-2">
                ${available.map(f => {
                    const name = f.path.split('/').pop();
                    return `<button onclick="linkDoc('${type}', ${id}, '${f.path.replace(/'/g, "\\'")}')"
                        class="w-full text-left px-3 py-2 rounded-lg hover:bg-emerald-50 text-sm text-gray-700 border hover:border-emerald-300 transition">
                        ${esc(name)}
                    </button>`;
                }).join('')}
            </div>
            <div class="flex justify-end pt-4">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600">Abbrechen</button>
            </div>
        </div>`;
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.body.appendChild(modal);
    }

    async function linkDoc(type, id, path) {
        closeModal();
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/attachments`, {
            method: 'POST', body: { target_type: type, target_id: id, doc_path: path }
        });
        loadProject(currentProject.slug);
    }

    async function unlinkDoc(attachmentId) {
        if (!confirm('Verknüpfung lösen?')) return;
        await AuthentikAuth.apiFetch(`/api/projects/${currentProject.slug}/attachments/${attachmentId}`, { method: 'DELETE' });
        loadProject(currentProject.slug);
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    init();
    </script>
</body>
</html>
