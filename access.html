<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosenweg Access — Zutrittsverwaltung</title>
    <link rel="icon" href="/logo-rosenweg-technik.png">
    <meta name="robots" content="noindex,nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/authentik-auth.js?v=2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-btn { padding: .55rem .9rem; font-size: .875rem; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: #b91c1c; border-color: #b91c1c; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="/logo-rosenweg-technik.png" class="h-8 w-8" alt="">
                <span class="font-bold">Rosenweg <span class="text-red-700">Access</span></span>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="user-name" class="text-gray-500 hidden sm:inline"></span>
                <a href="https://admin.rosenweg4303.ch/" class="text-red-700 hover:underline">← Admin</a>
                <button onclick="AuthentikAuth.logout()" class="text-gray-500 hover:text-gray-800">Abmelden</button>
            </div>
        </div>
    </header>

    <div id="gate" class="max-w-md mx-auto mt-24 text-center text-gray-500">Lade…</div>

    <main id="app" class="max-w-6xl mx-auto px-4 py-6 hidden">
        <nav class="flex gap-1 border-b mb-5 overflow-x-auto">
            <button class="tab-btn active" data-tab="doors">🚪 Türen</button>
            <button class="tab-btn" data-tab="logs">📋 Zutritts-Log</button>
            <button class="tab-btn" data-tab="users">👥 Benutzer</button>
            <button class="tab-btn" data-tab="visitors">🎫 Besucher</button>
            <button class="tab-btn ml-auto" data-tab="settings">⚙️</button>
        </nav>

        <div id="status" class="hidden mb-4 px-4 py-2.5 rounded-lg text-sm"></div>

        <section id="panel-doors" class="tab-panel"></section>
        <section id="panel-logs" class="tab-panel hidden"></section>
        <section id="panel-users" class="tab-panel hidden"></section>
        <section id="panel-visitors" class="tab-panel hidden"></section>
        <section id="panel-settings" class="tab-panel hidden"></section>
    </main>

    <script>
    // ─────────────────────────── Helpers ───────────────────────────
    const $ = (s, r=document) => r.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const loaded = {};

    async function api(path, opts = {}) {
        const res = await AuthentikAuth.apiFetch('/api/access' + path, opts);
        if (!res.ok) {
            let msg = 'Fehler ' + res.status;
            try { const j = await res.json(); msg = j.error || msg; } catch {}
            const e = new Error(msg); e.status = res.status; throw e;
        }
        return res.json();
    }
    function showStatus(msg, type = 'info') {
        const el = $('#status');
        const styles = { info: 'bg-blue-50 text-blue-800', ok: 'bg-green-50 text-green-800', err: 'bg-red-50 text-red-800' };
        el.className = 'mb-4 px-4 py-2.5 rounded-lg text-sm ' + (styles[type] || styles.info);
        el.textContent = msg; el.classList.remove('hidden');
        if (type === 'ok') setTimeout(() => el.classList.add('hidden'), 3500);
    }
    const fmtTime = (v) => { if (!v) return '—'; const d = new Date(typeof v === 'number' && v < 1e12 ? v * 1000 : v); return isNaN(d) ? esc(v) : d.toLocaleString('de-CH'); };

    // ─────────────────────────── Tabs ───────────────────────────
    function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== 'panel-' + name));
        $('#status').classList.add('hidden');
        ({ doors: loadDoors, logs: loadLogs, users: loadUsers, visitors: loadVisitors, settings: loadSettings }[name])();
    }

    // ─────────────────────────── Türen ───────────────────────────
    async function loadDoors() {
        const p = $('#panel-doors');
        p.innerHTML = '<div class="text-gray-400 text-sm">Lade Türen…</div>';
        try {
            const { doors } = await api('/doors');
            if (!doors.length) { p.innerHTML = '<div class="text-gray-500">Keine Türen gefunden.</div>'; return; }
            p.innerHTML = '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">' + doors.map(d => {
                const locked = d.lock_state === 'lock';
                const online = d.online === true || d.online === 'true';
                const pos = d.position === 'open' ? '<span class="text-amber-600">⚠️ offen</span>' : (d.position === 'close' ? 'geschlossen' : '');
                return `<div class="bg-white rounded-xl border p-4 shadow-sm">
                    <div class="flex items-start justify-between gap-2">
                        <div><div class="font-semibold">${esc(d.name || d.full_name)}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${esc(d.full_name || '')}</div></div>
                        <span class="text-xs px-2 py-0.5 rounded-full ${online ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">${online ? '🟢 online' : '⚪ offline'}</span>
                    </div>
                    <div class="flex items-center gap-3 mt-3 text-sm">
                        <span class="px-2 py-0.5 rounded ${locked ? 'bg-gray-100 text-gray-700' : 'bg-amber-100 text-amber-700'}">${locked ? '🔒 verriegelt' : '🔓 entriegelt'}</span>
                        <span class="text-gray-500 text-xs">${pos}</span>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button onclick="unlockDoor('${esc(d.id)}', this)" class="flex-1 bg-red-700 hover:bg-red-800 text-white text-sm font-medium rounded-lg py-2">🔓 Öffnen</button>
                        <button onclick="doorGrants('${esc(d.id)}','${esc((d.name || d.full_name || '').replace(/'/g, ''))}')" class="px-3 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm" title="Berechtigte Gruppen">👥</button>
                    </div>
                </div>`;
            }).join('') + '</div><div id="door-groups-mgmt" class="mt-6"></div><div id="door-policies" class="mt-6"></div>';
            renderDoorGroups();
            renderDoorPolicies();
        } catch (e) { p.innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
    }
    let authentikGroups = [];
    let allDoorsCache = [];
    // ── Tür-Gruppen (Gebäude) verwalten ──
    async function renderDoorGroups() {
        const el = $('#door-groups-mgmt'); if (!el) return;
        try {
            const { groups } = await api('/door-groups');
            const items = groups.map(g => `<div class="flex items-center justify-between border-b last:border-0 px-3 py-2">
                <div><div class="font-medium text-sm">${esc(g.name)}</div>
                <div class="text-xs text-gray-500">${(g.door_ids || []).length} Tür(en) · Gruppen: ${(g.authentik_groups || []).map(esc).join(', ') || '—'}</div></div>
                <div class="whitespace-nowrap"><button onclick='editDoorGroup(${JSON.stringify(g).replace(/'/g, "&#39;")})' class="text-blue-600 hover:underline text-xs">Bearbeiten</button>
                <button onclick="delDoorGroup(${g.id})" class="text-red-600 hover:underline text-xs ml-2">Löschen</button></div></div>`).join('');
            el.innerHTML = `<div class="flex items-center justify-between mb-2"><h2 class="text-sm font-semibold text-gray-600">Tür-Gruppen (Gebäude)</h2>
                <button onclick="editDoorGroup()" class="text-sm bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5">+ Neu</button></div>
                <div class="bg-white rounded-xl border">${items || '<div class="text-gray-400 text-sm px-3 py-3">Noch keine Tür-Gruppen. Bündle Türen z.B. nach Gebäude (R9, …) und gib der Gruppe Authentik-Gruppen — gilt dann für alle Türen der Gruppe.</div>'}</div>`;
        } catch (e) { el.innerHTML = `<div class="text-red-500 text-sm">${esc(e.message)}</div>`; }
    }
    async function editDoorGroup(g) {
        const edit = !!g;
        if (!authentikGroups.length) { try { authentikGroups = (await api('/authentik-groups')).groups || []; } catch {} }
        if (!allDoorsCache.length) { try { allDoorsCache = (await api('/doors')).doors || []; } catch {} }
        const selDoors = new Set(edit ? (g.door_ids || []) : []);
        const selGroups = new Set(edit ? (g.authentik_groups || []) : []);
        const m = document.createElement('div');
        m.className = 'fixed inset-0 bg-black/40 flex items-start justify-center z-50 p-4 overflow-y-auto';
        m.innerHTML = `<div class="bg-white rounded-xl p-5 w-full max-w-md shadow-xl my-8">
            <h3 class="font-semibold mb-3">${edit ? 'Tür-Gruppe bearbeiten' : 'Neue Tür-Gruppe'}</h3>
            <input id="dgr-name" placeholder="Name (z.B. Gebäude R9)" value="${esc(edit ? g.name : '')}" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
            <div class="text-sm font-medium mb-1">Türen in dieser Gruppe</div>
            <div class="border rounded-lg p-2 mb-3 max-h-40 overflow-y-auto space-y-1 text-sm">${allDoorsCache.map(d => `<label class="flex items-center gap-2"><input type="checkbox" class="dgr-door" value="${esc(d.id)}" ${selDoors.has(d.id) ? 'checked' : ''}><span>${esc(d.name || d.full_name)}</span></label>`).join('') || '<span class="text-gray-400">Keine Türen</span>'}</div>
            <div class="text-sm font-medium mb-1">Berechtigte Authentik-Gruppen</div>
            <input id="dgr-gsearch" placeholder="Gruppe suchen…" class="w-full border rounded-lg px-3 py-1.5 text-sm mb-1">
            <div id="dgr-glist" class="border rounded-lg p-2 max-h-40 overflow-y-auto space-y-1 text-sm"></div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="dgr-cancel" type="button" class="text-sm text-gray-500 px-3 py-2">Abbrechen</button>
                <button id="dgr-save" type="button" class="text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-4 py-2">Speichern</button>
            </div></div>`;
        document.body.appendChild(m);
        const glist = m.querySelector('#dgr-glist');
        const drawG = () => {
            const q = (m.querySelector('#dgr-gsearch').value || '').toLowerCase();
            glist.innerHTML = authentikGroups.filter(x => !q || x.toLowerCase().includes(q)).map(x => `<label class="flex items-center gap-2"><input type="checkbox" value="${esc(x)}" ${selGroups.has(x) ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('');
            glist.querySelectorAll('input').forEach(cb => cb.onchange = () => { cb.checked ? selGroups.add(cb.value) : selGroups.delete(cb.value); });
        };
        drawG();
        m.querySelector('#dgr-gsearch').oninput = drawG;
        m.querySelector('#dgr-cancel').onclick = () => m.remove();
        m.onclick = e => { if (e.target === m) m.remove(); };
        m.querySelector('#dgr-save').onclick = async () => {
            const name = m.querySelector('#dgr-name').value.trim();
            if (!name) { showStatus('Name erforderlich', 'err'); return; }
            const doorIds = [...m.querySelectorAll('.dgr-door:checked')].map(c => c.value);
            try {
                const id = edit ? g.id : (await api('/door-groups', { method: 'POST', body: { name } })).id;
                await api('/door-groups/' + id, { method: 'PUT', body: { name, door_ids: doorIds, authentik_groups: [...selGroups] } });
                showStatus('Gespeichert', 'ok'); m.remove(); renderDoorGroups();
            } catch (e) { showStatus(e.message, 'err'); }
        };
    }
    async function delDoorGroup(id) {
        if (!confirm('Tür-Gruppe löschen?')) return;
        try { await api('/door-groups/' + id, { method: 'DELETE' }); showStatus('Gelöscht', 'ok'); renderDoorGroups(); }
        catch (e) { showStatus(e.message, 'err'); }
    }
    async function renderDoorPolicies() { // Sync-Panel unter den Türen
        const el = $('#door-policies'); if (!el) return;
        el.innerHTML = `<div class="bg-white rounded-xl border p-4">
            <div class="flex items-center justify-between gap-3 flex-wrap">
                <div><div class="font-semibold text-sm">Zugang synchronisieren</div>
                <div class="text-xs text-gray-500">Überträgt die Gruppen-Berechtigungen der Türen auf UniFi (Authentik → Türzugang). Läuft auch automatisch alle 30 Min.</div></div>
                <button onclick="runSync(true)" class="text-sm bg-gray-800 hover:bg-gray-900 text-white rounded-lg px-3 py-1.5">Vorschau</button>
            </div>
            <div id="sync-result" class="mt-3 text-sm"></div></div>`;
    }
    async function runSync(dry) {
        const out = $('#sync-result'); out.innerHTML = '<span class="text-gray-400">Berechne…</span>';
        try {
            const r = await api('/sync' + (dry ? '?dry=1' : ''), { method: 'POST' });
            if (r.dryRun) {
                const rows = (r.perDoor || []).map(d => `<tr class="border-b last:border-0"><td class="py-1.5 pr-3 font-medium">${esc(d.door)}</td>
                    <td class="py-1.5 pr-3 text-gray-500">${esc(d.groups.join(', ') || '—')}</td>
                    <td class="py-1.5 text-right whitespace-nowrap">${d.in_unifi}/${d.berechtigt}</td></tr>`).join('');
                out.innerHTML = `<div class="text-gray-600 mb-2">Vorschau — es wird noch nichts geändert:</div>
                    <div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="text-gray-400 text-left border-b"><th class="py-1 pr-3">Tür</th><th class="py-1 pr-3">Berechtigte Gruppen</th><th class="py-1 text-right">in UniFi / berechtigt</th></tr></thead>
                    <tbody>${rows || '<tr><td colspan="3" class="text-gray-400 py-2">Noch keine Tür hat Gruppen-Berechtigungen — über 👥 bei einer Tür setzen.</td></tr>'}</tbody></table></div>
                    ${r.unmatchedEmails ? `<div class="text-amber-600 text-xs mt-2">⚠️ ${r.unmatchedEmails} berechtigte Person(en) haben (noch) keinen UniFi-Benutzer → nicht zuweisbar.</div>` : ''}
                    ${(r.perDoor || []).some(d => d.berechtigt) ? `<button onclick="runSync(false)" class="mt-3 text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-4 py-2">Jetzt anwenden</button>` : ''}`;
            } else {
                out.innerHTML = `<div class="text-green-700">✓ Synchronisiert: ${r.assigned} Zugänge vergeben, ${r.revoked} entzogen (${r.matched} Benutzer betroffen).</div>`;
            }
        } catch (e) { out.innerHTML = `<span class="text-red-600">${esc(e.message)}</span>`; }
    }
    async function doorGrants(doorId, doorName) {
        if (!authentikGroups.length) { try { authentikGroups = (await api('/authentik-groups')).groups || []; } catch {} }
        let cur = { direct: [], inherited: [] };
        try { cur = await api('/doors/' + encodeURIComponent(doorId) + '/grants'); } catch {}
        const sel = new Set(cur.direct || []);
        const m = document.createElement('div');
        m.className = 'fixed inset-0 bg-black/40 flex items-start justify-center z-50 p-4 overflow-y-auto';
        const inh = (cur.inherited || []).length ? `<div class="text-xs text-gray-500 mb-2">Zusätzlich vererbt über Tür-Gruppen: ${cur.inherited.map(i => esc(i.authentik_group) + ' (' + esc(i.via) + ')').join(', ')}</div>` : '';
        m.innerHTML = `<div class="bg-white rounded-xl p-5 w-full max-w-md shadow-xl my-8">
            <h3 class="font-semibold mb-0.5">Berechtigte Gruppen</h3>
            <div class="text-sm text-gray-500 mb-3">${esc(doorName)}</div>${inh}
            <input id="dg-search" placeholder="Authentik-Gruppe suchen…" class="w-full border rounded-lg px-3 py-2 text-sm mb-2">
            <div id="dg-list" class="max-h-72 overflow-y-auto border rounded-lg p-2 space-y-1 text-sm"></div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="dg-cancel" type="button" class="text-sm text-gray-500 px-3 py-2">Abbrechen</button>
                <button id="dg-save" type="button" class="text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-4 py-2">Speichern</button>
            </div></div>`;
        document.body.appendChild(m);
        const list = m.querySelector('#dg-list');
        const draw = () => {
            const q = (m.querySelector('#dg-search').value || '').toLowerCase();
            list.innerHTML = authentikGroups.filter(g => !q || g.toLowerCase().includes(q)).map(g =>
                `<label class="flex items-center gap-2"><input type="checkbox" value="${esc(g)}" ${sel.has(g) ? 'checked' : ''}><span>${esc(g)}</span></label>`).join('') || '<div class="text-gray-400 px-1">Keine Gruppen gefunden.</div>';
            list.querySelectorAll('input').forEach(cb => cb.onchange = () => { cb.checked ? sel.add(cb.value) : sel.delete(cb.value); });
        };
        draw();
        m.querySelector('#dg-search').oninput = draw;
        m.querySelector('#dg-cancel').onclick = () => m.remove();
        m.onclick = (e) => { if (e.target === m) m.remove(); };
        m.querySelector('#dg-save').onclick = async () => {
            try { await api('/doors/' + encodeURIComponent(doorId) + '/grants', { method: 'PUT', body: { authentik_groups: [...sel] } }); showStatus('Gruppen gespeichert — jetzt synchronisieren', 'ok'); m.remove(); }
            catch (e) { showStatus(e.message, 'err'); }
        };
    }
    async function unlockDoor(id, btn) {
        if (!confirm('Tür wirklich entriegeln?')) return;
        btn.disabled = true; btn.textContent = '…';
        try { const r = await api('/doors/' + encodeURIComponent(id) + '/unlock', { method: 'POST' }); showStatus(r.message || 'Tür entsperrt', 'ok'); }
        catch (e) { showStatus(e.message, 'err'); }
        finally { setTimeout(loadDoors, 1200); }
    }

    // ─────────────────────────── Zutritts-Log ───────────────────────────
    const LOG_TOPICS = [['door_openings','Türöffnungen'],['critical','Kritisch'],['admin_activity','Admin-Aktivität'],['visitor','Besucher'],['updates','Updates']];
    async function loadLogs() {
        const p = $('#panel-logs');
        if (!p.dataset.init) {
            p.dataset.init = '1';
            p.innerHTML = `<div class="flex items-center gap-2 mb-3">
                <label class="text-sm text-gray-500">Kategorie:</label>
                <select id="log-topic" class="border rounded-lg px-2 py-1.5 text-sm">${LOG_TOPICS.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('')}</select>
                <button onclick="renderLogs()" class="text-sm bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5">Aktualisieren</button>
            </div><div id="log-body"></div>`;
        }
        renderLogs();
    }
    async function renderLogs() {
        const body = $('#log-body'); const topic = $('#log-topic').value;
        body.innerHTML = '<div class="text-gray-400 text-sm">Lade Ereignisse…</div>';
        try {
            const { logs } = await api('/logs?topic=' + encodeURIComponent(topic));
            if (!logs.length) { body.innerHTML = '<div class="text-gray-500 text-sm">Keine Ereignisse in dieser Kategorie.</div>'; return; }
            const rows = logs.map(h => {
                const s = h._source || h;
                const ts = h['@timestamp'] || s['@timestamp'] || s.timestamp || (s.event && s.event.published) || s.published;
                const actor = (s.actor && (s.actor.display_name || s.actor.name)) || s.actor_name || '';
                const msg = (s.event && (s.event.display_message || s.event.type)) || s.display_message || s.message || '';
                const tgt = Array.isArray(s.target) ? s.target.map(t => t.display_name || t.name).filter(Boolean).join(', ') : '';
                return `<tr class="border-b hover:bg-gray-50">
                    <td class="px-3 py-2 text-gray-500 whitespace-nowrap">${fmtTime(ts)}</td>
                    <td class="px-3 py-2">${esc(actor)}</td>
                    <td class="px-3 py-2">${esc(msg)}</td>
                    <td class="px-3 py-2 text-gray-500">${esc(tgt)}</td></tr>`;
            }).join('');
            body.innerHTML = `<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
                <thead><tr class="text-left text-xs text-gray-400 border-b"><th class="px-3 py-2">Zeit</th><th class="px-3 py-2">Person</th><th class="px-3 py-2">Ereignis</th><th class="px-3 py-2">Tür</th></tr></thead>
                <tbody>${rows}</tbody></table></div>`;
        } catch (e) { body.innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
    }

    // ─────────────────────────── Benutzer ───────────────────────────
    let allUsers = [];
    let allPolicies = [];
    async function loadUsers() {
        const p = $('#panel-users');
        p.innerHTML = '<div class="text-gray-400 text-sm">Lade Benutzer…</div>';
        try {
            const { users } = await api('/users');
            allUsers = users || [];
            p.innerHTML = `<div class="flex items-center gap-2 mb-3">
                <input id="user-search" oninput="renderUsers()" placeholder="Suchen…" class="border rounded-lg px-3 py-1.5 text-sm flex-1 max-w-xs">
                <span class="text-xs text-gray-400">${allUsers.length} Benutzer</span>
                <button onclick="editUser()" class="ml-auto text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-3 py-1.5">+ Neu</button>
            </div><div id="user-body"></div>`;
            renderUsers();
        } catch (e) { p.innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
    }
    function renderUsers() {
        const q = ($('#user-search')?.value || '').toLowerCase();
        const list = allUsers.filter(u => !q || (`${u.first_name || ''} ${u.last_name || ''} ${u.email || u.user_email || ''} ${u.employee_number || ''}`.toLowerCase().includes(q)));
        const rows = list.map(u => {
            const name = esc(u.full_name || `${u.first_name || ''} ${u.last_name || ''}`.trim() || u.username || u.id);
            const nfc = Array.isArray(u.nfc_cards) ? u.nfc_cards.length : 0;
            const pin = u.pin_code ? '•••• <span class="text-xs text-gray-400">gesetzt</span>' : '<span class="text-gray-300">—</span>';
            const active = (u.status || '').toUpperCase() === 'ACTIVE';
            return `<tr class="border-b hover:bg-gray-50">
                <td class="px-3 py-2 font-medium">${name}</td>
                <td class="px-3 py-2 text-gray-500">${esc(u.email || u.user_email || '')}</td>
                <td class="px-3 py-2"><span class="text-xs px-2 py-0.5 rounded-full ${active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">${esc(u.status || '—')}</span></td>
                <td class="px-3 py-2">${pin}</td>
                <td class="px-3 py-2 text-gray-500">${nfc ? nfc + ' 🪪' : '—'}</td>
                <td class="px-3 py-2 text-right whitespace-nowrap">
                    <button onclick='editUser(${JSON.stringify(u).replace(/'/g, "&#39;")})' class="text-blue-600 hover:underline text-xs">Bearbeiten</button>
                    <button onclick="delUser('${esc(u.id)}','${name.replace(/'/g,"")}')" class="text-red-600 hover:underline text-xs ml-2">Löschen</button>
                </td></tr>`;
        }).join('');
        $('#user-body').innerHTML = `<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-gray-400 border-b"><th class="px-3 py-2">Name</th><th class="px-3 py-2">E-Mail</th><th class="px-3 py-2">Status</th><th class="px-3 py-2">PIN</th><th class="px-3 py-2">NFC</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="px-3 py-4 text-gray-400">Keine Treffer.</td></tr>'}</tbody></table></div>`;
    }
    // Voller Benutzer-Editor: Stammdaten + PIN + NFC-Karten + Zugang (Policies)
    function editUser(u) {
        const edit = !!u;
        const v = u || {};
        const m = document.createElement('div');
        m.className = 'fixed inset-0 bg-black/40 flex items-start justify-center z-50 p-4 overflow-y-auto';
        m.innerHTML = `<div class="bg-white rounded-xl p-5 w-full max-w-md shadow-xl my-8">
            <h3 class="font-semibold mb-3">${edit ? 'Benutzer bearbeiten' : 'Neuer Benutzer'}</h3>
            <div class="space-y-2">
                <div class="flex gap-2">
                    <input id="eu-first" placeholder="Vorname *" value="${esc(v.first_name || '')}" class="w-1/2 border rounded-lg px-3 py-2 text-sm">
                    <input id="eu-last" placeholder="Nachname" value="${esc(v.last_name || '')}" class="w-1/2 border rounded-lg px-3 py-2 text-sm">
                </div>
                <input id="eu-email" placeholder="E-Mail" value="${esc(v.email || v.user_email || '')}" class="w-full border rounded-lg px-3 py-2 text-sm">
                <input id="eu-emp" placeholder="Personal-Nr. (optional)" value="${esc(v.employee_number || '')}" class="w-full border rounded-lg px-3 py-2 text-sm">
                <input id="eu-pin" placeholder="PIN-Code (Ziffern${edit ? ', leer = unverändert' : ''})" inputmode="numeric" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            ${edit ? `
            <div class="mt-4 border-t pt-3">
                <div class="text-sm font-medium mb-1.5">NFC-Karten</div>
                <div id="eu-nfc" class="text-sm text-gray-400">…</div>
                <button id="eu-enroll" type="button" class="mt-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5">🪪 Karte anlernen</button>
            </div>
            <div class="mt-4 border-t pt-3">
                <div class="text-sm font-medium mb-1.5">Zugang (Policies)</div>
                <div id="eu-policies" class="space-y-1 text-sm text-gray-400">…</div>
            </div>` : ''}
            <div class="flex justify-end gap-2 mt-5">
                <button id="eu-close" type="button" class="text-sm text-gray-500 px-3 py-2">${edit ? 'Schließen' : 'Abbrechen'}</button>
                <button id="eu-save" type="button" class="text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-4 py-2">Speichern</button>
            </div></div>`;
        document.body.appendChild(m);
        const close = () => m.remove();
        m.querySelector('#eu-close').onclick = close;
        m.onclick = (e) => { if (e.target === m) close(); };
        m.querySelector('#eu-save').onclick = async () => {
            const first = m.querySelector('#eu-first').value.trim();
            if (!first) { showStatus('Vorname erforderlich', 'err'); return; }
            const body = { first_name: first, last_name: m.querySelector('#eu-last').value.trim(), email: m.querySelector('#eu-email').value.trim(), employee_number: m.querySelector('#eu-emp').value.trim() };
            const pin = m.querySelector('#eu-pin').value.trim(); if (pin) body.pin_code = pin;
            try {
                if (edit) await api('/users/' + encodeURIComponent(v.id), { method: 'PUT', body });
                else await api('/users', { method: 'POST', body });
                showStatus('Gespeichert', 'ok'); close(); loadUsers();
            } catch (e) { showStatus(e.message, 'err'); }
        };
        if (edit) {
            renderNfcCards(m, v);
            renderUserPolicies(m, v);
            m.querySelector('#eu-enroll').onclick = () => nfcEnroll(v, m);
        }
    }
    function renderNfcCards(m, u) {
        const el = m.querySelector('#eu-nfc');
        const cards = Array.isArray(u.nfc_cards) ? u.nfc_cards : [];
        if (!cards.length) { el.innerHTML = '<span class="text-gray-400">Keine Karten</span>'; return; }
        el.innerHTML = cards.map(c => {
            const tok = c.token || c.id || c.card_id || '';
            return `<div class="flex items-center justify-between py-0.5"><span>🪪 ${esc(c.display_id || c.id || tok)}</span>
                <button onclick="nfcRemove('${esc(u.id)}','${esc(tok)}', this)" class="text-red-600 hover:underline text-xs">entfernen</button></div>`;
        }).join('');
    }
    async function nfcRemove(userId, token, btn) {
        if (!confirm('NFC-Karte entfernen?')) return;
        btn.disabled = true;
        try { await api('/users/' + encodeURIComponent(userId) + '/nfc/' + encodeURIComponent(token), { method: 'DELETE' }); showStatus('Karte entfernt', 'ok'); loadUsers(); }
        catch (e) { showStatus(e.message, 'err'); btn.disabled = false; }
    }
    function pickReader(devices) {
        return new Promise(resolve => {
            const m = document.createElement('div');
            m.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4';
            m.innerHTML = `<div class="bg-white rounded-xl p-5 w-full max-w-xs">
                <h3 class="font-semibold mb-3">Leser wählen</h3>
                <div class="space-y-2">${devices.map(d => `<button data-id="${esc(d.id)}" class="w-full text-left border rounded-lg px-3 py-2 text-sm hover:bg-gray-50 ${d.online ? '' : 'opacity-50'}">${esc(d.name)} <span class="text-xs text-gray-400">${esc(d.model)}${d.online ? '' : ' · offline'}</span></button>`).join('')}</div>
                <button id="pr-cancel" type="button" class="text-sm text-gray-500 mt-3">Abbrechen</button></div>`;
            document.body.appendChild(m);
            m.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { m.remove(); resolve(b.dataset.id); });
            m.querySelector('#pr-cancel').onclick = () => { m.remove(); resolve(null); };
            m.onclick = e => { if (e.target === m) { m.remove(); resolve(null); } };
        });
    }
    async function nfcEnroll(u, m) {
        let devices = [];
        try { devices = (await api('/nfc/devices')).devices || []; } catch {}
        let deviceId;
        if (devices.length === 1) deviceId = devices[0].id;
        else if (devices.length > 1) { deviceId = await pickReader(devices); if (!deviceId) return; }
        let session;
        try { const r = await api('/nfc/session', { method: 'POST', body: deviceId ? { device_id: deviceId } : {} }); session = r.session_id; }
        catch (e) { return showStatus('Enrollment-Start fehlgeschlagen: ' + e.message, 'err'); }
        if (!session) return showStatus('Keine Enrollment-Session erhalten', 'err');
        const ov = document.createElement('div');
        ov.className = 'fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4';
        ov.innerHTML = `<div class="bg-white rounded-xl p-6 text-center max-w-xs">
            <div class="text-4xl mb-3 animate-pulse">🪪</div>
            <div class="font-medium mb-1">Karte an den Leser halten…</div>
            <div class="text-xs text-gray-500 mb-4">UA Ultra · Schlüsselkasten R9 UG</div>
            <button id="nfc-cancel" type="button" class="text-sm text-gray-500">Abbrechen</button></div>`;
        document.body.appendChild(ov);
        let done = false;
        const stop = async () => { if (done) return; done = true; ov.remove(); try { await api('/nfc/session/' + session, { method: 'DELETE' }); } catch {} };
        ov.querySelector('#nfc-cancel').onclick = stop;
        for (let i = 0; i < 30 && !done; i++) {
            await new Promise(r => setTimeout(r, 2000));
            if (done) break;
            let s; try { s = await api('/nfc/session/' + session); } catch { continue; }
            const d = s.data || {};
            const token = d.token || d.card_id || d.card?.token || d.nfc_card?.token || (Array.isArray(d.cards) && d.cards[0]?.token);
            if (token) {
                done = true; ov.remove();
                try { await api('/users/' + encodeURIComponent(u.id) + '/nfc', { method: 'POST', body: { token } }); showStatus('Karte zugewiesen ✓', 'ok'); }
                catch (e) { showStatus('Zuweisen fehlgeschlagen: ' + e.message, 'err'); }
                m.remove(); loadUsers();
                return;
            }
        }
        if (!done) { done = true; ov.remove(); try { await api('/nfc/session/' + session, { method: 'DELETE' }); } catch {} showStatus('Keine Karte erkannt (Timeout)', 'err'); }
    }
    async function renderUserPolicies(m, u) {
        const el = m.querySelector('#eu-policies');
        try {
            if (!allPolicies.length) { const r = await api('/policies'); allPolicies = r.policies || []; }
            const cur = await api('/users/' + encodeURIComponent(u.id) + '/policies');
            const curIds = new Set((cur.policies || []).map(p => p.id));
            if (!allPolicies.length) { el.innerHTML = '<span class="text-gray-400">Keine Policies definiert</span>'; return; }
            el.innerHTML = allPolicies.map(p => `<label class="flex items-center gap-2">
                <input type="checkbox" data-pid="${esc(p.id)}" ${curIds.has(p.id) ? 'checked' : ''} onchange="saveUserPolicies('${esc(u.id)}', this)">
                <span>${esc(p.name)}</span></label>`).join('');
        } catch (e) { el.innerHTML = `<span class="text-red-600">${esc(e.message)}</span>`; }
    }
    async function saveUserPolicies(userId, cb) {
        const box = cb.closest('#eu-policies');
        const ids = [...box.querySelectorAll('input[type=checkbox]:checked')].map(c => c.dataset.pid);
        cb.disabled = true;
        try { await api('/users/' + encodeURIComponent(userId) + '/policies', { method: 'PUT', body: { access_policy_ids: ids } }); showStatus('Zugang aktualisiert', 'ok'); }
        catch (e) { showStatus(e.message, 'err'); cb.checked = !cb.checked; }
        finally { cb.disabled = false; }
    }
    async function delUser(id, name) {
        if (!confirm(`Benutzer „${name}" wirklich löschen?`)) return;
        try { await api('/users/' + encodeURIComponent(id), { method: 'DELETE' }); showStatus('Gelöscht', 'ok'); loadUsers(); }
        catch (e) { showStatus(e.message, 'err'); }
    }

    // ─────────────────────────── Besucher ───────────────────────────
    async function loadVisitors() {
        const p = $('#panel-visitors');
        p.innerHTML = '<div class="text-gray-400 text-sm">Lade Besucher…</div>';
        try {
            const { visitors } = await api('/visitors');
            const rows = (visitors || []).map(v => `<tr class="border-b hover:bg-gray-50">
                <td class="px-3 py-2 font-medium">${esc(v.full_name || `${v.first_name || ''} ${v.last_name || ''}`.trim())}</td>
                <td class="px-3 py-2 text-gray-500">${fmtTime(v.start_time)} – ${fmtTime(v.end_time)}</td>
                <td class="px-3 py-2">${esc(v.status || '')}</td>
                <td class="px-3 py-2 text-right"><button onclick="delVisitor('${esc(v.id)}')" class="text-red-600 hover:underline text-xs">Löschen</button></td></tr>`).join('');
            p.innerHTML = `<div class="flex items-center mb-3"><span class="text-xs text-gray-400">${(visitors || []).length} Besucher-Pässe</span>
                <button onclick="visitorForm()" class="ml-auto text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-3 py-1.5">+ Neu</button></div>
                <div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm">
                <thead><tr class="text-left text-xs text-gray-400 border-b"><th class="px-3 py-2">Name</th><th class="px-3 py-2">Zeitraum</th><th class="px-3 py-2">Status</th><th></th></tr></thead>
                <tbody>${rows || '<tr><td colspan="4" class="px-3 py-4 text-gray-400">Keine Besucher-Pässe.</td></tr>'}</tbody></table></div>`;
        } catch (e) { p.innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
    }
    function visitorForm() {
        const now = new Date(); const later = new Date(Date.now() + 4 * 3600e3);
        const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        openModal('Neuer Besucher-Pass', `
            <input id="v-first" placeholder="Vorname *" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm">
            <input id="v-last" placeholder="Nachname" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm">
            <label class="text-xs text-gray-500">Von</label><input id="v-start" type="datetime-local" value="${iso(now)}" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm">
            <label class="text-xs text-gray-500">Bis</label><input id="v-end" type="datetime-local" value="${iso(later)}" class="w-full border rounded-lg px-3 py-2 text-sm">
        `, async () => {
            const first = $('#v-first').value.trim();
            if (!first) { showStatus('Vorname erforderlich', 'err'); return false; }
            try {
                await api('/visitors', { method: 'POST', body: {
                    first_name: first, last_name: $('#v-last').value.trim(),
                    start_time: Math.floor(new Date($('#v-start').value).getTime() / 1000),
                    end_time: Math.floor(new Date($('#v-end').value).getTime() / 1000),
                } });
                showStatus('Besucher-Pass erstellt', 'ok'); loadVisitors();
            } catch (e) { showStatus(e.message, 'err'); return false; }
        });
    }
    async function delVisitor(id) {
        if (!confirm('Besucher-Pass löschen?')) return;
        try { await api('/visitors/' + encodeURIComponent(id), { method: 'DELETE' }); showStatus('Gelöscht', 'ok'); loadVisitors(); }
        catch (e) { showStatus(e.message, 'err'); }
    }

    // ─────────────────────────── Einstellungen ───────────────────────────
    async function loadSettings() {
        const p = $('#panel-settings');
        p.innerHTML = '<div class="text-gray-400 text-sm">Lade…</div>';
        try {
            const s = await api('/settings');
            p.innerHTML = `<div class="bg-white rounded-xl border p-5 max-w-lg">
                <h2 class="font-semibold mb-3">UniFi-Access-Verbindung</h2>
                <label class="text-xs text-gray-500">Controller-Host (IP:Port)</label>
                <input id="s-host" value="${esc(s.host || '')}" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
                <label class="text-xs text-gray-500">API-Token ${s.token_set ? '<span class="text-green-600">(gesetzt — leer lassen = unverändert)</span>' : '<span class="text-red-600">(nicht gesetzt)</span>'}</label>
                <input id="s-token" type="password" placeholder="${s.token_set ? '••••••••' : 'Token einfügen'}" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
                <label class="flex items-center gap-2 text-sm mb-4"><input id="s-enabled" type="checkbox" ${s.enabled ? 'checked' : ''}> Aktiviert (Türsteuerung)</label>
                <button onclick="saveSettings()" class="bg-red-700 hover:bg-red-800 text-white text-sm font-medium rounded-lg px-4 py-2">Speichern</button>
                <p class="text-xs text-gray-400 mt-3">Tipp: Token in UniFi Access erstellen (Einstellungen → API). Zum Rotieren neuen Token hier eintragen.</p>
            </div>`;
        } catch (e) { p.innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
    }
    async function saveSettings() {
        const body = { host: $('#s-host').value.trim(), enabled: $('#s-enabled').checked };
        const tok = $('#s-token').value.trim(); if (tok) body.token = tok;
        try { await api('/settings', { method: 'PUT', body }); showStatus('Gespeichert', 'ok'); loadSettings(); }
        catch (e) { showStatus(e.message, 'err'); }
    }

    // ─────────────────────────── Modal ───────────────────────────
    function openModal(title, inner, onSave) {
        const m = document.createElement('div');
        m.className = 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4';
        m.innerHTML = `<div class="bg-white rounded-xl p-5 w-full max-w-sm shadow-xl">
            <h3 class="font-semibold mb-3">${esc(title)}</h3><div id="modal-body">${inner}</div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="m-cancel" class="text-sm text-gray-500 px-3 py-2">Abbrechen</button>
                <button id="m-save" class="text-sm bg-red-700 hover:bg-red-800 text-white rounded-lg px-4 py-2">Speichern</button>
            </div></div>`;
        document.body.appendChild(m);
        const close = () => m.remove();
        m.querySelector('#m-cancel').onclick = close;
        m.onclick = (e) => { if (e.target === m) close(); };
        m.querySelector('#m-save').onclick = async () => { const r = await onSave(); if (r !== false) close(); };
    }

    // ─────────────────────────── Init ───────────────────────────
    AuthentikAuth.init({
        requireAuth: true, requireAdmin: true,
        onLogin(user) {
            $('#gate').classList.add('hidden');
            $('#app').classList.remove('hidden');
            $('#user-name').textContent = user.name || user.email || '';
            document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
            switchTab('doors');
        },
        onLogout(reason) {
            if (reason === 'no-admin') {
                $('#gate').innerHTML = '<div class="bg-white rounded-xl border p-6"><div class="text-lg font-semibold mb-1">Kein Zugriff</div><div class="text-gray-500 text-sm">Die Zutrittsverwaltung ist nur für Technik/Präsident.</div></div>';
            }
        }
    });
    </script>
</body>
</html>
