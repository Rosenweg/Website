<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STWEG 7 - STWEG-Kooperation Rosenweg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/authentik-auth.js?v=2"></script>
    <script src="/js/site-config.js"></script>
    <script src="/js/stweg-kontakte.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
    <script src="/js/nav.js?v=3"></script>
    <script>RosenwegNav.init({ active: 'stweg7' });</script>

    <!-- Header -->
    <section class="bg-gradient-to-r from-blue-600 to-blue-800 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl font-bold mb-2">STWEG 7</h1>
                    <p id="stweg-adresse" class="text-xl opacity-90 mb-1"></p>
                    <script>
                    SiteConfig.load().then(() => {
                        const s = SiteConfig.getStweg(7);
                        if (s) {
                            document.getElementById('stweg-adresse').textContent = s.adressen + ', 4303 Kaiseraugst';
                            document.title = s.name + ' - ' + s.adressen + ' - STWEG-Kooperation Rosenweg';
                        }
                    });
                    </script>
                </div>
                <div class="hidden md:block">
                    <div class="bg-white bg-opacity-20 rounded-lg p-4 text-center">
                        <div class="text-5xl font-bold">7</div>
                        <div class="text-sm uppercase tracking-wide">STWEG</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Verwaltung & Kontakte -->
    <section class="py-12 bg-gray-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Verwaltung & Kontakte</h2>

            <div class="grid md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow-md" id="hausverwaltung-card"></div>
                <div class="bg-white p-6 rounded-lg shadow-md" id="ausschuss-card">
                    <div class="animate-pulse">
                        <div class="h-6 bg-gray-200 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
                        <div class="h-4 bg-gray-200 rounded w-2/3"></div>
                    </div>
                </div>
            </div>

            <div id="kontakte-section" class="hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">Kontaktliste</h3>
                    <button onclick="window.print()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition text-sm flex items-center">
                        <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                        </svg>
                        Drucken
                    </button>
                </div>
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded">
                    <p class="text-sm text-gray-700">
                        <strong>Vertraulich:</strong> Diese Kontaktdaten sind ausschliesslich für den internen Gebrauch bestimmt
                        und dürfen nicht an Dritte weitergegeben werden.
                    </p>
                </div>
                <div id="kontakte-list" class="space-y-4"></div>
            </div>

            <div id="kontakte-login" class="hidden text-center py-8">
                <p class="text-gray-600 mb-4">Melden Sie sich an, um die Kontaktliste einzusehen.</p>
                <button id="kontakte-login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Anmelden</button>
            </div>
        </div>
    </section>

    <script>STWEGKontakte.init(7);</script>

    <style>
        @media print {
            nav, footer, button, #kontakte-login, .bg-yellow-50 { display: none; }
            section { break-inside: avoid; }
        }
    </style>

    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-400">
                &copy; 2025 STWEG 7 - Teil der STWEG-Kooperation Rosenweg
            </p>
        </div>
    </footer>
</body>
</html>
