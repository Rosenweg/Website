<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wohnungsverwaltung - STWEG Rosenweg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="/js/authentik-auth.js?v=2"></script>
    <script src="/js/nav.js?v=2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
    <script>RosenwegNav.init({ active: 'wohnungsverwaltung' });</script>

    <!-- Auth Gate -->
    <div id="auth-gate" class="flex-1 flex items-center justify-center">
        <div class="text-center text-gray-500">
            <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p>Wird geladen...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden flex-1">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
                <h1 class="text-2xl font-bold" id="page-title">Wohnungsverwaltung</h1>
                <p class="text-blue-200 text-sm mt-1" id="page-subtitle">Wohnungen, Eigentümer und Bewohner verwalten</p>
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
            <!-- STWEG Selector -->
            <div class="flex flex-wrap items-center gap-3 mb-6">
                <label class="text-sm font-medium text-gray-700">STWEG:</label>
                <div id="stweg-tabs" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Stats Bar -->
            <div id="stats-bar" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                <div class="bg-white rounded-lg border p-3 text-center">
                    <div class="text-2xl font-bold text-gray-800" id="stat-total">0</div>
                    <div class="text-xs text-gray-500">Wohnungen</div>
                </div>
                <div class="bg-white rounded-lg border p-3 text-center">
                    <div class="text-2xl font-bold text-green-600" id="stat-selbst">0</div>
                    <div class="text-xs text-gray-500">Selbstbewohnt</div>
                </div>
                <div class="bg-white rounded-lg border p-3 text-center">
                    <div class="text-2xl font-bold text-blue-600" id="stat-vermietet">0</div>
                    <div class="text-xs text-gray-500">Vermietet</div>
                </div>
                <div class="bg-white rounded-lg border p-3 text-center">
                    <div class="text-2xl font-bold text-yellow-600" id="stat-leer">0</div>
                    <div class="text-xs text-gray-500">Leer</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex justify-between items-center mb-4">
                <div class="relative">
                    <input type="text" id="wohnung-search" placeholder="Suchen..." oninput="filterWohnungen()"
                        class="border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64">
                    <svg class="absolute left-3 top-2.5 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <div class="flex gap-2">
                    <button id="btn-export" onclick="exportXLSX()" class="hidden bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition flex items-center gap-2" title="Excel exportieren">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        Excel
                    </button>
                    <button id="btn-csv" onclick="exportCSV()" class="hidden bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition flex items-center gap-2" title="CSV exportieren">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        CSV
                    </button>
                    <button id="btn-import" onclick="importKontakte()" class="hidden bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition flex items-center gap-2" title="Aus kontakte.json importieren">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        Import
                    </button>
                    <button id="btn-add" onclick="showAddModal()" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Neue Wohnung
                    </button>
                </div>
            </div>

            <!-- Wohnungen Table -->
            <div id="wohnungen-list" class="space-y-2"></div>
            <div id="loading" class="text-center py-12 text-gray-500">
                <svg class="animate-spin h-6 w-6 mx-auto mb-2 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Wohnungen werden geladen...
            </div>
            <div id="no-data" class="hidden text-center py-8 text-gray-400">Keine Wohnungen vorhanden.</div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-gray-800 mb-4" id="modal-title">Neue Wohnung</h3>
            <div id="modal-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4"></div>
            <input type="hidden" id="f-id" />

            <!-- Wohnung Details -->
            <div class="space-y-4 mb-6">
                <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Wohnung</h4>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bezeichnung *</label>
                        <input type="text" id="f-bezeichnung" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="z.B. EG.1" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Stockwerk</label>
                        <select id="f-stockwerk" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">--</option>
                            <option>Untergeschoss</option>
                            <option>Erdgeschoss</option>
                            <option>1. Obergeschoss</option>
                            <option>2. Obergeschoss</option>
                            <option>3. Obergeschoss</option>
                            <option>Dachgeschoss</option>
                            <option>Sonstiges</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Zimmer</label>
                        <input type="text" id="f-zimmer" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="3.5" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fläche m²</label>
                        <input type="number" id="f-flaeche" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="75" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Typ</label>
                        <select id="f-typ" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option>Wohnung</option>
                            <option>Hobbyraum</option>
                            <option>Tiefgarage-Platz</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Besonderheiten</label>
                    <input type="text" id="f-besonderheiten" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="z.B. Garten, Balkon" />
                </div>
            </div>

            <!-- Status -->
            <div class="space-y-3 mb-6">
                <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Bewohnung</h4>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="bewohnt" value="eigentuemer" checked class="text-blue-600" />
                        <span class="text-sm">Selbstbewohnt</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="bewohnt" value="mieter" class="text-blue-600" />
                        <span class="text-sm">Vermietet</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="bewohnt" value="leer" class="text-blue-600" />
                        <span class="text-sm">Leer</span>
                    </label>
                </div>
            </div>

            <!-- Dynamic Kontakte -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-3">
                    <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Kontakte</h4>
                    <button type="button" onclick="addKontakt()" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1 rounded-lg font-medium transition">+ Kontakt hinzufügen</button>
                </div>
                <div id="kontakte-list" class="space-y-3"></div>
                <div id="no-kontakte" class="text-center py-4 text-gray-400 text-sm">Noch keine Kontakte. Klicke "Kontakt hinzufügen" um loszulegen.</div>
            </div>

            <!-- Notizen -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Notizen</label>
                <textarea id="f-notizen" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Actions -->
            <div class="flex justify-between items-center">
                <button id="btn-delete" onclick="deleteWohnung()" class="hidden text-red-600 hover:text-red-800 text-sm font-medium">Löschen</button>
                <div class="flex gap-3 ml-auto">
                    <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800 text-sm">Abbrechen</button>
                    <button onclick="saveWohnung()" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const esc = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';

        const ROLLEN = [
            { value: 'eigentuemer', label: 'Eigentümer', color: 'green' },
            { value: 'mieter', label: 'Mieter', color: 'blue' },
            { value: 'verwalter', label: 'Verwalter', color: 'purple' },
            { value: 'bewohner', label: 'Bewohner', color: 'teal' },
            { value: 'sonstige', label: 'Sonstige', color: 'gray' },
        ];

        let allWohnungen = [];
        let stwegList = [];
        let currentStweg = null;
        let canWrite = false;
        let currentUser = null;
        let kontaktCounter = 0;

        // ── Auth Init ──
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await AuthentikAuth.init({ requireAuth: false });

            if (!user) {
                document.getElementById('auth-gate').innerHTML = `
                    <div class="text-center">
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">Anmeldung erforderlich</h2>
                        <div id="login-container"></div>
                    </div>`;
                AuthentikAuth.createLoginButton('login-container');
                return;
            }

            currentUser = user;
            const access = AuthentikAuth.getPermission('wohnungsverwaltung');
            if (access === 'none') {
                document.getElementById('auth-gate').innerHTML = `
                    <div class="text-center">
                        <svg class="h-12 w-12 mx-auto mb-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-lg font-medium text-gray-700">Keine Berechtigung</p>
                    </div>`;
                return;
            }

            canWrite = access === 'write';
            const groups = user.groups || [];
            const isTechnik = groups.some(g => { const gl = g.toLowerCase(); return gl === 'technik' || gl === 'präsident' || gl === 'praesident'; });

            try {
                const configRes = await fetch('/site-config.json');
                const config = await configRes.json();
                stwegList = config.stwegen || [];
            } catch { stwegList = []; }

            const accessibleStwegs = [];
            for (const s of stwegList) {
                if (isTechnik) { accessibleStwegs.push(s); continue; }
                const sGroups = s.groups ? Object.values(s.groups).map(g => g.toLowerCase()) : [];
                if (groups.some(g => sGroups.includes(g.toLowerCase()))) accessibleStwegs.push(s);
            }

            if (accessibleStwegs.length === 0) {
                document.getElementById('auth-gate').innerHTML = `
                    <div class="text-center"><p class="text-lg font-medium text-gray-700">Keine STWEGs zugewiesen</p></div>`;
                return;
            }

            const tabsEl = document.getElementById('stweg-tabs');
            tabsEl.innerHTML = accessibleStwegs.map(s => `
                <button onclick="selectStweg(${s.nr})" id="stweg-tab-${s.nr}"
                    class="px-3 py-1.5 rounded-lg text-sm font-medium border transition
                           ${s.nr === accessibleStwegs[0].nr ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:border-blue-400'}">
                    ${esc(s.name)} <span class="text-xs opacity-75">${esc(s.adressen)}</span>
                </button>
            `).join('');

            document.getElementById('btn-export').classList.remove('hidden');
            document.getElementById('btn-csv').classList.remove('hidden');
            if (canWrite) {
                document.getElementById('btn-add').classList.remove('hidden');
                document.getElementById('btn-import').classList.remove('hidden');
            }

            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            selectStweg(accessibleStwegs[0].nr);
        });

        // ── STWEG Selection ──
        async function selectStweg(nr) {
            currentStweg = nr;
            document.querySelectorAll('#stweg-tabs button').forEach(btn => {
                const isActive = btn.id === `stweg-tab-${nr}`;
                btn.className = `px-3 py-1.5 rounded-lg text-sm font-medium border transition ${
                    isActive ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:border-blue-400'}`;
            });
            const info = stwegList.find(s => s.nr === nr);
            document.getElementById('page-subtitle').textContent = info ? `${info.name} - ${info.adressen}` : `STWEG ${nr}`;
            await loadWohnungen();
        }

        // ── Data Loading ──
        async function loadWohnungen() {
            const loading = document.getElementById('loading');
            const noData = document.getElementById('no-data');
            loading.classList.remove('hidden');
            noData.classList.add('hidden');
            document.getElementById('wohnungen-list').innerHTML = '';

            try {
                const [wRes, sRes] = await Promise.all([
                    AuthentikAuth.apiFetch(`/api/wohnungen/${currentStweg}`),
                    AuthentikAuth.apiFetch(`/api/wohnungen/${currentStweg}/stats`),
                ]);
                const wData = await wRes.json();
                const stats = await sRes.json();
                allWohnungen = wData.wohnungen || [];

                document.getElementById('stat-total').textContent = stats.total || 0;
                document.getElementById('stat-selbst').textContent = stats.selbstbewohnt || 0;
                document.getElementById('stat-vermietet').textContent = stats.vermietet || 0;
                document.getElementById('stat-leer').textContent = stats.leer || 0;
                document.getElementById('stats-bar').classList.remove('hidden');
            } catch (err) {
                console.error('Error loading wohnungen:', err);
                allWohnungen = [];
            }

            loading.classList.add('hidden');
            renderWohnungen();
        }

        // ── Helper: get kontakte by rolle ──
        function getKontakte(w, rolle) {
            return (w.kontakte || []).filter(k => k.rolle === rolle);
        }

        function getKontaktName(w, rolle) {
            const k = getKontakte(w, rolle);
            return k.length > 0 ? k.map(c => c.name).filter(Boolean).join(', ') : '';
        }

        // ── Rendering ──
        function renderWohnungen() {
            const q = (document.getElementById('wohnung-search')?.value || '').toLowerCase();
            let filtered = allWohnungen;
            if (q) {
                filtered = filtered.filter(w => {
                    const kontakteStr = (w.kontakte || []).map(k => `${k.name || ''} ${k.email || ''}`).join(' ').toLowerCase();
                    return (w.bezeichnung || '').toLowerCase().includes(q) ||
                        (w.stockwerk || '').toLowerCase().includes(q) ||
                        kontakteStr.includes(q);
                });
            }

            const noData = document.getElementById('no-data');
            const list = document.getElementById('wohnungen-list');

            if (filtered.length === 0) {
                list.innerHTML = '';
                noData.classList.remove('hidden');
                return;
            }
            noData.classList.add('hidden');

            list.innerHTML = filtered.map(w => {
                const statusBadge = w.bewohnt_von === 'mieter'
                    ? '<span class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Vermietet</span>'
                    : w.bewohnt_von === 'leer'
                    ? '<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">Leer</span>'
                    : '<span class="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">Selbstbewohnt</span>';

                const typBadge = w.typ && w.typ !== 'Wohnung'
                    ? `<span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">${esc(w.typ)}</span>` : '';

                const eigName = getKontaktName(w, 'eigentuemer');
                const mieterName = getKontaktName(w, 'mieter');
                const verwalterName = getKontaktName(w, 'verwalter');
                const details = [w.zimmer ? `${w.zimmer} Zi.` : '', w.flaeche_m2 ? `${w.flaeche_m2} m²` : ''].filter(Boolean).join(', ');

                return `
                <div class="bg-white rounded-lg border p-4 hover:shadow-sm transition cursor-pointer" onclick="editWohnung(${w.id})">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="bg-blue-50 rounded-lg w-12 h-12 flex items-center justify-center text-blue-600 font-bold text-sm flex-shrink-0">
                                ${esc(w.bezeichnung)}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-medium text-gray-900">${esc(eigName || 'Kein Eigentümer')}</span>
                                    ${statusBadge} ${typBadge}
                                </div>
                                <div class="text-sm text-gray-500 flex items-center gap-3 mt-0.5">
                                    ${w.stockwerk ? `<span>${esc(w.stockwerk)}</span>` : ''}
                                    ${details ? `<span>${details}</span>` : ''}
                                </div>
                                ${mieterName ? `<div class="text-sm text-gray-600 mt-0.5"><span class="text-gray-400">Mieter:</span> ${esc(mieterName)}</div>` : ''}
                                ${verwalterName ? `<div class="text-sm text-gray-600 mt-0.5"><span class="text-gray-400">Verwalter:</span> ${esc(verwalterName)}</div>` : ''}
                            </div>
                        </div>
                        ${canWrite ? `
                        <div class="flex items-center gap-1 ml-2 flex-shrink-0">
                            <button onclick="event.stopPropagation(); editWohnung(${w.id})" class="p-2 text-gray-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 transition" title="Bearbeiten">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function filterWohnungen() { renderWohnungen(); }

        // ── Kontakt Card ──
        function renderKontaktCard(kontakt = {}) {
            const id = `kontakt-${kontaktCounter++}`;
            const rolleOptions = ROLLEN.map(r =>
                `<option value="${r.value}" ${kontakt.rolle === r.value ? 'selected' : ''}>${r.label}</option>`
            ).join('');

            const rolleInfo = ROLLEN.find(r => r.value === (kontakt.rolle || 'eigentuemer')) || ROLLEN[0];
            const colorMap = { green: 'border-green-300 bg-green-50', blue: 'border-blue-300 bg-blue-50', purple: 'border-purple-300 bg-purple-50', teal: 'border-teal-300 bg-teal-50', gray: 'border-gray-300 bg-gray-50' };

            return `
            <div id="${id}" class="border rounded-lg p-3 ${colorMap[rolleInfo.color] || colorMap.gray} kontakt-card">
                <div class="flex items-center justify-between mb-2">
                    <select onchange="updateKontaktColor(this)" class="text-sm font-medium border rounded px-2 py-1 bg-white kontakt-rolle">
                        ${rolleOptions}
                    </select>
                    <button type="button" onclick="removeKontakt('${id}')" class="text-red-400 hover:text-red-600 p-1" title="Entfernen">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="space-y-2">
                    <input type="text" value="${esc(kontakt.name || '')}" placeholder="Name" class="w-full px-3 py-1.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 kontakt-name" />
                    <div class="grid grid-cols-2 gap-2">
                        <input type="email" value="${esc(kontakt.email || '')}" placeholder="E-Mail" class="w-full px-3 py-1.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 kontakt-email" />
                        <input type="text" value="${esc(kontakt.telefon || '')}" placeholder="Telefon" class="w-full px-3 py-1.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 kontakt-telefon" />
                    </div>
                    <input type="text" value="${esc(kontakt.adresse || '')}" placeholder="Adresse (Strasse, PLZ Ort)" class="w-full px-3 py-1.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 kontakt-adresse" />
                </div>
            </div>`;
        }

        function addKontakt(kontakt = {}) {
            const list = document.getElementById('kontakte-list');
            list.insertAdjacentHTML('beforeend', renderKontaktCard(kontakt));
            document.getElementById('no-kontakte').classList.add('hidden');
        }

        function removeKontakt(id) {
            document.getElementById(id)?.remove();
            const list = document.getElementById('kontakte-list');
            if (list.children.length === 0) {
                document.getElementById('no-kontakte').classList.remove('hidden');
            }
        }

        function updateKontaktColor(selectEl) {
            const card = selectEl.closest('.kontakt-card');
            const rolle = selectEl.value;
            const info = ROLLEN.find(r => r.value === rolle) || ROLLEN[4];
            const colorMap = { green: 'border-green-300 bg-green-50', blue: 'border-blue-300 bg-blue-50', purple: 'border-purple-300 bg-purple-50', teal: 'border-teal-300 bg-teal-50', gray: 'border-gray-300 bg-gray-50' };
            // Remove all color classes
            Object.values(colorMap).forEach(cls => cls.split(' ').forEach(c => card.classList.remove(c)));
            // Add new color
            (colorMap[info.color] || colorMap.gray).split(' ').forEach(c => card.classList.add(c));
        }

        function collectKontakte() {
            const cards = document.querySelectorAll('#kontakte-list .kontakt-card');
            const kontakte = [];
            cards.forEach(card => {
                const rolle = card.querySelector('.kontakt-rolle')?.value || 'eigentuemer';
                const name = card.querySelector('.kontakt-name')?.value?.trim() || '';
                const email = card.querySelector('.kontakt-email')?.value?.trim() || '';
                const telefon = card.querySelector('.kontakt-telefon')?.value?.trim() || '';
                const adresse = card.querySelector('.kontakt-adresse')?.value?.trim() || '';
                if (name || email) {
                    kontakte.push({ rolle, name: name || null, email: email || null, telefon: telefon || null, adresse: adresse || null });
                }
            });
            return kontakte;
        }

        // ── Modal ──
        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Neue Wohnung';
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('f-id').value = '';
            document.getElementById('f-bezeichnung').value = '';
            document.getElementById('f-stockwerk').value = '';
            document.getElementById('f-zimmer').value = '';
            document.getElementById('f-flaeche').value = '';
            document.getElementById('f-typ').value = 'Wohnung';
            document.getElementById('f-besonderheiten').value = '';
            document.getElementById('f-notizen').value = '';
            document.querySelector('input[name="bewohnt"][value="eigentuemer"]').checked = true;
            // Start with one empty Eigentümer
            document.getElementById('kontakte-list').innerHTML = '';
            kontaktCounter = 0;
            addKontakt({ rolle: 'eigentuemer' });
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function editWohnung(id) {
            const w = allWohnungen.find(x => x.id === id);
            if (!w) return;
            document.getElementById('modal-title').textContent = `${w.bezeichnung} bearbeiten`;
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('f-id').value = w.id;
            document.getElementById('f-bezeichnung').value = w.bezeichnung || '';
            document.getElementById('f-stockwerk').value = w.stockwerk || '';
            document.getElementById('f-zimmer').value = w.zimmer || '';
            document.getElementById('f-flaeche').value = w.flaeche_m2 || '';
            document.getElementById('f-typ').value = w.typ || 'Wohnung';
            document.getElementById('f-besonderheiten').value = w.besonderheiten || '';
            document.getElementById('f-notizen').value = w.notizen || '';
            const bewohnt = w.bewohnt_von || 'eigentuemer';
            const radio = document.querySelector(`input[name="bewohnt"][value="${bewohnt}"]`);
            if (radio) radio.checked = true;

            // Load kontakte
            document.getElementById('kontakte-list').innerHTML = '';
            kontaktCounter = 0;
            const kontakte = w.kontakte || [];
            if (kontakte.length === 0) {
                addKontakt({ rolle: 'eigentuemer' });
            } else {
                kontakte.forEach(k => addKontakt(k));
            }

            if (canWrite) document.getElementById('btn-delete').classList.remove('hidden');
            else document.getElementById('btn-delete').classList.add('hidden');

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        // ── Save ──
        async function saveWohnung() {
            const id = document.getElementById('f-id').value;
            const bezeichnung = document.getElementById('f-bezeichnung').value.trim();
            if (!bezeichnung) {
                showError('Bezeichnung ist erforderlich');
                return;
            }

            const body = {
                bezeichnung,
                stockwerk: document.getElementById('f-stockwerk').value,
                zimmer: document.getElementById('f-zimmer').value,
                flaeche_m2: parseFloat(document.getElementById('f-flaeche').value) || null,
                typ: document.getElementById('f-typ').value,
                besonderheiten: document.getElementById('f-besonderheiten').value,
                bewohnt_von: document.querySelector('input[name="bewohnt"]:checked')?.value || 'eigentuemer',
                notizen: document.getElementById('f-notizen').value || null,
                kontakte: collectKontakte(),
            };

            try {
                const url = id ? `/api/wohnungen/${currentStweg}/${id}` : `/api/wohnungen/${currentStweg}`;
                const method = id ? 'PUT' : 'POST';
                const res = await AuthentikAuth.apiFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Speichern fehlgeschlagen');
                }
                closeModal();
                await loadWohnungen();
            } catch (err) {
                showError(err.message);
            }
        }

        // ── Delete ──
        async function deleteWohnung() {
            const id = document.getElementById('f-id').value;
            if (!id || !confirm('Wohnung wirklich löschen?')) return;
            try {
                const res = await AuthentikAuth.apiFetch(`/api/wohnungen/${currentStweg}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Löschen fehlgeschlagen');
                closeModal();
                await loadWohnungen();
            } catch (err) {
                showError(err.message);
            }
        }

        // ── Import ──
        async function importKontakte() {
            if (!confirm(`Kontakte-Daten für STWEG ${currentStweg} importieren? Vorhandene Daten werden aktualisiert.`)) return;
            try {
                const path = `/stweg${currentStweg}/data/kontakte.json`;
                const configRes = await fetch(path);
                if (!configRes.ok) throw new Error(`kontakte.json nicht gefunden unter ${path}`);
                const data = await configRes.json();

                const res = await AuthentikAuth.apiFetch(`/api/wohnungen/${currentStweg}/import`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Import fehlgeschlagen');
                }
                const result = await res.json();
                alert(`${result.imported} Wohnungen importiert.`);
                await loadWohnungen();
            } catch (err) {
                alert('Import-Fehler: ' + err.message);
            }
        }

        function showError(msg) {
            const el = document.getElementById('modal-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        // ── Excel Export ──
        function exportXLSX() {
            if (!allWohnungen.length) return alert('Keine Daten zum Exportieren.');
            const stweg = stwegList.find(s => s.nr === currentStweg);
            const stwegName = stweg ? stweg.name : `STWEG ${currentStweg}`;

            // Build rows - one row per kontakt, wohnung info repeated
            const rows = [];
            for (const w of allWohnungen) {
                const kontakte = w.kontakte || [];
                if (kontakte.length === 0) {
                    rows.push({
                        'Bezeichnung': w.bezeichnung,
                        'Stockwerk': w.stockwerk || '',
                        'Zimmer': w.zimmer || '',
                        'Fläche m²': w.flaeche_m2 || '',
                        'Typ': w.typ || '',
                        'Bewohnung': w.bewohnt_von === 'mieter' ? 'Vermietet' : w.bewohnt_von === 'leer' ? 'Leer' : 'Selbstbewohnt',
                        'Rolle': '',
                        'Name': '',
                        'E-Mail': '',
                        'Telefon': '',
                        'Adresse': '',
                        'Notizen': w.notizen || '',
                    });
                } else {
                    kontakte.forEach((k, i) => {
                        const rolleLabel = ROLLEN.find(r => r.value === k.rolle)?.label || k.rolle;
                        rows.push({
                            'Bezeichnung': i === 0 ? w.bezeichnung : '',
                            'Stockwerk': i === 0 ? (w.stockwerk || '') : '',
                            'Zimmer': i === 0 ? (w.zimmer || '') : '',
                            'Fläche m²': i === 0 ? (w.flaeche_m2 || '') : '',
                            'Typ': i === 0 ? (w.typ || '') : '',
                            'Bewohnung': i === 0 ? (w.bewohnt_von === 'mieter' ? 'Vermietet' : w.bewohnt_von === 'leer' ? 'Leer' : 'Selbstbewohnt') : '',
                            'Rolle': rolleLabel,
                            'Name': k.name || '',
                            'E-Mail': k.email || '',
                            'Telefon': k.telefon || '',
                            'Adresse': k.adresse || '',
                            'Notizen': i === 0 ? (w.notizen || '') : '',
                        });
                    });
                }
            }

            const ws = XLSX.utils.json_to_sheet(rows);
            // Auto-width columns
            const colWidths = Object.keys(rows[0] || {}).map(key => {
                const maxLen = Math.max(key.length, ...rows.map(r => String(r[key] || '').length));
                return { wch: Math.min(maxLen + 2, 40) };
            });
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, stwegName);
            XLSX.writeFile(wb, `Wohnungen_${stwegName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // ── CSV Export ──
        function exportCSV() {
            if (!allWohnungen.length) return alert('Keine Daten zum Exportieren.');
            const stweg = stwegList.find(s => s.nr === currentStweg);
            const stwegName = stweg ? stweg.name : `STWEG ${currentStweg}`;
            const headers = ['Bezeichnung','Stockwerk','Zimmer','Fläche m²','Typ','Bewohnung','Rolle','Name','E-Mail','Telefon','Adresse','Notizen'];
            const csvEsc = v => { const s = String(v ?? ''); return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s; };
            const rows = [headers.map(csvEsc).join(',')];
            for (const w of allWohnungen) {
                const kontakte = w.kontakte || [];
                const bewohnung = w.bewohnt_von === 'mieter' ? 'Vermietet' : w.bewohnt_von === 'leer' ? 'Leer' : 'Selbstbewohnt';
                if (kontakte.length === 0) {
                    rows.push([w.bezeichnung, w.stockwerk||'', w.zimmer||'', w.flaeche_m2||'', w.typ||'', bewohnung, '', '', '', '', '', w.notizen||''].map(csvEsc).join(','));
                } else {
                    kontakte.forEach((k, i) => {
                        const rolleLabel = ROLLEN.find(r => r.value === k.rolle)?.label || k.rolle;
                        rows.push([
                            i === 0 ? w.bezeichnung : '', i === 0 ? (w.stockwerk||'') : '', i === 0 ? (w.zimmer||'') : '',
                            i === 0 ? (w.flaeche_m2||'') : '', i === 0 ? (w.typ||'') : '', i === 0 ? bewohnung : '',
                            rolleLabel, k.name||'', k.email||'', k.telefon||'', k.adresse||'', i === 0 ? (w.notizen||'') : ''
                        ].map(csvEsc).join(','));
                    });
                }
            }
            const bom = '\uFEFF';
            const blob = new Blob([bom + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Wohnungen_${stwegName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
