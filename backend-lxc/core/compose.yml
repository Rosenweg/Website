services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rosenweg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rosenweg
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosenweg"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    image: ghcr.io/rosenweg/rosenweg-api:latest
    env_file: .env
    environment:
      TECHNIK_WA_GROUP_ID: 120363407257445046@g.us
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rosenweg
      DB_USER: rosenweg
      SMTP_HOST: mail-eu.smtp2go.com
      SMTP_PORT: "2525"
      MAIL_FROM: "noreply@rosenweg4303.ch"
      PORT: "3000"
      AUTHENTIK_URL: "http://100.64.2.37:9000"
      AUTHENTIK_EXTERNAL_URL: "https://authentik.rosenweg4303.ch"
      SITE_URL: "https://www.rosenweg4303.ch"
      # ACHTUNG (Sicherheitspruefung 17.11.2026, I-10/L-8): schaltet die Zertifikats-
      # pruefung fuer ALLE ausgehenden https-Verbindungen der API ab (SMTP, Authentik,
      # Cloudflare, GitHub …). Noch noetig fuer UniFi/Mailcow/PVE mit eigenen Zertifikaten.
      # Ziel: deren CA-Kette als Datei einbinden (NODE_EXTRA_CA_CERTS=/certs/rosenweg-ca.pem
      # + Volume) und erst dann diese Zeile entfernen.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      ENERGY_DB_HOST: "100.64.2.53"
      ENERGY_DB_PORT: "5432"
      ENERGY_DB_NAME: energy
      ENERGY_DB_USER: energy
      ENERGY_COLLECTOR_URL: "http://100.64.2.53:3001"
      # ENERGY_ADMIN_API_KEY (Admin-Token fuer den Collector) kommt aus .env
      UDPXY_BASE: "http://100.64.9.24:4022"
      UDPXY_HOST: "http://100.64.9.24:4022"
      PVE_API_URL: "https://100.64.2.20:8006"
      DOCS_PATH: /documents
      WG_CONTROL_URL: "http://100.64.2.34:3001"
      NOC_PUBLIC_OPEN: "1"
      JOURNAL_URL: "https://100.64.2.52:19532"
      # Sicherungen (routes/sicherungen.js, Seite sicherungen.html). Geheim und
      # deshalb nur in .env: PBS_AUDIT_TOKEN, PBS_PC_TOKEN. Nicht geheim, aber
      # je Anlage: PBS_FINGERPRINT, PXE_VORMERK_ZIEL (ebenfalls .env).
      PBS_URL: "https://100.64.2.23:8007"
      PBS_DATASTORE: storage
      PBS_PC_REPO: "sicherung@pbs!pc@100.64.2.23:storage"
      PBS_PC_NS: Rosenweg9/pc
      PBS_ERWARTUNG: "Rosenweg9/pc=0,*=36"
      # Chromecasts als Anzeige (docs/cast.md). CAST_APP_ID: App-ID des eigenen
      # Empfängers aus der Google Cast Developer Console, kein Geheimnis; leer =
      # Übergang über den öffentlichen DashCast-Empfänger.
      # CAST_APP_ID: "XXXXXXXX"   (hier oder in .env — hier gesetzt schlüge es .env)
      CAST_WAECHTER_SEKUNDEN: "45"
      CAST_FREMD_MINUTEN: "20"
    ports: ["3000:3000"]
    volumes:
      - /mnt/documents:/documents
      # Stations-CA fürs Journal: die API stellt damit Client-Zertifikate aus
      # (POST /api/stations/:id/journal-zertifikat). Siehe journal-remote/README.md.
      - /opt/rosenweg-core/journal-tls/ca.key:/journal-tls/ca.key:ro
      - /opt/rosenweg-core/journal-tls/ca.crt:/journal-tls/ca.crt:ro
      # Sicherungen: id_ed25519 (Wartungsschluessel fuers Sicherungs-System),
      # pxe_vormerkung (+ known_hosts_pxe) fuer CT 135. Nur root lesbar (0600).
      - /opt/rosenweg-core/sicherung:/sicherung:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  doc-converter:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=120s"]
    restart: unless-stopped
  shelly-emulator:
    image: ghcr.io/rosenweg/shelly-emulator:latest
    environment:
      BACKEND_URL: "https://www.rosenweg4303.ch/api/energy/shelly"
      POLL_MS: "10000"
      ENERGY_GROUP: "r9"
      SHELLY_HOSTNAME: "shellypvrosenweg9"
      PORT: "8089"
    ports: ["8089:8089"]
    restart: unless-stopped
  syslog-collector:
    image: ghcr.io/rosenweg/syslog-collector:latest
    environment:
      SYSLOG_PORT: "5514"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rosenweg
      DB_USER: rosenweg
      DB_PASSWORD: ${DB_PASSWORD}
    ports: ["5514:5514/udp", "5514:5514/tcp"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  journal-remote:
    image: ghcr.io/rosenweg/journal-remote:latest
    environment:
      JOURNAL_AUFBEWAHRUNG: "30d"
    ports: ["19532:19532"]
    volumes:
      - journal-remote:/var/log/journal/remote
      - /opt/rosenweg-core/journal-tls/server.key:/tls/server.key:ro
      - /opt/rosenweg-core/journal-tls/server.crt:/tls/server.crt:ro
      - /opt/rosenweg-core/journal-tls/ca.crt:/tls/ca.crt:ro
    restart: unless-stopped
volumes:
  journal-remote:
  pgdata:
