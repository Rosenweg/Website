<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosenweg Anzeige</title>
  <link rel="icon" href="/logo-rosenweg.png">
  <script src="/js/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif; color: #f8fafc; overflow: hidden;
      background: radial-gradient(120% 120% at 50% 0%, #1e293b 0%, #0f172a 55%, #060a14 100%);
      -webkit-user-select: none; user-select: none; cursor: none;
    }
    #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

    /* ===== Ruhezustand ===== */
    .idle { text-align: center; padding: 2vmin; width: 100%; }
    .idle .brand { display: flex; align-items: center; justify-content: center; gap: 1.4vw; margin-bottom: 4vh; opacity: .92; }
    .idle .brand img { height: clamp(38px, 6vh, 82px); filter: drop-shadow(0 3px 10px rgba(0,0,0,.4)); }
    .idle .brand .tt { font-weight: 700; font-size: clamp(1.4rem, 3.4vw, 3rem); line-height: 1; letter-spacing: .01em; }
    .idle .brand .ss { font-size: clamp(.8rem, 1.4vw, 1.3rem); opacity: .7; margin-top: .4vh; }
    .clock-t { font-size: clamp(4rem, 20vw, 20rem); font-weight: 300; line-height: .95; letter-spacing: .01em; font-variant-numeric: tabular-nums; text-shadow: 0 4px 24px rgba(0,0,0,.45); }
    .clock-t .sec { font-size: .42em; font-weight: 300; opacity: .55; vertical-align: baseline; margin-left: .12em; }
    .clock-d { font-size: clamp(1.1rem, 3.2vw, 3rem); font-weight: 300; opacity: .78; margin-top: 2.5vh; text-transform: capitalize; }

    /* ===== Aushang als A4-Blatt =====
       Jede Ankuendigung sieht aus wie das, was sie ist: ein Blatt am
       Anschlag. Getippt oder als PDF hochgeladen macht keinen Unterschied
       mehr — beides ist ein weisses A4 im Hochformat, in denselben Farben
       wie die Word-Vorlage (siehe documents/vorlagen/gestaltungsrichtlinie.md).

       Auf einem breiten Schirm stehen zwei nebeneinander. Ein A4 ist 1:V2;
       bei 27 Zoll im Querformat bleibt neben einem Blatt so viel Rand, dass
       ein zweites bequem danebenpasst. Wie viele es werden, rechnet das JS
       aus — hier steht nur, wie eines aussieht. */
    .blaetter { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 1.5vmin 2.5vmin 2.5vmin; }
    /* Kopfzeile des Schirms: Wappen links, Uhr rechts. Bei einem PDF traegt das
       Blatt keinen Briefkopf — ohne diese Zeile stuende ein fremder Aushang
       ohne jeden Hinweis darauf da, wer ihn aushaengt. */
    .blaetter .kopfzeile { flex: 0 0 auto; display: flex; align-items: center;
                           justify-content: space-between; margin-bottom: 1vh; }
    .blaetter .marke { display: flex; align-items: center; gap: .7vw; opacity: .92; }
    .blaetter .marke img { height: clamp(24px, 4.4vh, 60px); }
    .blaetter .marke .tt { font-weight: 700; font-size: clamp(.95rem, 2.6vh, 1.9rem); line-height: 1.1; }
    .blaetter .marke .ss { font-size: clamp(.6rem, 1.3vh, .95rem); opacity: .65; }
    .blaetter .reihe { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch;
                       justify-content: center; gap: 2.5vmin; }
    /* Die Ueberschrift sitzt AUF dem Blatt, nicht darueber. Frei darueber
       gestellt bestimmt sie die Spaltenbreite — ein langer Titel schob das
       Blatt daneben aus dem Bild. Auf dem Papier stoert sie niemanden und
       sieht aus wie das, was sie ist: die Zeile ueber dem Aushang. */
    .blatt-titel { flex: 0 0 auto; color: #CC0000; font-weight: 700; text-align: center;
                   padding: .7em 1em; border-bottom: 1px solid #DDDDDD; background: #fff;
                   font-size: clamp(.6rem, 1.9vh, 1.3rem);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* flex:0 0 auto und stretch: die Hoehe gibt die Zeile vor, die Breite folgt
       aus 210:297. Darf das Blatt wachsen, bestimmt der Flex-Algorithmus die
       Breite und ueberfaehrt das Seitenverhaeltnis — aus A4 wurde ein fast
       quadratischer Kasten. Und mit height:100% statt stretch bleibt es klein:
       die Prozentangabe findet keine feste Bezugshoehe und faellt auf den
       Inhalt zurueck (im Test 314x443 statt 687x970). */
    .blatt { flex: 0 0 auto; aspect-ratio: 210 / 297; background: #fff; color: #333;
             border-radius: .8vmin; box-shadow: 0 1.2vmin 3.5vmin rgba(0,0,0,.5);
             overflow: hidden; display: flex; flex-direction: column; }

    /* Getippter Text bekommt den Briefkopf der Vorlage — sonst waere es
       ein weisses Rechteck mit Schrift darin und nicht wiedererkennbar. */
    .blatt-text { padding: 5% 7%; }
    .briefkopf { display: flex; align-items: center; gap: .8em; flex: 0 0 auto;
                 padding-bottom: .6em; border-bottom: 1px solid #DDDDDD; margin-bottom: 1em;
                 font-size: clamp(.6rem, 2.1vh, 1.5rem); }
    .briefkopf img { height: 2.4em; }
    .briefkopf .wm { color: #CC0000; font-weight: 700; font-size: 1.15em; line-height: 1.1; }
    .briefkopf .ort { color: #595959; font-size: .72em; }
    /* KEIN Umbruch mitten im Wort. Das ist nicht nur haesslich, es hebelt auch
       die Groessensuche aus: darf die Schrift jedes Wort zerschneiden, passt
       jede Groesse irgendwie, und der Text wird zu gross. Ohne die Erlaubnis
       begrenzt das laengste Wort die Groesse — genau richtig.
       Silbentrennung darf der Browser, wenn er sie beherrscht (lang="de"). */
    .blatt-text .body { flex: 1 1 auto; min-height: 0; width: 100%; display: flex;
                        align-items: center; justify-content: center; overflow: hidden;
                        text-align: center; font-weight: 600; line-height: 1.2;
                        overflow-wrap: normal; word-break: normal; hyphens: auto; }

    /* Ein PDF IST das Blatt: gleiche Seitenverhaeltnisse, also fuellt es die
       Flaeche randlos. 'view=Fit' zeigt die ganze Seite; mit 'FitH' ragte ein
       A4 unten heraus, und vom Aushang war nur der Briefkopf zu sehen.
       'toolbar=0&navpanes=0' nimmt dem Betrachter seine Leisten — auf einer
       Tafel im Treppenhaus braucht niemand einen Druckknopf. */
    .blatt-pdf { padding: 0; }
    .blatt-pdf img { flex: 1 1 auto; min-height: 0; width: 100%; height: 100%;
                     object-fit: contain; background: #fff; display: block; }

    /* Uhr des Schirms, oben rechts. Die Marke traegt das Blatt selbst, sonst
       stuende das Wappen zweimal im Bild. */
    #uhr { text-align: right; font-weight: 300; font-variant-numeric: tabular-nums;
           color: rgba(248,250,252,.92); font-size: clamp(1rem, 3.2vh, 2.2rem); line-height: 1.1; }
    #uhr .dat { display: block; font-size: .42em; opacity: .6; letter-spacing: .04em; }

    /* ===== Notfall (Vollbild rot) ===== */
    body.emergency { background: #000; }
    .emergency-scr { position: fixed; inset: 0; background: linear-gradient(160deg, #b91c1c 0%, #dc2626 55%, #991b1b 100%); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5vmin;
      border: .9vmin solid #fff; box-shadow: inset 0 0 0 .35vmin #7f1d1d; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 .35vmin #7f1d1d, inset 0 0 8vmin rgba(0,0,0,.25); } 50% { box-shadow: inset 0 0 0 .35vmin #fecaca, inset 0 0 14vmin rgba(0,0,0,.1); } }
    .emergency-scr .sym { font-size: clamp(4rem, 13vw, 13rem); line-height: 1; margin-bottom: 3vh; filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
    .emergency-scr .kick { font-size: clamp(1.2rem, 3.4vw, 3rem); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4vh; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
    .emergency-scr .body { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 800; line-height: 1.1; text-shadow: 0 3px 16px rgba(0,0,0,.5); word-break: break-word; overflow-wrap: anywhere; }
    /* inline-block und KEIN max-width: nur so meldet getBoundingClientRect die
       wirkliche Breite des Satzes. Als Block mit max-width:100% ragte ein zu
       langes Wort unsichtbar hinaus, die Suche hielt die Groesse fuer passend,
       und vom Wort fehlte am Ende die Haelfte. */
    .body .fit { display: inline-block; }

    /* Der Text wird per Binaersuche auf die Flaeche gezogen (fitText),
       deshalb braucht es weder Groessenklassen noch Laufschrift. Laufschrift
       gab es frueher fuer lange Meldungen — sie zwingt zum Warten, bis der
       Anfang wiederkommt, und auf einem Blatt gibt es sie ohnehin nicht. */

    /* ===== Verbindungs-/Frische-Indikator (dezent, Ecke) ===== */
    #stat { position: fixed; bottom: 1.6vmin; right: 1.8vmin; display: flex; align-items: center; gap: .6vmin;
      font-size: clamp(.62rem, 1vw, .9rem); color: rgba(255,255,255,.5); z-index: 20; letter-spacing: .02em; }
    #stat .dot { width: 1.15vmin; height: 1.15vmin; min-width: 8px; min-height: 8px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 6px currentColor; color: #fbbf24; transition: color .3s; }
    #stat.ok  .dot { background: #34d399; color: #34d399; }
    #stat.err .dot { background: #f87171; color: #f87171; }
    #stat.off .dot { background: #94a3b8; color: #94a3b8; }
    #stat .lbl { opacity: .8; }
    body.emergency #stat { color: rgba(255,255,255,.7); }

    /* Aktualisiert-vor Zeitstempel */
    #age { position: fixed; bottom: 1.6vmin; left: 1.8vmin; font-size: clamp(.62rem, 1vw, .9rem); color: rgba(255,255,255,.4); z-index: 20; letter-spacing: .02em; }
    body.emergency #age { color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="age"></div>
  <div id="stat" class="off"><span class="dot"></span><span class="lbl" id="stat-t">…</span></div>

  <script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // ===== Zustand =====
  // In welchem Haus hängt diese Anzeige? Kommt aus der Adresse:
  //   display.rosenweg4303.ch?haus=14
  // Die API hängt das selbst an, aus dem Haus der Station beziehungsweise des
  // Anzeigegeräts. Ohne Angabe zeigt die Seite alles — so verhalten sich
  // Tafeln, die es schon gab, unverändert weiter.
  const MEIN_HAUS = (() => {
    const n = parseInt(new URLSearchParams(location.search).get('haus'), 10);
    return Number.isInteger(n) && n > 0 ? n : null;
  })();

  const state = {
    announcement: null, // { text, active, scroll, ts, by }  (alter Einzelkanal)
    announcements: [],  // [{ id, text, pdf, scroll, stwegs, ts, by }]  (neu)
    emergency: null,
    lastHeartbeat: 0,   // ms epoch der letzten Heartbeat-Nachricht
    connOk: false,      // MQTT verbunden?
    connLabel: 'verbinde…',
    connClass: 'off',
    lastTs: 0,          // ts der aktuell gezeigten Meldung (für "aktualisiert vor")
  };

  // Sichtbarer Kanal: emergency hat Vorrang vor announcement.
  //
  // Inhalt ist ein Text ODER ein PDF. Ein Aushang braucht keine Unterschrift —
  // vorher verlangte diese Prüfung einen Text, und eine reine PDF-Ankündigung
  // wäre stumm ignoriert worden.
  const hatInhalt = (d) => !!(d && d.active && ((d.text || '').trim() || (d.pdf || '').trim()));

  // Was diese Anzeige zeigen darf: alles ohne Hausangabe, plus was für ihr
  // eigenes Haus bestimmt ist. Eine Anzeige ohne ?haus zeigt alles.
  function meineAnkuendigungen() {
    return (state.announcements || []).filter(a =>
      (a.text || '').trim() || (a.pdf || '').trim()
    ).filter(a =>
      !MEIN_HAUS || !a.haeuser || !a.haeuser.length || a.haeuser.includes(MEIN_HAUS)
    );
  }

  // Durchblättern: alle ROTATION_MS eine weiter. Der Index zählt einfach hoch
  // und wird beim Zugriff auf die Länge bezogen — so bleibt er gültig, auch
  // wenn zwischendurch eine Meldung dazukommt oder verschwindet.
  const ROTATION_MS = 15000;
  let blaetterIndex = 0;
  let zuletztGezeigt = 1;
  setInterval(() => {
    // Um so viele weiterblättern, wie gerade nebeneinander stehen — sonst
    // käme auf einem breiten Schirm jede Meldung zweimal vorbei, einmal
    // links und einmal rechts.
    if (meineAnkuendigungen().length > zuletztGezeigt) {
      blaetterIndex += zuletztGezeigt;
      render();
    }
  }, ROTATION_MS);

  // Wie viele A4-Blätter nebeneinander passen.
  //
  // Ein A4 ist 1:√2. Bei 1920×1080 ist ein Blatt rund 720 px breit, zwei also
  // 1440 plus Abstand — das geht bequem. Auf einem hochkant hängenden Tablet
  // passt genau eines. Gerechnet statt geraten, damit es auf jedem Gerät
  // stimmt, das noch dazukommt.
  function blaetterProSchirm() {
    const hoehe = window.innerHeight * 0.95;
    const breite = hoehe * (210 / 297);
    const abstand = window.innerWidth * 0.025;
    return (breite * 2 + abstand) <= window.innerWidth * 0.97 ? 2 : 1;
  }

  function activeChannel() {
    if (hatInhalt(state.emergency)) return { kind: 'emergency', d: state.emergency };
    const liste = meineAnkuendigungen();
    if (liste.length) {
      const n = Math.min(blaetterProSchirm(), liste.length);
      zuletztGezeigt = n;
      const start = ((blaetterIndex % liste.length) + liste.length) % liste.length;
      const auswahl = Array.from({ length: n }, (_, i) => liste[(start + i) % liste.length]);
      return { kind: 'announce', liste: auswahl, von: liste.length };
    }
    // Rückfall auf den alten Einzelkanal — für den Fall, dass die Liste (noch)
    // nicht veröffentlicht ist, etwa direkt nach einem Update der API.
    if (hatInhalt(state.announcement)) {
      zuletztGezeigt = 1;
      return { kind: 'announce', liste: [state.announcement], von: 1 };
    }
    return null;
  }

  // Text so gross wie moeglich, aber IMMER komplett sichtbar: groesste Schriftgroesse
  // per Binaersuche finden, bei der der ganze Text in den verfuegbaren Bereich passt.
  // KEINE Laufschrift mehr (scroll-Flag wird ignoriert).
  function fitText() {
    // Jedes Blatt fuer sich: zwei nebeneinander haben unterschiedlich viel
    // Text, und eine gemeinsame Groesse waere fuer das eine zu klein und fuer
    // das andere zu gross.
    //
    // Gemessen wird der KASTEN, nicht der Satz. Der Satz ist ein Flex-Kind und
    // schrumpft auf die Zeilenbreite — er kann also gar nicht ueberlaufen, und
    // seine Masse sagen nichts darueber, ob der Text noch passt. Der Kasten
    // dagegen hat overflow:hidden, und dort melden scrollWidth/scrollHeight
    // verlaesslich, wie viel Platz der Inhalt wirklich braucht.
    document.querySelectorAll('#screen .fit').forEach((span) => {
      const box = span.parentElement;
      const availW = box.clientWidth, availH = box.clientHeight;
      if (availW < 2 || availH < 2) return;
      let lo = 8, hi = availH;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        span.style.fontSize = mid + 'px';
        if (box.scrollWidth <= availW && box.scrollHeight <= availH) lo = mid; else hi = mid;
      }
      span.style.fontSize = Math.floor(lo) + 'px';
    });
  }

  // Ein einzelnes Blatt.
  //
  // Getippt oder hochgeladen sieht gleich aus, weil beides dasselbe ist: ein
  // Aushang im A4-Hochformat. Beim PDF IST die Seite das Blatt — gleiches
  // Seitenverhaeltnis, also randlos und ohne Verzerrung. Auf der Tafel direkt
  // abgespielt zieht SlideShow eine A4-Seite auf 16:9 breit; darum laeuft ein
  // Aushang ueber diese Seite und nicht als Datei im Geraeteordner.
  function blattHtml(a) {
    const text = (a.text || '').trim();
    const pdf = (a.pdf || '').trim();
    if (pdf) {
      // Als BILD, nicht als PDF. Die Tafeln laufen unter Android, und deren
      // WebView hat keinen PDF-Betrachter: ein <iframe src="...pdf"> wird nicht
      // eingebettet, sondern an die App weitergereicht. SlideShows eigener
      // Betrachter uebernimmt dann den ganzen Schirm und zieht die Seite auf
      // die Breite — am 6. August auf dem Fernseher gemessen: von Rand zu Rand
      // weiss, ohne Kopfzeile, vom Aushang nur das obere Drittel.
      //
      // Die API rechnet die erste Seite in ein PNG (/api/display/pdfbild/...).
      // Gleiches Seitenverhaeltnis wie das Papier, also randlos im Blatt.
      const bild = pdf.replace('/api/display/pdf/', '/api/display/pdfbild/');
      return `<div class="blatt blatt-pdf">
                ${text ? `<div class="blatt-titel">${esc(text)}</div>` : ''}
                <img src="${esc(bild)}" alt="Aushang">
              </div>`;
    }
    return `<div class="blatt blatt-text">
              <div class="briefkopf">
                <img src="/logo-rosenweg.png" alt="" onload="fitText()" onerror="this.style.display='none'; fitText();">
                <div>
                  <div class="wm">Rosenweg Kaiseraugst</div>
                  <div class="ort">Stockwerkeigentümergemeinschaft</div>
                </div>
              </div>
              <div class="body"><span class="fit">${esc(text)}</span></div>
            </div>`;
  }

  function renderAushaenge(liste) {
    document.body.classList.remove('emergency');
    $('screen').innerHTML =
      `<div class="blaetter">
         <div class="kopfzeile">
           <div class="marke">
             <img src="/logo-rosenweg.png" alt="" onerror="this.style.display='none'">
             <div><div class="tt">Rosenweg</div><div class="ss">Kaiseraugst</div></div>
           </div>
           <div id="uhr"></div>
         </div>
         <div class="reihe">${liste.map(blattHtml).join('')}</div>
       </div>`;
    schirmUhr();
    // Erst die Blaetter bemassen, dann den Text einpassen — in dieser
    // Reihenfolge, sonst misst fitText einen Kasten, den es noch nicht gibt.
    // Mehrfach, weil das Wappen im Briefkopf asynchron nachlaedt und die
    // Hoehe des Textbereichs danach eine andere ist.
    const einpassen = () => { blaetterBemassen(); fitText(); };
    einpassen();
    requestAnimationFrame(() => requestAnimationFrame(einpassen));
    setTimeout(einpassen, 400);
  }

  // Breite und Hoehe jedes Blattes ausrechnen und setzen.
  //
  // Allein mit CSS ging es nicht: mit 'align-items: stretch' gibt die Zeile die
  // Hoehe vor und die Breite folgt aus 210:297 — auf einem hochkant haengenden
  // Tablet wurde das Blatt dadurch breiter als der Schirm und der Text lief
  // links und rechts hinaus. Mit 'height: 100%' wiederum findet die Prozent-
  // angabe keine feste Bezugshoehe und faellt auf den Inhalt zurueck. Also
  // gerechnet: erst an der Hoehe versuchen, und wenn es dann zu breit wird,
  // an der Breite.
  function blaetterBemassen() {
    const reihe = document.querySelector('#screen .reihe');
    if (!reihe) return;
    const blaetter = reihe.querySelectorAll('.blatt');
    if (!blaetter.length) return;
    const n = blaetter.length;
    const abstand = window.innerWidth * 0.025;
    const platzB = reihe.clientWidth - abstand * (n - 1);
    const platzH = reihe.clientHeight;

    let h = platzH;
    let b = h * (210 / 297);
    if (b * n > platzB) { b = platzB / n; h = b * (297 / 210); }
    blaetter.forEach((el) => { el.style.width = Math.floor(b) + 'px'; el.style.height = Math.floor(h) + 'px'; });
  }

  // Der Notfall bleibt, was er war: der ganze Schirm, rot, ohne Blatt. Ein
  // Aushang will gelesen werden, ein Alarm will gesehen werden.
  function renderNotfall(d) {
    const text = (d.text || '').trim();
    const pdf = (d.pdf || '').trim();
    document.body.classList.add('emergency');
    $('screen').innerHTML =
      `<div class="emergency-scr">
         <div class="sym">🚨</div>
         <div class="kick">Notfall · Achtung</div>
         ${pdf
           ? `${text ? `<div class="pdf-titel">${esc(text)}</div>` : ''}
              <iframe class="pdf" src="${esc(pdf)}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" title="Notfall"></iframe>`
           : `<div class="body"><span class="fit">${esc(text)}</span></div>`}
       </div>`;
    if (!pdf) fitText();
  }

  const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const MO = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function renderIdle() {
    document.body.classList.remove('emergency');
    const n = new Date();
    const hh = String(n.getHours()).padStart(2, '0');
    const mm = String(n.getMinutes()).padStart(2, '0');
    const ss = String(n.getSeconds()).padStart(2, '0');
    const dateStr = `${WD[n.getDay()]}, ${n.getDate()}. ${MO[n.getMonth()]} ${n.getFullYear()}`;
    $('screen').innerHTML =
      `<div class="idle">
         <div class="brand">
           <img src="/logo-rosenweg.png" alt="Rosenweg" onerror="this.style.display='none'">
           <div><div class="tt">Rosenweg</div><div class="ss">Kaiseraugst</div></div>
         </div>
         <div class="clock-t">${hh}:${mm}<span class="sec">${ss}</span></div>
         <div class="clock-d">${dateStr}</div>
       </div>`;
  }

  // Aktueller Bildschirmzustand. Nur neu zeichnen, wenn sich wirklich etwas
  // geaendert hat — ein Neuzeichnen laedt jedes eingebettete PDF neu, und das
  // sieht man als Flackern.
  let shown = { kind: null, sig: null };
  function render() {
    const ch = activeChannel();
    if (!ch) {
      state.lastTs = 0;
      document.body.classList.add('idle-an');
      if (shown.kind !== 'idle') shown = { kind: 'idle', sig: null };
      renderIdle();                       // die Uhr tickt weiter
      updateAge();
      return;
    }
    document.body.classList.remove('idle-an');

    if (ch.kind === 'emergency') {
      const d = ch.d;
      const sig = JSON.stringify(['emergency', d.text || '', d.pdf || '']);
      if (shown.kind !== 'emergency' || shown.sig !== sig) {
        shown = { kind: 'emergency', sig };
        renderNotfall(d);
      }
      state.lastTs = Number(d.ts) || 0;
      updateAge();
      return;
    }

    const sig = JSON.stringify(ch.liste.map(a => [a.text || '', a.pdf || '']));
    if (shown.kind !== 'announce' || shown.sig !== sig) {
      shown = { kind: 'announce', sig };
      renderAushaenge(ch.liste);
    }
    state.lastTs = Math.max(0, ...ch.liste.map(a => Number(a.ts) || 0));
    updateAge();
  }

  // Dreht jemand den Schirm oder aendert sich die Aufloesung, passen ploetzlich
  // zwei Blaetter statt einem — oder umgekehrt. Neu rechnen und neu setzen.
  let umbauTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(umbauTimer);
    umbauTimer = setTimeout(() => {
      shown = { kind: null, sig: null };
      render();
      blaetterBemassen();
      fitText();
    }, 250);
  });

  // Die Uhr des Schirms. Getrennt vom Zeichnen, damit sie sekuendlich laufen
  // kann, ohne die Blaetter anzufassen — sonst laedt jedes PDF im Takt neu.
  function schirmUhr() {
    const el = $('uhr');
    if (!el) return;
    const n = new Date();
    const p = (x) => String(x).padStart(2, '0');
    el.innerHTML = `${p(n.getHours())}:${p(n.getMinutes())}`
      + `<span class="dat">${WD[n.getDay()]}, ${n.getDate()}. ${MO[n.getMonth()]}</span>`;
  }

  function updateAge() {
    const el = $('age');
    if (!state.lastTs) { el.textContent = ''; return; }
    const secs = Math.max(0, Math.round((Date.now() - state.lastTs * 1000) / 1000));
    let t;
    if (secs < 60) t = 'gerade eben';
    else if (secs < 3600) t = 'vor ' + Math.round(secs / 60) + ' Min';
    else if (secs < 86400) t = 'vor ' + Math.round(secs / 3600) + ' Std';
    else t = 'vor ' + Math.round(secs / 86400) + ' Tg';
    el.textContent = 'aktualisiert ' + t;
  }

  // ===== Verbindungs-/Frische-Indikator =====
  function setStat(cls, label) { state.connClass = cls; state.connLabel = label; }
  function refreshStat() {
    let cls, label;
    if (!state.connOk) {
      cls = state.connClass === 'err' ? 'err' : 'off';
      label = state.connLabel || 'getrennt';
    } else {
      const age = Date.now() - state.lastHeartbeat;
      if (!state.lastHeartbeat || age > 30000) { cls = 'err'; label = 'keine Daten'; }
      else { cls = 'ok'; label = 'live'; }
    }
    const s = $('stat');
    s.className = cls;
    $('stat-t').textContent = label;
  }

  // ===== MQTT-Nachrichten =====
  function onMessage(topic, payload) {
    const t = String(topic);
    const raw = payload.toString();

    if (t === 'heartbeat') {
      state.lastHeartbeat = Date.now();
      refreshStat();
      return;
    }
    if (t === 'display/announcements') {
      // raw und nicht p: den Parameter gibt es nicht, der Zugriff warf, der
      // catch schluckte es, und die Liste war IMMER leer. Sichtbar war davon
      // nichts — die Anzeige fiel stumm auf den alten Einzelkanal zurueck.
      try { state.announcements = JSON.parse(raw) || []; } catch { state.announcements = []; }
      render();
      return;
    }
    if (t === 'display/announcement' || t === 'display/emergency') {
      let d = null;
      try { d = JSON.parse(raw); } catch (_) { d = null; }
      if (raw.trim() === '') d = null; // geleerter retained Payload
      const key = t === 'display/emergency' ? 'emergency' : 'announcement';
      state[key] = d;
      render();
      return;
    }
    // andere display/* Topics werden ignoriert
  }

  // Öffentlich: read-only MQTT-User (nur display/# + heartbeat lesen), eingebettet — keine Anmeldung.
  function connect() {
    setStat('off', 'verbinde…'); refreshStat();
    const client = mqtt.connect('wss://mqtt.rosenweg4303.ch', {
      username: 'display-public', password: 'display-public-5b1e60a4b34f71e5',
      protocolVersion: 4, clean: true, reconnectPeriod: 6000, connectTimeout: 12000,
      clientId: 'rwdisplay_' + Math.random().toString(16).slice(2, 10),
    });
    client.on('connect', () => {
      state.connOk = true;
      client.subscribe('display/#', { qos: 0 }, (e) => { if (e) { setStat('err', 'kein Zugriff'); state.connOk = false; refreshStat(); } });
      client.subscribe('heartbeat', { qos: 0 }, () => {});
      refreshStat();
    });
    client.on('message', onMessage);
    client.on('reconnect', () => { state.connOk = false; setStat('off', 'reconnect…'); refreshStat(); });
    client.on('close', () => { state.connOk = false; setStat('off', 'getrennt'); refreshStat(); });
    client.on('offline', () => { state.connOk = false; setStat('off', 'offline'); refreshStat(); });
    client.on('error', (e) => { console.error('mqtt', e); state.connOk = false; setStat('err', 'Fehler'); refreshStat(); });
  }

  document.addEventListener('DOMContentLoaded', () => {
    render();
    schirmUhr();
    connect();
    // Uhr-Tick + Alter aktualisieren. Die Blätter bleiben dabei unberührt —
    // ein Neuzeichnen würde jedes eingebettete PDF im Sekundentakt neu laden.
    // (Auf Größenänderungen hört ein eigener Zuhörer weiter oben.)
    setInterval(() => {
      if (shown.kind === 'idle') renderIdle();
      schirmUhr();
      updateAge();
    }, 1000);
    // Frische-Indikator regelmäßig prüfen (auch ohne neue Nachrichten -> stale erkennen)
    setInterval(refreshStat, 5000);

    // ===== Sich selbst auf den neuen Stand bringen =====
    //
    // Ein Kiosk lädt einmal und behält die Seite. Eine Änderung an dieser
    // Datei erreicht ihn dadurch erst beim nächsten Neustart — am 6. August
    // zeigte display-test deshalb noch die Fassung von vorgestern, und der
    // Grund war lange nicht zu sehen.
    //
    // Stationen laden zwar alle 30 Minuten neu (station-display-reload), die
    // SlideShow-Tafeln aber nie. Deshalb prüft die Seite selbst: sie holt sich
    // alle fünf Minuten und vergleicht ihre eigene Länge und eine einfache
    // Prüfsumme mit dem Stand beim Laden. Weicht etwas ab, lädt sie neu.
    //
    // Kein Versionsstempel, weil den niemand pflegen müsste, der ihn dann
    // vergisst — die Datei selbst ist die Wahrheit.
    (() => {
      const pruefsumme = (s) => {
        let x = 0;
        for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0;
        return `${s.length}:${x}`;
      };
      let stand = null;

      async function nachsehen() {
        try {
          const a = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
          if (!a.ok) return;
          const jetzt = pruefsumme(await a.text());
          if (stand === null) { stand = jetzt; return; }
          if (jetzt === stand) return;

          // Während eines Notfalls nicht neu laden: das kostet eine Sekunde
          // schwarzen Bildschirm, und genau dann schaut jemand hin. Der neue
          // Stand kommt nach der Entwarnung.
          if (state.emergency && state.emergency.active) return;
          location.reload();
        } catch { /* Netz weg — beim nächsten Mal wieder */ }
      }

      nachsehen();
      setInterval(nachsehen, 5 * 60 * 1000);
    })();
  });
  </script>
</body>
</html>
