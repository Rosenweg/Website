; ============================================================
; ConfBridge — Technik-Konferenz (Extension 100)
;
; Wer 100 waehlt (internes SIP-Telefon oder via Dialplan), landet in der
; Bridge 'technik'. pbx_conf_invite.py holt parallel alle aktiven Ring-Member
; per Call-File in dieselbe Bridge.
; ============================================================

[general]

[default_user]
type = user
; Ansage/Beep beim Betreten/Verlassen, damit man hoert wer dazukommt.
announce_join_leave = yes
announce_user_count = yes
dtmf_passthrough = yes
; Standard-Teilnehmer hoeren + sprechen sofort (keine Marked-User-Wartepflicht).
wait_marked = no
end_marked = no
quiet = no

[technik_bridge]
type = bridge
max_members = 20
; Konferenz endet, wenn der letzte Teilnehmer auflegt.
internal_sample_rate = auto
mixing_interval = 20
record_conference = no

; ── Mid-Call-Eskalation (*100) ──────────────────────────────────────────────
; Angenommene EINGEHENDE Anrufe laufen als stille 2er-ConfBridge (eigener Raum
; pro Anruf). Der Anrufer hoert KEINE Ansagen (caller_user). Das angenommene
; Mitglied (agent_user) hat das Menu invite_menu: *100 holt die Gruppe dazu.

[caller_user]
type = user
announce_join_leave = no
announce_user_count = no
quiet = yes
dtmf_passthrough = yes
wait_marked = no
end_marked = no

[agent_user]
type = user
announce_join_leave = no
announce_user_count = no
quiet = yes
; DTMF des Mitglieds wird vom Menu ausgewertet (nicht durchgereicht), damit
; *100 als Kommando erkannt wird statt als Ton zum Anrufer zu gehen.
dtmf_passthrough = no
wait_marked = no
end_marked = no

[invite_menu]
type = menu
; *100 mitten im Gespraech -> Gruppe live dazuholen (dialplan_exec laeuft, das
; Mitglied bleibt danach in der Konferenz).
*100 = dialplan_exec(conf-invite-live,s,1)
