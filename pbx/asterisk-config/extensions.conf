; ============================================================
; Dialplan fuer Rosenweg-PBX
;
; Eingehende Calls (peoplefone-Trunk → Context "inbound"):
;   1. Time-Check via AGI (Europe/Zurich, Config aus PBX-API/SQLite).
;   2. Macro techring klingelt die aktiven Ring-Member: in Geschaeftszeit alle,
;      ausserhalb nur die mit "klingelt immer" (bypass_hours). Keiner aktiv →
;      Voicemail (mit Closed-Intro wenn ausserhalb der Zeit).
;   3. No-Answer → AI-Voicemail (Transkript per Mail/WhatsApp via Haupt-API).
;
; Interne SIP-Telefone (LAN/VPN, Context "internal"):
;   - 100  → Technik-Konferenz (ConfBridge, holt alle Member dazu)
;   - 1000 → Test/Echo
;   - 2-3-stellige Extensions → Telefon-zu-Telefon
;   - 0.../+.../00... → ausgehend ueber peoplefone
; ============================================================

[globals]
; Ring-Members + Hours kommen dynamisch via AGI aus der PBX-API/SQLite.
RING_TIMEOUT    = 30
LANG            = de

[macro-techring]
; ARG1 = IS_OPEN (1/0). Klingelt dynamisch in Cascading-Stufen: gleiche Prio =
; parallel, niedrigere zuerst. Die AGI liefert je nach open die passenden Member.
exten = s,1,NoOp(Ring-Group open=${ARG1})
; CNAM-Name (vom pbx_cnam.py) gewinnt; nur ohne Treffer "Rosenweg" als Branding.
exten = s,n,ExecIf($["${CNAM}" = ""]?Set(CALLERID(name)=Rosenweg))
exten = s,n,AGI(pbx_get_ring_members.py,${ARG1})
exten = s,n,GotoIf($[${RING_LEVELS:-0} <= 0]?empty)
exten = s,n,Set(PER_LEVEL=$[${RING_TIMEOUT} / ${RING_LEVELS}])
exten = s,n,Set(LEVEL=1)
exten = s,n(loop),Set(DIAL_STR=${RING_DIAL_${LEVEL}})
exten = s,n,GotoIf($["${DIAL_STR}" = ""]?vm)
exten = s,n,NoOp(Level ${LEVEL}/${RING_LEVELS}: ${DIAL_STR})
; G(): wird der Anruf angenommen, landen BEIDE Seiten in answered-conf (stille
; 2er-Konferenz, damit *100 spaeter die Gruppe live dazuholen kann). Nur bei
; KEINER Antwort laeuft die Macro hier weiter zum naechsten Level.
exten = s,n,Dial(${DIAL_STR},${PER_LEVEL},G(answered-conf^s^1))
exten = s,n,Set(LEVEL=$[${LEVEL} + 1])
exten = s,n,GotoIf($[${LEVEL} <= ${RING_LEVELS}]?loop)
exten = s,n(vm),Goto(voicemail-ai,s,1)
exten = s,n(empty),NoOp(Keine aktiven Member open=${ARG1})
exten = s,n,GotoIf($["${ARG1}" = "1"]?vmgo)
exten = s,n,Playback(vm-intro-closed)
exten = s,n(vmgo),Goto(voicemail-ai,s,1)

[inbound]
; Einstiegspunkt: alle eingehenden Calls vom peoplefone-Trunk.
exten = _X.,1,NoOp(Eingehender Call: ${CALLERID(num)} → ${EXTEN})
exten = _X.,n,AGI(pbx_log_call_event.py,start)
exten = _X.,n,Answer()
exten = _X.,n,Wait(1)
exten = _X.,n,AGI(pbx_cnam.py,${CALLERID(num)})       ; Name-Lookup -> CALLERID(name)
exten = _X.,n,AGI(pbx_check_hours.py)                 ; setzt IS_OPEN
exten = _X.,n,Macro(techring,${IS_OPEN})              ; klingelt; bypass-Member auch ausserhalb
exten = _X.,n,Goto(end-call,s,1)

[end-call]
exten = s,1,AGI(pbx_log_call_event.py,end,${DIALSTATUS})
exten = s,n,Hangup()

[voicemail-ai]
; Voicemail mit Transkription. transcribe_voicemail.py spricht die HAUPT-API an
; (Whisper/Claude/Mail/WhatsApp) — bewusst NICHT die lokale PBX-API.
exten = s,1,NoOp(Voicemail-Aufnahme starten)
exten = s,n,Playback(vm-recording-prompt)
exten = s,n,Set(VM_FILE=/var/spool/asterisk/voicemail/recordings/vm-${UNIQUEID})
exten = s,n,Record(${VM_FILE}.wav,3,180,k)            ; max 180s, beep, 3s silence stop
exten = s,n,Playback(vm-goodbye)
exten = s,n,AGI(transcribe_voicemail.py,${VM_FILE}.wav,${CALLERID(num)},${UNIQUEID})
exten = s,n,Hangup()

[conf-join]
; Ziel der Call-Files von pbx_conf_invite.py: dialt Member an → ConfBridge.
; CONF_ROOM wird per Setvar im Call-File gesetzt (eigener Raum je Anruf bzw.
; 'technik' fuer die SIP-100-Konferenz).
exten = s,1,Answer()
exten = s,n,ConfBridge(${CONF_ROOM},technik_bridge,default_user)
exten = s,n,Hangup()

[answered-conf]
; Ziel von Dial G() im techring-Macro: ein angenommener EINGEHENDER Anruf wird
; zur stillen 2er-ConfBridge (eigener Raum inb-<linkedid>). G schickt den Anrufer
; nach s,1 und das angenommene Mitglied nach s,2.
exten = s,1,Goto(cleg,1)
exten = s,2,Goto(mleg,1)
; --- Anrufer-Seite (extern) ---
exten = cleg,1,Set(__CONFROOM=inb-${CHANNEL(linkedid)})
exten = cleg,n,Set(DB(confanswer/${CHANNEL(linkedid)})=${DIALEDPEERNUMBER})
exten = cleg,n,AGI(pbx_log_call_event.py,answer,${DIALEDPEERNUMBER})
exten = cleg,n,ConfBridge(${CONFROOM},technik_bridge,caller_user)
exten = cleg,n,Goto(end-call,s,1)
; --- angenommenes Mitglied (mit *100-Menu) ---
exten = mleg,1,Set(__CONFROOM=inb-${CHANNEL(linkedid)})
exten = mleg,n,ConfBridge(${CONFROOM},technik_bridge,agent_user,invite_menu)
exten = mleg,n,Hangup()

[conf-invite-live]
; Vom *100-Menu (agent_user) aufgerufen: holt die Gruppe in DENSELBEN Raum,
; ohne das eingeloggte Mitglied (DB confanswer) nochmal anzurufen. KEIN Hangup —
; ConfBridge bringt das Mitglied nach dem dialplan_exec zurueck in die Konferenz.
exten = s,1,NoOp(Live-Eskalation Raum inb-${CHANNEL(linkedid)})
exten = s,n,AGI(pbx_conf_invite.py,${DB(confanswer/${CHANNEL(linkedid)})},inb-${CHANNEL(linkedid)})

[internal]
; Interne SIP-Telefone (LAN/VPN). Endpoints werden aus pjsip_phones.conf geladen
; (von der PBX-API generiert). Explizite Extensions schlagen die Patterns.

; 100 = Technik-Konferenz: Anrufer joint + alle aktiven Member werden reingewaehlt.
exten = 100,1,NoOp(Technik-Konferenz)
exten = 100,n,Answer()
exten = 100,n,AGI(pbx_conf_invite.py,${CALLERID(num)},technik)
exten = 100,n,ConfBridge(technik,technik_bridge,default_user)
exten = 100,n,Hangup()

; *43 = Test/Echo
exten = *43,1,Answer()
exten = *43,n,Playback(hello-world)
exten = *43,n,Echo()
exten = *43,n,Hangup()

; 1000-1999 = Ring-Group-Mitglieder direkt (AGI loest internal_ext -> Ziel auf).
exten = _1XXX,1,NoOp(Direktwahl Mitglied ${EXTEN})
exten = _1XXX,n,AGI(pbx_dial_member.py,${EXTEN})
exten = _1XXX,n,GotoIf($["${MEMBER_DIAL}" = ""]?nf)
exten = _1XXX,n,Dial(${MEMBER_DIAL},40,tT)
exten = _1XXX,n,Hangup()
exten = _1XXX,n(nf),Playback(pbx-invalid)
exten = _1XXX,n,Hangup()

; 2000-2999 = interne SIP-Telefone direkt anrufen.
exten = _2XXX,1,Dial(PJSIP/${EXTEN},30,tT)
exten = _2XXX,n,Hangup()

; Ausgehend ueber peoplefone (CH 0..., international +.../00...).
exten = _0Z.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _0Z.,n,Hangup()
exten = _+X.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _+X.,n,Hangup()
exten = _00X.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _00X.,n,Hangup()
