; ============================================================
; Dialplan fuer Rosenweg-PBX
;
; Eingehende Calls (vom peoplefone-Trunk → Context "inbound"):
;   1. Time-Check: Mo-So 06:00-20:00 CH/CET?
;   2. JA  → Ring-Group an Technik-Mobiles (Dial-Timeout 30s)
;           → Bei No-Answer → AI-Voicemail
;   3. NEIN → AI-Voicemail (mit Transkription per Email an Technik)
; ============================================================

[globals]
; Ring-Members + Hours kommen dynamisch via AGI aus der API/DB.
; Fallbacks falls AGI scheitert:
RING_TIMEOUT    = 30                                  ; Sekunden
HOURS_OPEN_FROM = 06:00
HOURS_OPEN_TO   = 20:00
LANG            = de

[macro-techring]
; Klingelt dynamisch in Cascading-Stufen: gleiche Prio = parallel, niedrigere Prio zuerst.
; AGI setzt RING_LEVELS + RING_DIAL_1..N. Per-Level-Timeout = total / levels.
exten = s,1,NoOp(Hole aktive Ring-Members aus DB)
exten = s,n,Set(CALLERID(name)=Rosenweg)
exten = s,n,AGI(pbx_get_ring_members.py)
exten = s,n,GotoIf($[${RING_LEVELS:-0} <= 0]?empty)
exten = s,n,Set(PER_LEVEL=$[${RING_TIMEOUT} / ${RING_LEVELS}])
exten = s,n,Set(LEVEL=1)
exten = s,n(loop),Set(DIAL_STR=${RING_DIAL_${LEVEL}})
exten = s,n,GotoIf($["${DIAL_STR}" = ""]?vm)
exten = s,n,NoOp(Level ${LEVEL}/${RING_LEVELS}: ${DIAL_STR})
exten = s,n,Dial(${DIAL_STR},${PER_LEVEL},tT)
exten = s,n,AGI(pbx_log_call_event.py,answer,${DIALEDPEERNUMBER})
exten = s,n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
exten = s,n,Set(LEVEL=$[${LEVEL} + 1])
exten = s,n,GotoIf($[${LEVEL} <= ${RING_LEVELS}]?loop)
exten = s,n(vm),NoOp(Alle Level durch ohne Antwort → Voicemail)
exten = s,n,Goto(voicemail-ai,s,1)
exten = s,n(empty),NoOp(Keine aktiven Ring-Members → direkt Voicemail)
exten = s,n,Goto(voicemail-ai,s,1)
exten = s,n(done),Return()

[inbound]
; Einstiegspunkt: alle eingehenden Calls vom peoplefone-Trunk.
exten = _X.,1,NoOp(Eingehender Call: ${CALLERID(num)} → ${EXTEN})
exten = _X.,n,AGI(pbx_log_call_event.py,start)
exten = _X.,n,Answer()
exten = _X.,n,Wait(1)
; Time-Check via AGI (timezone-aware Europe/Zurich, config aus DB)
exten = _X.,n,AGI(pbx_check_hours.py)
exten = _X.,n,GotoIf($["${IS_OPEN}" = "1"]?open:closed)

exten = _X.,n(open),NoOp(Geschaeftszeit → Ring-Group)
exten = _X.,n,Macro(techring)
exten = _X.,n,Goto(end-call,s,1)

exten = _X.,n(closed),NoOp(Ausserhalb Geschaeftszeit → AI-Voicemail)
exten = _X.,n,Playback(vm-intro-closed)              ; "Ausserhalb der Geschaeftszeit ..."
exten = _X.,n,Goto(voicemail-ai,s,1)

[end-call]
exten = s,1,AGI(pbx_log_call_event.py,end,${DIALSTATUS})
exten = s,n,Hangup()

[voicemail-ai]
; Voicemail mit Transkription. Nach Aufnahme triggert AGI das
; Transcribe-Script, das die Audiodatei via Whisper transkribiert
; und das Ergebnis per Email an Technik schickt.
exten = s,1,NoOp(Voicemail-Aufnahme starten)
exten = s,n,Playback(vm-recording-prompt)             ; "Bitte hinterlassen Sie eine Nachricht ..."
exten = s,n,Set(VM_FILE=/var/spool/asterisk/voicemail/recordings/vm-${UNIQUEID})
exten = s,n,Record(${VM_FILE}.wav,3,180,k)             ; max 180s, beep, 3s silence to stop
exten = s,n,Playback(vm-goodbye)
exten = s,n,AGI(transcribe_voicemail.py,${VM_FILE}.wav,${CALLERID(num)},${UNIQUEID})
exten = s,n,Hangup()

; Internal extension fuer Testzwecke (Softphone register als "test1")
[internal]
exten = 1000,1,Answer()
exten = 1000,n,Playback(hello-world)
exten = 1000,n,Hangup()
