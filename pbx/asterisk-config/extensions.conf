; ============================================================
; Dialplan fuer Rosenweg-PBX
;
; Eingehende Calls (peoplefone-Trunk → Context "inbound"):
;   1. Time-Check via AGI (Europe/Zurich, Config aus PBX-API/SQLite).
;   2. Macro techring klingelt die aktiven Ring-Member: in Geschaeftszeit alle,
;      ausserhalb nur die mit "klingelt immer" (bypass_hours). Keiner aktiv →
;      Voicemail (mit Closed-Intro wenn ausserhalb der Zeit).
;   3. No-Answer → AI-Voicemail (Transkript per Mail/WhatsApp via Haupt-API).
;
; Interne SIP-Telefone (LAN/VPN, Context "internal"):
;   - 100  → Technik-Konferenz (ConfBridge, holt alle Member dazu)
;   - 1000 → Test/Echo
;   - 2-3-stellige Extensions → Telefon-zu-Telefon
;   - 0.../+.../00... → ausgehend ueber peoplefone
;   - 3HHWWP (6 Stellen) → persoenliche Nummer: klingelt an allen Geraeten mit
;     Sitzung der Person, dann Weiterleitung bzw. persoenliche Voicemail
;   - 4XXX → Kurzwahl Hausverwaltung (externe Festnetznummer)
;
; Persoenliche Zugaenge in Rosenweg Telefon (Context "person", 25.11.2026):
;   <nummer>-<geraet> (z.B. 310201-2102), von der PBX-API nur waehrend einer
;   Sitzung in pjsip_phones.conf geschrieben. Gehend wie [geteilt] mit Anmeldung.
;   Nummernplan: docs/plans/telefon-nummernplan.md
; ============================================================

[globals]
; Ring-Members + Hours kommen dynamisch via AGI aus der PBX-API/SQLite.
RING_TIMEOUT    = 30
LANG            = de

[techring]
; Frueher [macro-techring], aufgerufen mit Macro(). Asterisk 21 hat app_macro
; entfernt; seit dem Sprung auf 22 gab es die Anwendung nicht mehr, und JEDER
; eingehende Anruf starb an dieser Zeile — angenommen, eine Sekunde, aufgelegt.
; Aufgefallen ist es am 4. September 2026, als jemand nach der Aufzeichnung
; eines Anrufs fragte; die letzte Sprachnachricht stammte vom 9. Juni.
;
; Gosub statt Macro: ${ARG1} gibt es dort genauso. Ein Return braucht es
; nicht, weil beide Ausgaenge ohnehin nach voicemail-ai springen.
; ARG1 = IS_OPEN (1/0). Klingelt dynamisch in Cascading-Stufen: gleiche Prio =
; parallel, niedrigere zuerst. Die AGI liefert je nach open die passenden Member.
exten = s,1,NoOp(Ring-Group open=${ARG1})
; CNAM-Name (vom pbx_cnam.py) gewinnt; nur ohne Treffer "Rosenweg" als Branding.
exten = s,n,ExecIf($["${CNAM}" = ""]?Set(CALLERID(name)=Rosenweg))
exten = s,n,AGI(pbx_get_ring_members.py,${ARG1})
exten = s,n,GotoIf($[${RING_LEVELS:-0} <= 0]?empty)
exten = s,n,Set(PER_LEVEL=$[${RING_TIMEOUT} / ${RING_LEVELS}])
exten = s,n,Set(LEVEL=1)
exten = s,n(loop),Set(DIAL_STR=${RING_DIAL_${LEVEL}})
exten = s,n,GotoIf($["${DIAL_STR}" = ""]?vm)
exten = s,n,NoOp(Level ${LEVEL}/${RING_LEVELS}: ${DIAL_STR})
; G(): wird der Anruf angenommen, landen BEIDE Seiten in answered-conf (stille
; 2er-Konferenz, damit *100 spaeter die Gruppe live dazuholen kann). Nur bei
; KEINER Antwort laeuft es hier weiter zum naechsten Level.
exten = s,n,Dial(${DIAL_STR},${PER_LEVEL},G(answered-conf^s^1))
exten = s,n,Set(LEVEL=$[${LEVEL} + 1])
exten = s,n,GotoIf($[${LEVEL} <= ${RING_LEVELS}]?loop)
; ARG2 = "klingeln": nur die Gruppe klingeln lassen (intern 1000), ohne gemeinsame Voicemail.
exten = s,n(vm),GotoIf($["${ARG2}" = "klingeln"]?nurklingeln)
exten = s,n,Goto(voicemail-ai,s,1)
exten = s,n(empty),NoOp(Keine aktiven Member open=${ARG1})
exten = s,n,GotoIf($["${ARG2}" = "klingeln"]?nurklingeln)
exten = s,n,GotoIf($["${ARG1}" = "1"]?vmgo)
exten = s,n,Playback(vm-intro-closed)
exten = s,n(vmgo),Goto(voicemail-ai,s,1)
exten = s,n(nurklingeln),Playback(vm-nobodyavail)
exten = s,n,Hangup()

[inbound]
; Einstiegspunkt: alle eingehenden Calls vom peoplefone-Trunk.
exten = _X.,1,NoOp(Eingehender Call: ${CALLERID(num)} → ${EXTEN})
exten = _X.,n,AGI(pbx_log_call_event.py,start)
exten = _X.,n,Answer()
exten = _X.,n,Wait(1)
exten = _X.,n,AGI(pbx_cnam.py,${CALLERID(num)})       ; Name-Lookup -> CALLERID(name)
exten = _X.,n,AGI(pbx_check_hours.py)                 ; setzt IS_OPEN
exten = _X.,n,Gosub(techring,s,1(${IS_OPEN}))         ; klingelt; bypass-Member auch ausserhalb
exten = _X.,n,Goto(end-call,s,1)

[end-call]
exten = s,1,AGI(pbx_log_call_event.py,end,${DIALSTATUS})
exten = s,n,Hangup()

[voicemail-ai]
; Voicemail mit Transkription. transcribe_voicemail.py spricht die HAUPT-API an
; (Whisper/Claude/Mail/WhatsApp) — bewusst NICHT die lokale PBX-API.
exten = s,1,NoOp(Voicemail-Aufnahme starten)
exten = s,n,Playback(vm-recording-prompt)
exten = s,n,Set(VM_FILE=/var/spool/asterisk/voicemail/recordings/vm-${UNIQUEID})
exten = s,n,Record(${VM_FILE}.wav,3,180,k)            ; max 180s, beep, 3s silence stop
exten = s,n,Playback(vm-goodbye)
exten = s,n,AGI(transcribe_voicemail.py,${VM_FILE}.wav,${CALLERID(num)},${UNIQUEID})
exten = s,n,Hangup()

[conf-join]
; Ziel der Call-Files von pbx_conf_invite.py: dialt Member an → ConfBridge.
; CONF_ROOM wird per Setvar im Call-File gesetzt (eigener Raum je Anruf bzw.
; 'technik' fuer die SIP-100-Konferenz).
exten = s,1,Answer()
exten = s,n,ConfBridge(${CONF_ROOM},technik_bridge,default_user)
exten = s,n,Hangup()

[answered-conf]
; Ziel von Dial G() im techring-Macro: ein angenommener EINGEHENDER Anruf wird
; zur stillen 2er-ConfBridge (eigener Raum inb-<linkedid>). G schickt den Anrufer
; nach s,1 und das angenommene Mitglied nach s,2.
exten = s,1,Goto(cleg,1)
exten = s,2,Goto(mleg,1)
; --- Anrufer-Seite (extern) ---
exten = cleg,1,Set(__CONFROOM=inb-${CHANNEL(linkedid)})
exten = cleg,n,Set(DB(confanswer/${CHANNEL(linkedid)})=${DIALEDPEERNUMBER})
exten = cleg,n,AGI(pbx_log_call_event.py,answer,${DIALEDPEERNUMBER})
exten = cleg,n,ConfBridge(${CONFROOM},technik_bridge,caller_user)
exten = cleg,n,Goto(end-call,s,1)
; --- angenommenes Mitglied (mit *100-Menu) ---
exten = mleg,1,Set(__CONFROOM=inb-${CHANNEL(linkedid)})
exten = mleg,n,ConfBridge(${CONFROOM},technik_bridge,agent_user,invite_menu)
exten = mleg,n,Hangup()

[conf-invite-live]
; Vom *100-Menu (agent_user) aufgerufen: holt die Gruppe in DENSELBEN Raum,
; ohne das eingeloggte Mitglied (DB confanswer) nochmal anzurufen. KEIN Hangup —
; ConfBridge bringt das Mitglied nach dem dialplan_exec zurueck in die Konferenz.
exten = s,1,NoOp(Live-Eskalation Raum inb-${CHANNEL(linkedid)})
exten = s,n,AGI(pbx_conf_invite.py,${DB(confanswer/${CHANNEL(linkedid)})},inb-${CHANNEL(linkedid)})

[internal]
; Interne SIP-Telefone (LAN/VPN). Endpoints werden aus pjsip_phones.conf geladen
; (von der PBX-API generiert). Explizite Extensions schlagen die Patterns.

; Hangup-Handler: loggt JEDEN Anruf aus diesem Context (ausgehend + intern) per
; CDR ins Anruf-Log. (Inbound wird separat ueber [inbound] geloggt.)
exten = h,1,AGI(pbx_log_call_event.py,cdr,${CDR(src)}^${CDR(dst)}^${CDR(disposition)}^${CDR(billsec)}^${CDR(start)}^${UNIQUEID})

; 100 = Technik-Konferenz: Anrufer joint + alle aktiven Member werden reingewaehlt.
exten = 100,1,NoOp(Technik-Konferenz)
exten = 100,n,Answer()
exten = 100,n,AGI(pbx_conf_invite.py,${CALLERID(num)},technik)
exten = 100,n,ConfBridge(technik,technik_bridge,default_user)
exten = 100,n,Hangup()

; *43 = Test/Echo
exten = *43,1,Answer()
exten = *43,n,Playback(hello-world)
exten = *43,n,Echo()
exten = *43,n,Hangup()

; 1000-1999 = Ring-Groups (Stefan 25.11.2026; die fruehere Direktwahl einzelner Mitglieder
; war doppelt zu 3HHWWP/21XX und ist weg).
; 1000 = Ring-Group Technik: klingelt bei allen Mitgliedern, ohne Geschaeftszeiten und ohne
; Voicemail - fuer interne Anrufe, die die Technik direkt erreichen wollen.
exten = 1000,1,NoOp(Ring-Group Technik)
; intern: Name der anrufenden Person behalten (techring setzt sonst "Rosenweg")
same  = n,Set(CNAM=${CALLERID(name)})
same  = n,Gosub(techring,s,1(1,klingeln))
same  = n,Hangup()

; 2000-2099 = Dienste (Nummernplan 24.11.2026). 2000 = Dienst Technik: derselbe Ablauf wie die
; Amtsnummer von aussen - Geschaeftszeiten, Ring-Group, sonst gemeinsame Voicemail (Abschrift,
; WhatsApp an Technik, Auto-Reklamation).
exten = 2000,1,NoOp(Dienst Technik)
same  = n,Set(CNAM=${CALLERID(name)})
same  = n,AGI(pbx_check_hours.py)
same  = n,Gosub(techring,s,1(${IS_OPEN}))
same  = n,Hangup()

; 2000-2999 = interne SIP-Telefone direkt anrufen.
exten = _2XXX,1,Dial(PJSIP/${EXTEN},30,tT)
exten = _2XXX,n,Hangup()

; 3HHWWP = persoenliche Nummern (Haus, Wohnung, Person). pbx_person.py setzt
; PERSON_DIAL (alle Geraete mit Sitzung der Person), Weiterleitung, Voicemail.
exten = _3XXXXX,1,NoOp(Person ${EXTEN})
same  = n,AGI(pbx_person.py,${EXTEN},${CHANNEL(endpoint)})
same  = n,GotoIf($["${PERSON_OK}" != "1"]?nf)
same  = n,GotoIf($["${WL_MODUS}" = "immer"]?wl)
same  = n,GotoIf($["${PERSON_DIAL}" = ""]?nichtda)
same  = n,Set(KLINGELN=${IF($["${WL_MODUS}" = "nicht_erreichbar"]?${WL_SEK}:30)})
same  = n,Dial(${PERSON_DIAL},${KLINGELN},tT)
same  = n(nichtda),GotoIf($["${WL_MODUS}" = "nicht_erreichbar"]?wl)
same  = n,GotoIf($["${PERSON_VM}" = "1"]?vm)
same  = n,Playback(vm-nobodyavail)
same  = n,Hangup()
same  = n(wl),NoOp(Weiterleitung ${EXTEN} -> ${WL_ZIEL})
same  = n,Dial(PJSIP/${WL_ZIEL}@peoplefone,60,tT)
same  = n,GotoIf($["${PERSON_VM}" = "1" & "${DIALSTATUS}" != "ANSWER"]?vm)
same  = n,Hangup()
; Hat nichts geklingelt (kein Geraet erreichbar), zuerst kurz Freizeichen —
; sonst springt der Anruf ohne einen Ton in die Voicemail.
same  = n(vm),GotoIf($["${DIALSTATUS}" = "NOANSWER"]?vmjetzt)
same  = n,Ringing()
same  = n,Wait(6)
same  = n(vmjetzt),Goto(voicemail-person,${EXTEN},1)
same  = n(nf),Playback(pbx-invalid)
same  = n,Hangup()

; 4XXX = Hausverwaltung (heute Immosense): 4000 Hauptnummer, 4001... Mitarbeiter.
exten = _4XXX,1,AGI(pbx_verwaltung.py,${EXTEN})
same  = n,GotoIf($["${VERW_ZIEL}" = ""]?nf)
same  = n,Dial(PJSIP/${VERW_ZIEL}@peoplefone,60,tT)
same  = n,Hangup()
same  = n(nf),Playback(pbx-invalid)
same  = n,Hangup()

; Ausgehend ueber peoplefone (CH 0..., international +.../00...).
exten = _0Z.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _0Z.,n,Hangup()
exten = _+X.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _+X.,n,Hangup()
exten = _00X.,1,Dial(PJSIP/${EXTEN}@peoplefone,60,tT)
exten = _00X.,n,Hangup()

[ring-person]
; Ring-Group-Mitglied mit persoenlicher Nummer (Stefan 25.11.2026): klingelt auf allen Geraeten
; der Person; ihre Weiterleitung aufs Handy gilt ("immer" sofort, "nicht erreichbar" nach
; WL_SEK bzw. wenn kein Geraet da ist). KEINE persoenliche Voicemail: sonst naehme die Box des
; Mitglieds den Anruf an und die anderen Mitglieder klingelten nicht mehr. Die Dauer begrenzt
; das Dial() der Ring-Group (Local/.../n).
exten = _3XXXXX,1,NoOp(Ring-Group Person ${EXTEN})
same  = n,AGI(pbx_person.py,${EXTEN},)
same  = n,GotoIf($["${PERSON_OK}" != "1"]?ende)
same  = n,GotoIf($["${WL_MODUS}" = "immer"]?wl)
same  = n,GotoIf($["${PERSON_DIAL}" = ""]?nichtda)
same  = n,Dial(${PERSON_DIAL},${IF($["${WL_MODUS}" = "nicht_erreichbar"]?${WL_SEK}:600)})
same  = n(nichtda),GotoIf($["${WL_MODUS}" = "nicht_erreichbar"]?wl:ende)
same  = n(wl),GotoIf($["${WL_ZIEL}" = ""]?ende)
same  = n,Dial(PJSIP/${WL_ZIEL}@peoplefone,600)
same  = n(ende),Hangup()

[voicemail-person]
; Persoenliche Voicemail einer 3HHWWP-Nummer. Bleibt auf der Anlage und gehoert
; nur der Person (Rosenweg Telefon zeigt sie im Verlauf) — NICHT voicemail-ai,
; das schickt an die Technik-Gruppe.
exten = h,1,AGI(pbx_log_call_event.py,cdr,${CDR(src)}^${CDR(dst)}^${CDR(disposition)}^${CDR(billsec)}^${CDR(start)}^${UNIQUEID})
exten = _3XXXXX,1,Set(VM_NUMMER=${EXTEN})
same  = n,Answer()
same  = n,Set(VM_FILE=/var/spool/asterisk/voicemail/personen/${EXTEN}-${UNIQUEID})
same  = n,Playback(vm-isunavail)
same  = n,Playback(vm-intro)
same  = n,Record(${VM_FILE}.wav,3,120,k)
same  = n,Playback(vm-goodbye)
same  = n,Hangup()
; Auch beim Auflegen waehrend der Aufnahme eintragen (Record endet dann ohne Weiter).
exten = h,2,AGI(pbx_voicemail_person.py,${VM_NUMMER},${VM_FILE}.wav,${UNIQUEID},${CALLERID(num)})


; Telefon suchen (24.11.2026): POST /api/telefon/<ext>/suchen ruft ein Telefon mit
; 2099 "Telefon suchen" an; die Geraete-App klingelt dafuer mit voller Lautstaerke.
; Nimmt jemand ab, hoert er einen Ton, dann ist Schluss.
[suchen]
exten => s,1,Playback(beep)
 same => n,Wait(1)
 same => n,Hangup()

[geteilt]
; Geteilte Telefone (sip_extensions.context = 'geteilt', z.B. 2002). Wer
; telefonieren will, meldet sich in der App „Rosenweg Telefon" an: Code am
; Geraet, Bestaetigung mit Authentik auf pbx.rosenweg4303.ch/telefon.
; Ohne Anmeldung gehen nur Notrufe — sonst nichts, auch kein Echotest. Das
; SIP-Passwort auf dem Geraet allein oeffnet also nichts. Mit Anmeldung geht es mit dem Namen der
; Person weiter in [internal].
exten = h,1,AGI(pbx_log_call_event.py,cdr,${CDR(src)}^${CDR(dst)}^${CDR(disposition)}^${CDR(billsec)}^${CDR(start)}^${UNIQUEID})

; Notrufe immer, auch ohne Anmeldung. (Android waehlt sie meist ueber das
; Mobilfunkmodem; das hier greift, wenn ein Notruf doch ueber SIP kommt.)
exten = 112,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 117,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 118,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 144,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 143,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 147,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)


exten = _[0-9*+#].,1,AGI(pbx_telefon_sitzung.py,${CHANNEL(endpoint)})
same  = n,GotoIf($["${TELEFON_NAME}" = ""]?gesperrt)
same  = n,Set(CALLERID(name)=${TELEFON_NAME})
; Intern ruft die Person mit ihrer persoenlichen Nummer an (Rueckruf erreicht sie,
; nicht das Geraet). Extern bleibt die Nummer des Trunks, nur der Name geht mit.
same  = n,ExecIf($["${TELEFON_NUMMER}" != "" & ${REGEX("^[1-4][0-9]{3,5}$" ${EXTEN})}]?Set(CALLERID(num)=${TELEFON_NUMMER}))
same  = n,Goto(internal,${EXTEN},1)
same  = n(gesperrt),Answer()
same  = n,Playback(ss-noservice)
same  = n,Hangup()


[person]
; Persoenliches SIP-Konto in Rosenweg Telefon (pbx-api: telefon_sip_person). Den
; Endpunkt <nummer>-<geraet> gibt es nur, solange die Person am Geraet angemeldet
; ist; die Caller-ID "Name <3HHWWP>" setzt pjsip_phones.conf. Intern ruft die
; Person also mit ihrer persoenlichen Nummer an, extern geht wie bei [geteilt]
; die Nummer des Trunks hinaus (peoplefone from_user), der Name geht mit.
exten = h,1,AGI(pbx_log_call_event.py,cdr,${CDR(src)}^${CDR(dst)}^${CDR(disposition)}^${CDR(billsec)}^${CDR(start)}^${UNIQUEID})

; Notrufe wie in [geteilt] (Android waehlt sie ohnehin uebers Modem).
exten = 112,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 117,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 118,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 144,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 143,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)
exten = 147,1,Dial(PJSIP/${EXTEN}@peoplefone,,tT)

exten = _[0-9*+#].,1,NoOp(Persoenlich ${CALLERID(num)} -> ${EXTEN})
same  = n,Goto(internal,${EXTEN},1)
