; Asterisk Manager Interface (AMI) — wird vom Rosenweg-API genutzt fuer
; Test-Outbound + Trunk-Status-Abfrage. Bindet nur an LAN-Netz, nicht WAN.

[general]
enabled = yes
bindaddr = 0.0.0.0
port = 5038
displayconnects = no

[rosenweg]
secret = ROSENWEG_AMI_PLACEHOLDER
deny = 0.0.0.0/0.0.0.0
permit = 100.64.0.0/255.252.0.0
read = system,call,reporting,command
write = system,call,originate,command
