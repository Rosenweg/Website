; Asterisk Manager Interface (AMI) — genutzt von der lokalen PBX-API (CT 220)
; fuer Trunk-Status + Test-Outbound + Konferenz. Bindet nur an LAN, nicht WAN.
;
; Haertung 17.11.2026 (D-6): AMI darf Anrufe ausloesen (originate) und
; CLI-Befehle ausfuehren (command). Darum nur genau die zwei bekannten
; Aufrufer zulassen statt des ganzen 100.64.0.0/14:
;   127.0.0.1    PBX-API in CT 220 (pbx/api/ami.py)
;   100.64.2.52  Haupt-API (core-backend CT 128, api/server.js amiCommand)
; bindaddr bleibt 0.0.0.0, weil beide Wege (lokal + LAN) gebraucht werden und
; Asterisk nur EINE Bindeadresse kennt; die ACL unten sperrt alle anderen.
; Zusaetzlich empfohlen (Betrieb): 5038 in der CT-Firewall nur fuer .52 oeffnen.
; Das Secret ist ein PLATZHALTER — der echte Wert steht nur in CT 220
; (/etc/asterisk/manager.conf) und als PBX_AMI_SECRET in der Haupt-API.
; Beim Ausrollen dieser Datei den Platzhalter NICHT uebernehmen.

[general]
enabled = yes
bindaddr = 0.0.0.0
port = 5038
displayconnects = no

[rosenweg]
secret = ROSENWEG_AMI_PLACEHOLDER
deny = 0.0.0.0/0.0.0.0
; WICHTIG: localhost muss erlaubt sein — die PBX-API (ami.py) verbindet von
; 127.0.0.1. Ohne diese Zeile lehnt die ACL den lokalen Login ab und Asterisk
; meldet faelschlich "Authentication failed" (unabhaengig vom Secret).
permit = 127.0.0.1/255.255.255.255
permit = 100.64.2.52/255.255.255.255
read = system,call,reporting,command
write = system,call,originate,command
