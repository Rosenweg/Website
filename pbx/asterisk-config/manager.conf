; Asterisk Manager Interface (AMI) — genutzt von der lokalen PBX-API (CT 220)
; fuer Trunk-Status + Test-Outbound + Konferenz. Bindet nur an LAN, nicht WAN.

[general]
enabled = yes
bindaddr = 0.0.0.0
port = 5038
displayconnects = no

[rosenweg]
secret = ROSENWEG_AMI_PLACEHOLDER
deny = 0.0.0.0/0.0.0.0
permit = 100.64.0.0/255.252.0.0
; WICHTIG: localhost muss erlaubt sein — die PBX-API (ami.py) verbindet von
; 127.0.0.1. Ohne diese Zeile lehnt die ACL den lokalen Login ab und Asterisk
; meldet faelschlich "Authentication failed" (unabhaengig vom Secret).
permit = 127.0.0.1/255.255.255.255
read = system,call,reporting,command
write = system,call,originate,command
