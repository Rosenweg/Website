; ============================================================
; PJSIP-Konfiguration fuer peoplefone-Trunk
;
; Die meisten Werte werden via Environment-Variablen aus
; docker-stack.yml gefuellt (entrypoint substituiert PJSIP_*).
; Falls Variablen leer sind, kommentieren wir Trunk-Registration
; per "?" Default — Asterisk startet trotzdem ohne Outbound-Reg.
; ============================================================

[global]
type = global
endpoint_identifier_order = ip,username,anonymous
debug = no

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${EXTERNAL_IP:-100.64.2.27}
external_signaling_address = ${EXTERNAL_IP:-100.64.2.27}
local_net = 100.64.0.0/12
local_net = 10.0.0.0/8

; ---- Trunk-Definition: peoplefone -----------------------------
; peoplefone SIP-Server: sip.peoplefone.ch (Default)
; Username + Password muessen via ENV / Secrets gesetzt sein

[peoplefone_registration]
type = registration
transport = transport-udp
outbound_auth = peoplefone_auth
server_uri = sip:${PJSIP_SERVER:-sip.peoplefone.ch}
client_uri = sip:${PJSIP_USER}@${PJSIP_SERVER:-sip.peoplefone.ch}
retry_interval = 60
forbidden_retry_interval = 600
expiration = 3600

[peoplefone_auth]
type = auth
auth_type = userpass
username = ${PJSIP_USER}
password = ${PJSIP_PASS}

[peoplefone_aor]
type = aor
contact = sip:${PJSIP_SERVER:-sip.peoplefone.ch}
qualify_frequency = 60

[peoplefone]
type = endpoint
transport = transport-udp
context = inbound
disallow = all
allow = opus
allow = g722
allow = alaw
allow = ulaw
outbound_auth = peoplefone_auth
aors = peoplefone_aor
from_user = ${PJSIP_USER}
from_domain = ${PJSIP_SERVER:-sip.peoplefone.ch}
direct_media = no
rewrite_contact = yes
force_rport = yes

[peoplefone-identify]
type = identify
endpoint = peoplefone
match = ${PJSIP_SERVER:-sip.peoplefone.ch}

; ---- Interne SIP-Telefone (LAN/VPN) -----------------------------
; Endpoint/Auth/AOR pro Extension werden von der PBX-API aus der
; sip_extensions-Tabelle generiert und hierher inkludiert. Datei wird
; per 'pjsip reload' aktiv. Existiert sie noch nicht, ignoriert Asterisk
; das #include (Warnung, kein Fehler).
; Telefone registrieren auf udp/5060 der CT-220-IP (100.64.2.55) — nur im
; LAN/VPN erreichbar, kein Internet-Expose.
#include pjsip_phones.conf
