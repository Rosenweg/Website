#!/usr/sbin/nft -f
# Firewall der adb-zentrale, im Container selbst (wie vm-gateway).
# Einspielen: install -m 0644 nftables.conf /etc/nftables.conf
#             nft -c -f /etc/nftables.conf && systemctl enable --now nftables
# Adressen des Hauses stehen nicht hier (oeffentliches Repo), sondern in
# /etc/adb-zentrale/nft-adressen.conf (Vorlage: nft-adressen.beispiel.conf).
#
# Der Tunnel selbst braucht diese Regeln nicht (Netzstapel im Prozess, kein
# Weiterleiten). Sie begrenzen, was der CT annimmt und wohin er darf.

flush ruleset

# definiert PBX, DNS, SSH4, PORTAL, APT
include "/etc/adb-zentrale/nft-adressen.conf"

define WG_PORT = 51832                               # = ZW_WG_PORT, Tunnel der Telefone

table inet adbz {
	chain ein {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
		icmp type echo-request limit rate 10/second accept

		udp dport $WG_PORT counter accept                    # Telefone, von ueberall (UniFi-Weiterleitung)
		ip saddr $PBX tcp dport 8080 counter accept          # Steuerung nur von der pbx-api
		ip saddr $SSH4 tcp dport 22 counter accept           # Technik (SSH-Zugriffsmatrix)

		counter limit rate 5/minute log prefix "adbz-ein-weg: " level info
	}

	chain weiter {
		type filter hook forward priority filter; policy drop;
	}

	chain aus {
		type filter hook output priority filter; policy drop;

		oif "lo" accept
		ct state established,related accept

		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept

		# WireGuard antwortet den Telefonen von seinem Port aus (wechselnde Adressen)
		udp sport $WG_PORT accept

		ip daddr $DNS udp dport 53 accept
		ip daddr $DNS tcp dport 53 accept
		ip daddr $PBX tcp dport 8095 accept                  # pbx-api: Peers holen, Sitzungen melden
		ip daddr $PORTAL tcp dport 443 accept                # SSH-Konten und Schluessel aus dem Portal (docs/ssh-zugang.md)
		ip daddr $APT tcp dport { 80, 443, 3142 } accept     # Pakete (Sicherheitsupdates)
		udp dport 123 accept                                 # Zeit

		counter limit rate 5/minute log prefix "adbz-aus-weg: " level info
		reject
	}
}
