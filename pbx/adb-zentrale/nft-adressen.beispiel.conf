# Adressen fuer nftables.conf der adb-zentrale. Im CT als
# /etc/adb-zentrale/nft-adressen.conf ablegen und die Beispielwerte
# (Doku-Bereich 192.0.2.0/24) durch die echten ersetzen.
# Aendert sich eine Adresse: Datei anpassen, dann systemctl reload nftables.

define PBX      = 192.0.2.55                         # CT 220 (pbx-api: Steuerung 8080 hinein, 8095 hinaus)
define DNS      = 192.0.2.1                          # DNS-Server des Servernetzes
define SSH4     = { 192.0.2.0/24 }                   # woher SSH kommen darf (Technik-Netz, Sprunghost)
define PORTAL   = { 192.0.2.90 }                     # www.rosenweg4303.ch fuer rw-authorized-keys / rw-konten-sync (443)
define APT      = { 192.0.2.80 }                     # Paketquelle bzw. Proxy fuer apt (leer lassen: { 192.0.2.255 })
