<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heizungsraum R9 · Operator</title>
<script src="/lib/js/socket.io.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', system-ui, sans-serif; background:#0b1220; color:#dbe4f0; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:.5rem 1rem; background:linear-gradient(90deg,#13203a,#0e1830); border-bottom:1px solid #1e3a5f; }
  .bar .ttl { font-weight:600; font-size:1.05rem; letter-spacing:.02em; }
  .bar .ttl small { display:block; font-weight:400; font-size:.72rem; opacity:.6; }
  .bar .rt { display:flex; align-items:center; gap:1rem; font-variant-numeric:tabular-nums; }
  .conn { font-size:.78rem; padding:.2rem .6rem; border-radius:999px; background:#1e2b45; }
  .conn .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:.35rem; background:#f59e0b; vertical-align:middle; }
  .conn.ok .dot { background:#22c55e; } .conn.off .dot { background:#ef4444; }
  .clk { font-size:1rem; opacity:.85; }
  .wrap { padding:.6rem; }
  svg { width:100%; height:auto; display:block; max-height:calc(100vh - 60px); }
  .lbl { fill:#8aa0bd; font-size:13px; }
  .unit { fill:#6b809e; font-size:12px; }
  .val { fill:#eaf2ff; font-weight:700; font-variant-numeric:tabular-nums; }
  .card { fill:#101c33; stroke:#21385c; stroke-width:1.5; }
  .cardttl { fill:#9fb4d2; font-size:13px; font-weight:600; }
  .pipe { stroke:#3b5a86; stroke-width:6; fill:none; stroke-linecap:round; }
  .lead { stroke:#3b5a86; stroke-width:1.5; stroke-dasharray:3 3; }
</style>
</head>
<body>
  <div class="bar">
    <div class="ttl">Heizungsraum · Rosenweg 9<small>Operator-Ansicht · STWEG3</small></div>
    <div class="rt">
      <span class="clk" id="clk">–</span>
      <span class="conn" id="conn"><span class="dot"></span><span id="conn-t">verbinde…</span></span>
    </div>
  </div>
  <div class="wrap">
  <svg id="hmi" viewBox="0 0 1000 620" role="img" aria-label="Anlagenschema Heizungsraum">
    <defs>
      <linearGradient id="tankgrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="g-top" offset="0" stop-color="#b45309"/>
        <stop id="g-bot" offset="1" stop-color="#1d4ed8"/>
      </linearGradient>
      <radialGradient id="heatglow"><stop offset="0" stop-color="#fb923c" stop-opacity="1"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>

    <!-- ===== Kombispeicher ===== -->
    <text x="430" y="92" class="lbl" font-size="15" font-weight="600">Kombispeicher</text>
    <!-- Rohre -->
    <path class="pipe" d="M 430 130 V 70 H 250"/>
    <text x="244" y="64" class="lbl" text-anchor="end">Heizung / WW (Vorlauf)</text>
    <path class="pipe" d="M 540 130 V 96 H 250"/>
    <text x="244" y="100" class="lbl" text-anchor="end">Rücklauf</text>
    <!-- Tankkörper -->
    <rect x="400" y="130" width="170" height="420" rx="26" fill="url(#tankgrad)"/>
    <rect x="400" y="130" width="170" height="420" rx="26" fill="none" stroke="#33507e" stroke-width="2.5"/>
    <!-- Heizstab-Glow + Spirale -->
    <circle id="heiz-glow" cx="485" cy="500" r="70" fill="url(#heatglow)" opacity="0"/>
    <path id="heiz-coil" d="M 430 486 h 110 M 430 500 h 110 M 430 514 h 110" stroke="#7a8aa3" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Sensoren oben/unten -->
    <circle cx="570" cy="190" r="6" fill="#eaf2ff" stroke="#0b1220" stroke-width="1.5"/>
    <line class="lead" x1="576" y1="190" x2="648" y2="190"/>
    <circle cx="570" cy="470" r="6" fill="#eaf2ff" stroke="#0b1220" stroke-width="1.5"/>
    <line class="lead" x1="576" y1="470" x2="648" y2="470"/>

    <!-- Temp-Faceplate oben -->
    <rect x="648" y="158" width="150" height="64" rx="8" class="card"/>
    <text x="662" y="180" class="cardttl">🌡️ Speicher oben</text>
    <text x="662" y="210" class="val" font-size="26"><tspan id="t-oben">–</tspan><tspan class="unit" dx="4">°C</tspan></text>
    <!-- Temp-Faceplate unten -->
    <rect x="648" y="438" width="150" height="64" rx="8" class="card"/>
    <text x="662" y="460" class="cardttl">🌡️ Speicher unten</text>
    <text x="662" y="490" class="val" font-size="26"><tspan id="t-unten">–</tspan><tspan class="unit" dx="4">°C</tspan></text>

    <!-- Heizstab-Faceplate -->
    <rect x="648" y="300" width="150" height="78" rx="8" class="card"/>
    <text x="662" y="322" class="cardttl">⚡ Heizstab (PV)</text>
    <circle id="heiz-ind" cx="772" cy="316" r="6" fill="#475569"/>
    <text x="662" y="350" class="val" font-size="24"><tspan id="heiz-pow">–</tspan><tspan class="unit" dx="4">kW</tspan></text>
    <text x="662" y="370" id="heiz-state" class="lbl" font-size="13">–</text>

    <!-- ===== rechte Spalte: Faceplates ===== -->
    <!-- Lüfter -->
    <rect x="832" y="158" width="150" height="90" rx="8" class="card"/>
    <text x="846" y="180" class="cardttl">🌀 Lüfter Heizraum</text>
    <circle id="luf-ind" cx="956" cy="174" r="6" fill="#475569"/>
    <text x="846" y="210" id="luf-state" class="val" font-size="22">–</text>
    <text x="846" y="234" class="lbl" font-size="13"><tspan id="luf-pow">–</tspan><tspan class="unit" dx="3">W</tspan></text>

    <!-- Gaswarner -->
    <rect x="832" y="262" width="150" height="90" rx="8" class="card"/>
    <text x="846" y="284" class="cardttl">🟢 Gaswarner</text>
    <circle id="gas-ind" cx="956" cy="278" r="6" fill="#475569"/>
    <text x="846" y="314" id="gas-state" class="val" font-size="20">–</text>
    <text x="846" y="338" class="lbl" font-size="13"><tspan id="gas-ppm">–</tspan><tspan class="unit" dx="3">ppm</tspan></text>

    <!-- Raumklima -->
    <rect x="832" y="366" width="150" height="90" rx="8" class="card"/>
    <text x="846" y="388" class="cardttl">🌡️ Raumklima</text>
    <text x="846" y="420" class="val" font-size="22"><tspan id="kl-t">–</tspan><tspan class="unit" dx="3">°C</tspan></text>
    <text x="846" y="444" class="lbl" font-size="14"><tspan id="kl-h">–</tspan><tspan class="unit" dx="3">% rH</tspan></text>

    <text x="20" y="600" class="unit" id="foot">Live via ioBroker socket.io</text>
  </svg>
  </div>

<script>
  var $ = function(id){ return document.getElementById(id); };
  var IDS = {
    toben:  'shelly.0.shellyplus1pm#80646fe14b60#1.Ext.temperature100C',
    tunten: 'shelly.0.shellyplus1pm#80646fe14b60#1.Ext.temperature101C',
    heiz:   'mqtt.0.energy.r9.heizstab.power_w',
    lufP:   'shelly.0.shellyplus1pm#cc7b5c82c974#1.Relay0.Power',
    lufOn:  'shelly.0.shellyplus1pm#cc7b5c82c974#1.Relay0.Switch',
    gas:    'shelly.0.SHGS-1#3C6105F68C94#1.Gas.AlarmState',
    gasppm: 'shelly.0.SHGS-1#3C6105F68C94#1.Gas.Concentration',
    klT:    'shelly.0.shellyplusht#08b61fccf7a0#1.Temperature0.Celsius',
    klH:    'shelly.0.shellyplusht#08b61fccf7a0#1.Humidity0.Relative'
  };
  var REV = {}; Object.keys(IDS).forEach(function(k){ REV[IDS[k]] = k; });
  var V = {};

  function num(x){ var n = Number(x); return isFinite(n) ? n : null; }
  // Temperatur -> Farbe (20°C blau .. 45 türkis .. 60 orange .. 75 rot)
  function tcol(t){
    if (t == null) return '#475569';
    var stops = [[20,'#2563eb'],[40,'#06b6d4'],[55,'#f59e0b'],[75,'#dc2626']];
    if (t <= stops[0][0]) return stops[0][1];
    if (t >= stops[stops.length-1][0]) return stops[stops.length-1][1];
    for (var i=0;i<stops.length-1;i++){
      if (t >= stops[i][0] && t <= stops[i+1][0]){
        var f=(t-stops[i][0])/(stops[i+1][0]-stops[i][0]);
        return mix(stops[i][1], stops[i+1][1], f);
      }
    }
    return '#475569';
  }
  function mix(a,b,f){
    var x=parseInt(a.slice(1),16), y=parseInt(b.slice(1),16);
    var r=(x>>16)+(((y>>16)-(x>>16))*f), g=((x>>8)&255)+((((y>>8)&255)-((x>>8)&255))*f), c=(x&255)+(((y&255)-(x&255))*f);
    return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(c)).toString(16).slice(1);
  }

  function render(){
    var to=num(V.toben), tu=num(V.tunten);
    $('t-oben').textContent  = to!=null ? to.toFixed(1) : '–';
    $('t-unten').textContent = tu!=null ? tu.toFixed(1) : '–';
    $('g-top').setAttribute('stop-color', tcol(to));
    $('g-bot').setAttribute('stop-color', tcol(tu));

    var hp=num(V.heiz); // W
    var active = hp!=null && hp > 50;
    $('heiz-pow').textContent = hp!=null ? (hp/1000).toFixed(2) : '–';
    $('heiz-glow').setAttribute('opacity', active ? '0.9' : '0');
    $('heiz-coil').setAttribute('stroke', active ? '#fb923c' : '#7a8aa3');
    $('heiz-ind').setAttribute('fill', active ? '#fb923c' : '#475569');
    $('heiz-state').textContent = hp==null ? '–' : (active ? 'AKTIV · PV-Überschuss' : 'aus');

    var lon = (V.lufOn===true||V.lufOn==='true'||V.lufOn===1);
    $('luf-state').textContent = (V.lufOn==null) ? '–' : (lon ? 'EIN' : 'AUS');
    $('luf-state').setAttribute('fill', lon ? '#22c55e' : '#8aa0bd');
    $('luf-ind').setAttribute('fill', lon ? '#22c55e' : '#475569');
    var lp=num(V.lufP); $('luf-pow').textContent = lp!=null ? lp.toFixed(1) : '–';

    var ga = V.gas; var alarm = (ga!=null && String(ga).toLowerCase()!=='none' && ga!=='' );
    $('gas-state').textContent = ga==null ? '–' : (alarm ? 'ALARM' : 'NORMAL');
    $('gas-state').setAttribute('fill', ga==null ? '#8aa0bd' : (alarm ? '#ef4444' : '#22c55e'));
    $('gas-ind').setAttribute('fill', ga==null ? '#475569' : (alarm ? '#ef4444' : '#22c55e'));
    var gp=num(V.gasppm); $('gas-ppm').textContent = gp!=null ? gp.toFixed(0) : '–';

    var kt=num(V.klT), kh=num(V.klH);
    $('kl-t').textContent = kt!=null ? kt.toFixed(1) : '–';
    $('kl-h').textContent = kh!=null ? kh.toFixed(0) : '–';
  }

  function setConn(state, txt){ var c=$('conn'); c.className='conn '+state; $('conn-t').textContent=txt; }
  function clock(){ $('clk').textContent = new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
  setInterval(clock, 1000); clock();

  // ===== ioBroker socket.io (web.0, anonym) =====
  var socket = io(location.origin, { path:'/socket.io', transports:['websocket','polling'], reconnection:true });
  socket.on('connect', function(){
    setConn('ok','live');
    Object.keys(IDS).forEach(function(k){
      var id = IDS[k];
      socket.emit('getState', id, function(err, st){ if (st){ V[k] = st.val; render(); } });
      socket.emit('subscribe', id);
    });
  });
  socket.on('stateChange', function(id, st){
    var k = REV[id]; if (!k || !st) return;
    V[k] = st.val; render();
  });
  socket.on('disconnect', function(){ setConn('off','getrennt'); });
  socket.on('connect_error', function(){ setConn('off','Fehler'); });
</script>
</body>
</html>
