      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Journal-Empfaenger
        uses: docker/build-push-action@v6
        with:
          context: ./journal-remote
          push: true
          tags: |
            ${{ env.JOURNAL_IMAGE }}:latest
            ${{ env.JOURNAL_IMAGE }}:${{ github.sha }}

  build-whatsapp-bot:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push WhatsApp-Bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./whatsapp-bot/Dockerfile
          push: true
          tags: |
            ${{ env.WHATSAPP_BOT_IMAGE }}:latest
            ${{ env.WHATSAPP_BOT_IMAGE }}:${{ github.sha }}

  build-shelly-emulator:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
