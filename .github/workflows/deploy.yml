name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rosenweg/rosenweg-api
  WEBSITE_IMAGE: ghcr.io/rosenweg/rosenweg-website
  ENERGY_IMAGE: ghcr.io/rosenweg/energy-collector
  SYSLOG_IMAGE: ghcr.io/rosenweg/syslog-collector
  WHATSAPP_BOT_IMAGE: ghcr.io/rosenweg/rosenweg-whatsapp-bot
  SHELLY_EMULATOR_IMAGE: ghcr.io/rosenweg/shelly-emulator
  ISP_IMAGE: ghcr.io/rosenweg/rosenweg-isp
  STWEG_IMAGE: ghcr.io/rosenweg/rosenweg-stweg

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  build-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
