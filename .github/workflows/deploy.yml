name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rosenweg/rosenweg-api
  WEBSITE_IMAGE: ghcr.io/rosenweg/rosenweg-website
  ENERGY_IMAGE: ghcr.io/rosenweg/energy-collector
  SYSLOG_IMAGE: ghcr.io/rosenweg/syslog-collector
  TV_PROXY_IMAGE: ghcr.io/rosenweg/tv-proxy

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  build-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Website
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.WEBSITE_IMAGE }}:latest
            ${{ env.WEBSITE_IMAGE }}:${{ github.sha }}

  build-energy-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Energy Collector
        uses: docker/build-push-action@v6
        with:
          context: ./energy-collector
          push: true
          tags: |
            ${{ env.ENERGY_IMAGE }}:latest
            ${{ env.ENERGY_IMAGE }}:${{ github.sha }}

  build-syslog-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Syslog Collector
        uses: docker/build-push-action@v6
        with:
          context: ./syslog-collector
          push: true
          tags: |
            ${{ env.SYSLOG_IMAGE }}:latest
            ${{ env.SYSLOG_IMAGE }}:${{ github.sha }}

  build-tv-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TV Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./tv
          push: true
          tags: |
            ${{ env.TV_PROXY_IMAGE }}:latest
            ${{ env.TV_PROXY_IMAGE }}:${{ github.sha }}
