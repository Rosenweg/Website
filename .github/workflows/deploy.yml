name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rosenweg/rosenweg-api
  WEBSITE_IMAGE: ghcr.io/rosenweg/rosenweg-website
  ENERGY_IMAGE: ghcr.io/rosenweg/energy-collector
  SYSLOG_IMAGE: ghcr.io/rosenweg/syslog-collector
  JOURNAL_IMAGE: ghcr.io/rosenweg/journal-remote
  WHATSAPP_BOT_IMAGE: ghcr.io/rosenweg/rosenweg-whatsapp-bot
  SHELLY_EMULATOR_IMAGE: ghcr.io/rosenweg/shelly-emulator
  ISP_IMAGE: ghcr.io/rosenweg/rosenweg-isp
  STWEG_IMAGE: ghcr.io/rosenweg/rosenweg-stweg

jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  build-api:
    # GitHub-Runner: das API-Image darf nicht hinter den App-Builds auf den
    # eigenen Runnern warten (Sicherheitsfixes muessen sofort raus)
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  build-website:
    # eigene Runner (CT 140/145): nur push/workflow_dispatch, nie Fork-PRs
    runs-on: [self-hosted, Linux, rosenweg]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Website
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.WEBSITE_IMAGE }}:latest
            ${{ env.WEBSITE_IMAGE }}:${{ github.sha }}

  build-isp:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ISP frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.isp
          push: true
          tags: |
            ${{ env.ISP_IMAGE }}:latest
            ${{ env.ISP_IMAGE }}:${{ github.sha }}

  build-stweg:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push STWEG frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.stweg
          push: true
          tags: |
            ${{ env.STWEG_IMAGE }}:latest
            ${{ env.STWEG_IMAGE }}:${{ github.sha }}

  build-energy-collector:
    # eigene Runner (CT 140/145): nur push/workflow_dispatch, nie Fork-PRs
    runs-on: [self-hosted, Linux, rosenweg]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Energy Collector
        uses: docker/build-push-action@v6
        with:
          context: ./energy-collector
          push: true
          tags: |
            ${{ env.ENERGY_IMAGE }}:latest
            ${{ env.ENERGY_IMAGE }}:${{ github.sha }}

  build-syslog-collector:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Syslog Collector
        uses: docker/build-push-action@v6
        with:
          context: ./syslog-collector
          push: true
          tags: |
