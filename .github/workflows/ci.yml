name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nur lesen: die Pruefung braucht keine Schreibrechte am Repo oder an Paketen.
permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check (eigene .js, ohne node_modules und *.min.js)
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            node --check "$f"
          done < <(find . -type f -name '*.js' -not -path '*/node_modules/*' -not -name '*.min.js' -print0)
          if [ "$found" -eq 0 ]; then
            echo "Keine JS-Dateien gefunden"; exit 1
          fi
          echo "✓ Syntax aller JS-Dateien OK"

      - name: JSON validieren (alle .json ausserhalb node_modules)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              || { echo "Ungueltiges JSON: $f"; exit 1; }
          done < <(find . -type f -name '*.json' -not -path '*/node_modules/*' -print0)
          echo "✓ Alle JSON-Dateien gueltig"

      - name: Abhaengigkeiten der Tests (castv2 fuer den Cast-Waechter, qrcode fuer die Kiosk-Kopplung)
        run: npm install --prefix api --no-save --no-package-lock --omit=dev castv2@0.1.10 qrcode@1.5.4

      - name: API-Tests ohne Datenbank (node --test api/test/)
        run: node --test api/test/

      - name: Kontakte-Sync (Verzeichnis ohne echte Nummern)
        run: python3 -m unittest discover -s contacts-sync -v

      - name: PBX-API (Kartenverwaltung ohne Geraet)
        run: |
          python3 -m venv "$RUNNER_TEMP/pbx"
          "$RUNNER_TEMP/pbx/bin/pip" install --quiet -r pbx/api/requirements.txt
          cd pbx/api && "$RUNNER_TEMP/pbx/bin/python" -m unittest test_karten_verwalter -v

      - name: Z-Push-Sicht je Konto (PHP, Befund F1-7)
        run: |
          php -l zpush/sicht.php
          php -l zpush/backend-rosenweg.php
          php zpush/test_sicht.php

  kerberos-pruefer:
    # Prueft Kerberos-Tickets der Agent-Anmeldung (api/kerberos-pruefer, Protokoll v2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/kerberos-pruefer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  edge-plugin:
    # Eigenes Traefik-Plugin (edge-traefik/plugins/echteip): Format, vet, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-traefik/plugins/echteip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
