name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nur lesen: die Pruefung braucht keine Schreibrechte am Repo oder an Paketen.
permissions:
  contents: read

jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  syntax-check:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    timeout-minutes: 20
    needs: wahl
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check (eigene .js, ohne node_modules und *.min.js)
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            node --check "$f"
          done < <(find . -type f -name '*.js' -not -path '*/node_modules/*' -not -name '*.min.js' -print0)
          if [ "$found" -eq 0 ]; then
            echo "Keine JS-Dateien gefunden"; exit 1
          fi
          echo "✓ Syntax aller JS-Dateien OK"

      - name: JSON validieren (alle .json ausserhalb node_modules)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              || { echo "Ungueltiges JSON: $f"; exit 1; }
          done < <(find . -type f -name '*.json' -not -path '*/node_modules/*' -print0)
          echo "✓ Alle JSON-Dateien gueltig"

      - name: Abhaengigkeiten der Tests (castv2 fuer den Cast-Waechter, qrcode fuer die Kiosk-Kopplung)
        run: npm install --prefix api --no-save --no-package-lock --omit=dev castv2@0.1.10 qrcode@1.5.4

      - name: API-Tests ohne Datenbank (node --test api/test/)
        # --test-force-exit: offene Timer (lib/auth.js u.a.) hielten den Lauf sonst ewig offen
        run: node --test --test-force-exit api/test/

      - name: Kontakte-Sync (Verzeichnis ohne echte Nummern)
        run: python3 -m unittest discover -s contacts-sync -v

      - name: PBX-API (Kartenverwaltung ohne Geraet, Fernwartung ohne Zentrale)
        run: |
          python3 -m venv "$RUNNER_TEMP/pbx"
          "$RUNNER_TEMP/pbx/bin/pip" install --quiet -r pbx/api/requirements.txt
          cd pbx/api && "$RUNNER_TEMP/pbx/bin/python" -m unittest test_karten_verwalter test_apps_stand test_fernwartung test_nextcloud_zugang test_hintergrund -v

      # Eigene Runner haben php-cli aus Debian (CT 140/145); setup-php braucht sudo
      # und laeuft darum nur auf GitHub-Runnern.
      - uses: shivammathur/setup-php@v2
        if: runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          coverage: none

      - name: Z-Push-Sicht je Konto (PHP, Befund F1-7)
        run: |
          php -l zpush/sicht.php
          php -l zpush/backend-rosenweg.php
          php zpush/test_sicht.php

  kerberos-pruefer:
    # Prueft Kerberos-Tickets der Agent-Anmeldung (api/kerberos-pruefer, Protokoll v2)
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    timeout-minutes: 15
    needs: wahl
    defaults:
      run:
        working-directory: api/kerberos-pruefer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  adb-zentrale:
    # Endpunkt des adb-Tunnels der geteilten Telefone (pbx/adb-zentrale): Format, vet, Tests
    # mit echtem WireGuard-Handshake (Netzstapel im Prozess, kein Root noetig), Skripte
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    timeout-minutes: 15
    needs: wahl
    defaults:
      run:
        working-directory: pbx/adb-zentrale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pbx/adb-zentrale/go.mod
          cache-dependency-path: pbx/adb-zentrale/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: for f in setup.sh rw-adb rw-adb-intern ../../scripts/geteiltes-telefon-einrichten.sh; do bash -n "$f"; done

  edge-plugin:
    # Eigenes Traefik-Plugin (edge-traefik/plugins/echteip): Format, vet, Tests
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    timeout-minutes: 15
    needs: wahl
    defaults:
      run:
        working-directory: edge-traefik/plugins/echteip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
