# TLS mit Pflicht-Client-Zertifikat (Stations-CA), weiter an journal-remote.
server {
    listen 19532 ssl;
    listen [::]:19532 ssl;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_client_certificate /tls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    # journal-upload schickt einen endlosen Strom (chunked) — nicht puffern,
    # keine Grössengrenze, lange Zeitlimits.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_body_timeout 1h;

    location = /upload {
        proxy_pass http://127.0.0.1:19531;
        # Wer sendet, steht im Zertifikat (CN = Stations-ID); fürs Protokoll.
        proxy_set_header X-Station $ssl_client_s_dn;
    }
    location / { return 404; }
}
