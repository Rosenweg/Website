server {
    listen 80;
    server_name isp.rosenweg4303.ch localhost;

    root /usr/share/nginx/html;
    index isp.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # TV7-Stream-Proxy direkt zum tv7-streamer (LXC 250 @ 100.64.9.250:3000).
    # Bewusst NICHT durch die API — der MPEG-TS-Stream wird in nginx zero-copy
    # gepiped, Node.js wuerde nur Buffer-Latenz addieren und Ruckeln verursachen.
    # Auth: HMAC-Token in der URL (?token=...), generiert vom API-Endpoint
    # /api/tv/stream-url und vom Streamer selbst verifiziert.
    location ^~ /tv-stream/ {
        # /tv-stream/<id>?token=...  →  http://100.64.9.250:3000/stream/<id>?token=...
        rewrite ^/tv-stream/(.*)$ /stream/$1 break;
        proxy_pass http://100.64.9.250:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 100.64.9.250:3000;
        # Streaming: KEIN Buffering — nginx soll Chunks sofort weiterreichen.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        # Stream-Verbindung darf beliebig lange laufen
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # (Multicast-M3U laeuft ueber /api/tv/playlist.m3u — die API generiert sie,
    # weil die ISP-nginx den Streamer im RK-Clients-VLAN nicht erreicht.)

    # API-Proxy zur geteilten rosenweg_api (gleicher Docker-Overlay).
    # X-Forwarded-Proto hardcoded auf "https" — isp.rosenweg4303.ch ist
    # ausschliesslich per HTTPS ueber CF Tunnel erreichbar, der intern
    # mit HTTP zur Origin spricht (sonst wuerde die API http://-URLs
    # bauen und Authentik-OAuth-Callbacks scheitern).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Cache-Headers: HTML nicht cachen, JS/CSS/Bilder schon
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # Saubere URLs ohne .html: /isp-admin -> isp-admin.html
    location / {
        try_files $uri $uri.html $uri/ /isp.html;
    }
}

# Wallboard-Modus: noc.rosenweg4303.ch zeigt direkt das NOC-Fullscreen-Panel.
# DNS-only (kein CF), Route via Edge-Traefik. Read-only Metriken — kein PII.
server {
    listen 80;
    server_name noc.rosenweg4303.ch;

    root /usr/share/nginx/html;
    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /health { access_log off; return 200 'OK'; add_header Content-Type text/plain; }

    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto "https";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d; add_header Cache-Control "public, immutable" always;
    }
    # / -> NOC-Wallboard direkt
    location = / { rewrite ^ /noc-fullscreen.html last; }
    location / { try_files $uri /noc-fullscreen.html; }
}
