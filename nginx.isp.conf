# Bevorzuge externe X-Forwarded-Proto (CF Tunnel), sonst https — Default
# darf nicht 'http' sein weil isp.rosenweg4303.ch ausschliesslich ueber
# HTTPS erreichbar ist und die API daraus Callback-URLs baut.
map $http_x_forwarded_proto $fwd_proto {
    default "https";
    "~^(https?)$" $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name isp.rosenweg4303.ch localhost;

    root /usr/share/nginx/html;
    index isp.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # X-Forwarded-Proto: CF Tunnel terminiert HTTPS und reicht intern HTTP
    # weiter — $scheme waere "http" und der API-Service wuerde http://-URLs
    # bauen. Per map: bevorzuge die externe Forwarded-Proto, sonst https.
    # (Funktioniert auch fuer direkte interne Calls die kein Header setzen.)

    # API-Proxy zur geteilten rosenweg_api (gleicher Docker-Overlay).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Cache-Headers: HTML nicht cachen, JS/CSS/Bilder schon
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # Saubere URLs ohne .html: /isp-admin -> isp-admin.html
    location / {
        try_files $uri $uri.html $uri/ /isp.html;
    }
}
