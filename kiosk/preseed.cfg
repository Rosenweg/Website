# ============================================================================
# Rosenweg Kiosk - Debian Preseed Configuration
# ============================================================================
# Fully automated Debian 13 (Trixie) installation.
# The deploy key and setup script are injected into the ISO by build-iso.sh.
# After install, setup-kiosk.sh clones the private config repo and configures
# the kiosk system.
# ============================================================================

# --- Locale and keyboard ---
d-i debian-installer/locale string de_CH.UTF-8
d-i keyboard-configuration/xkb-keymap select ch
d-i console-setup/ask_detect boolean false

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rosenweg-kiosk
d-i netcfg/get_domain string local

# --- Mirror ---
d-i mirror/country string CH
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Clock ---
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Zurich
d-i clock-setup/ntp boolean true

# --- Partitioning (use entire disk, single partition) ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Root account (temporary, changed by setup script from config) ---
d-i passwd/root-login boolean true
d-i passwd/root-password password kiosk-install
d-i passwd/root-password-again password kiosk-install

# --- Skip normal user creation (setup script creates kiosk user) ---
d-i passwd/make-user boolean false

# --- Package selection (minimal + git/ssh for private repo access) ---
tasksel tasksel/first multiselect standard
d-i pkgsel/include string curl ca-certificates git openssh-client
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Bootloader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# --- Post-install: copy deploy key from initrd and run setup ---
d-i preseed/late_command string \
    in-target bash -c '\
        cp /deploy-key /root/deploy-key 2>/dev/null || true; \
        chmod 600 /root/deploy-key; \
        curl -fsSL https://raw.githubusercontent.com/Rosenweg/Website/main/kiosk/setup-kiosk.sh -o /root/setup-kiosk.sh && \
        chmod +x /root/setup-kiosk.sh && \
        /root/setup-kiosk.sh \
    '

# --- Finish ---
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
