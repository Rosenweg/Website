<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email-Versand-Protokoll — Rosenweg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/authentik-auth.js?v=2"></script>
    <script src="/js/nav.js?v=2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
        details > summary { cursor: pointer; list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
    <script>RosenwegNav.init({ active: 'emaillog' });</script>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <header class="mb-6 flex items-center justify-between flex-wrap gap-3">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Email-Versand-Protokoll</h1>
                <p class="text-sm text-gray-600">Alle ausgehenden System-Mails der letzten 90 Tage (max. 500 Einträge)</p>
            </div>
            <button id="refresh-btn" class="text-sm bg-gray-900 text-white px-3 py-1.5 rounded-lg hover:bg-gray-800">↻ Neu laden</button>
        </header>

        <section class="bg-white rounded-xl shadow-sm border p-4 mb-4">
            <form id="filter-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Trigger</label>
                    <select id="filter-trigger" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                        <option value="">— alle —</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Status</label>
                    <select id="filter-status" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                        <option value="">— alle —</option>
                        <option value="sent">sent</option>
                        <option value="failed">failed</option>
                        <option value="partial">partial</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Zeitraum</label>
                    <select id="filter-since" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                        <option value="">— uneingeschränkt —</option>
                        <option value="1">letzte 24h</option>
                        <option value="3">letzte 3 Tage</option>
                        <option value="7" selected>letzte 7 Tage</option>
                        <option value="30">letzte 30 Tage</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Suche (Betreff/Empfänger/Sender)</label>
                    <input id="filter-q" type="text" placeholder="z.B. Druckauftrag, name@..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                </div>
            </form>
        </section>

        <section id="result" class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div id="loading" class="p-8 text-center text-gray-500">Lade …</div>
            <div id="empty" class="p-8 text-center text-gray-500 hidden">Keine Einträge gefunden.</div>
            <div id="list-wrap" class="hidden overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 border-b text-xs uppercase tracking-wider text-gray-600">
                        <tr>
                            <th class="px-3 py-2 text-left">Zeit</th>
                            <th class="px-3 py-2 text-left">Trigger</th>
                            <th class="px-3 py-2 text-left">Von</th>
                            <th class="px-3 py-2 text-left">Empfänger</th>
                            <th class="px-3 py-2 text-left">Betreff</th>
                            <th class="px-3 py-2 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="list-body" class="divide-y"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
    (function() {
        const $ = id => document.getElementById(id);
        const triggerSel = $('filter-trigger'), statusSel = $('filter-status'), sinceSel = $('filter-since'), qInput = $('filter-q');
        const loading = $('loading'), empty = $('empty'), listWrap = $('list-wrap'), listBody = $('list-body');
        let debounce;

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }
        function fmtTime(s) {
            if (!s) return '—';
            const d = new Date(s);
            return d.toLocaleString('de-CH', { timeZone: 'Europe/Zurich', year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        const TRIGGER_COLORS = {
            'otp-login': 'bg-blue-100 text-blue-800',
            'wasch-billing': 'bg-cyan-100 text-cyan-800',
            'admin-direct-mail': 'bg-purple-100 text-purple-800',
            'verteiler-batch': 'bg-emerald-100 text-emerald-800',
            'verteiler-direct': 'bg-emerald-100 text-emerald-800',
            'verteiler-test': 'bg-emerald-50 text-emerald-700',
            'verteiler-bounce-not-allowed': 'bg-red-100 text-red-800',
            'verteiler-delivery-report': 'bg-teal-100 text-teal-800',
            'print-notification': 'bg-amber-100 text-amber-800',
            'print-failure': 'bg-red-100 text-red-800',
            'pickup-reminder': 'bg-orange-100 text-orange-800',
            'authentik-deletion-reminder': 'bg-rose-100 text-rose-800',
            'cleanup-stale-drucker-tags': 'bg-gray-100 text-gray-700',
        };
        function triggerBadge(t) {
            const cls = TRIGGER_COLORS[t] || 'bg-gray-100 text-gray-700';
            return `<span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${cls}">${escapeHtml(t || '—')}</span>`;
        }
        function statusBadge(s) {
            if (s === 'sent') return '<span class="inline-block px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-xs">✓ sent</span>';
            if (s === 'failed') return '<span class="inline-block px-2 py-0.5 rounded bg-red-100 text-red-800 text-xs">✗ failed</span>';
            if (s === 'partial') return '<span class="inline-block px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-xs">▲ partial</span>';
            return `<span class="inline-block px-2 py-0.5 rounded bg-gray-100 text-gray-700 text-xs">${escapeHtml(s || '—')}</span>`;
        }

        async function load() {
            loading.classList.remove('hidden');
            listWrap.classList.add('hidden');
            empty.classList.add('hidden');
            const params = new URLSearchParams();
            if (triggerSel.value) params.set('trigger', triggerSel.value);
            if (statusSel.value) params.set('status', statusSel.value);
            if (sinceSel.value) {
                const d = new Date(Date.now() - parseInt(sinceSel.value) * 86400000);
                params.set('since', d.toISOString());
            }
            if (qInput.value.trim()) params.set('q', qInput.value.trim());
            try {
                const r = await fetch('/api/email-log?' + params.toString(), { credentials: 'include' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();
                renderTriggers(data.triggers || []);
                renderEntries(data.entries || []);
            } catch (err) {
                listBody.innerHTML = '';
                empty.textContent = 'Fehler: ' + err.message;
                empty.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderTriggers(triggers) {
            const current = triggerSel.value;
            const opts = ['<option value="">— alle —</option>'];
            for (const t of triggers) {
                opts.push(`<option value="${escapeHtml(t.trigger)}">${escapeHtml(t.trigger)} (${t.cnt})</option>`);
            }
            triggerSel.innerHTML = opts.join('');
            triggerSel.value = current;
        }

        function renderEntries(entries) {
            if (entries.length === 0) {
                listBody.innerHTML = '';
                empty.classList.remove('hidden');
                empty.textContent = 'Keine Einträge gefunden.';
                return;
            }
            const html = entries.map(e => {
                const errorRow = e.error_message ? `<tr class="bg-red-50"><td colspan="6" class="px-3 py-2 text-xs text-red-800"><strong>Fehler:</strong> ${escapeHtml(e.error_message)}</td></tr>` : '';
                const idCell = e.message_id ? `<div class="text-xxs text-gray-400 mono mt-1" style="font-size:10px">${escapeHtml(e.message_id)}</div>` : '';
                const recipientCount = e.recipients_count > 1 ? ` <span class="text-xs text-gray-500">(${e.recipients_count})</span>` : '';
                return `<tr class="hover:bg-gray-50">
                    <td class="px-3 py-2 mono text-xs text-gray-700 whitespace-nowrap">${fmtTime(e.created_at)}</td>
                    <td class="px-3 py-2">${triggerBadge(e.trigger)}</td>
                    <td class="px-3 py-2 text-xs">${escapeHtml(e.from_name ? e.from_name + ' <' + e.from_email + '>' : (e.from_email || '—'))}</td>
                    <td class="px-3 py-2 text-xs"><div class="max-w-xs truncate" title="${escapeHtml(e.to_addresses || '')}">${escapeHtml(e.to_addresses || '—')}</div>${recipientCount}</td>
                    <td class="px-3 py-2 text-xs"><div class="max-w-md truncate" title="${escapeHtml(e.subject || '')}">${escapeHtml(e.subject || '—')}</div>${idCell}</td>
                    <td class="px-3 py-2 text-center">${statusBadge(e.status)}</td>
                </tr>${errorRow}`;
            }).join('');
            listBody.innerHTML = html;
            listWrap.classList.remove('hidden');
        }

        $('refresh-btn').addEventListener('click', load);
        triggerSel.addEventListener('change', load);
        statusSel.addEventListener('change', load);
        sinceSel.addEventListener('change', load);
        qInput.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(load, 300); });

        load();
    })();
    </script>
</body>
</html>
