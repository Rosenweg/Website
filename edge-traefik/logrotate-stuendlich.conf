# /etc/systemd/system/logrotate.timer.d/stuendlich.conf (Edge CT 245)
# logrotate laeuft sonst nur taeglich; "maxsize 100M" in /etc/logrotate.d/traefik
# greift aber nur, wenn logrotate laeuft. Das Shelly-Polling schreibt mehrere
# hundert MB pro Stunde ins Zugriffsprotokoll (18.11.2026: 3.4 GB an einem
# Vormittag) -> stuendlich pruefen. Logs mit "daily" rotieren weiter taeglich.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=1m
