# Ueber Cloudflare geleitete Anfragen: ClientHost ist eine Cloudflare-Adresse.
# Die echte Client-IP steht im Kopf Cf-Connecting-Ip (von Traefik mitgeloggt).
# Nur uebernehmen, wenn die Verbindung wirklich von Cloudflare kommt - sonst
# koennte jeder direkt verbindende Client fremde IPs vorschieben.
name: rosenweg/cf-echte-ip
description: "Echte Client-IP aus Cf-Connecting-Ip bei Cloudflare-Verbindungen"
filter: >-
  evt.Meta.log_type == 'http_access-log' &&
  evt.Unmarshaled.traefik != nil &&
  (evt.Unmarshaled.traefik['request_Cf-Connecting-Ip'] ?? '') != '' &&
  any(["173.245.48.0/20","103.21.244.0/22","103.22.200.0/22","103.31.4.0/22","141.101.64.0/18","108.162.192.0/18","190.93.240.0/20","188.114.96.0/20","197.234.240.0/22","198.41.128.0/17","162.158.0.0/15","104.16.0.0/13","104.24.0.0/14","172.64.0.0/13","131.0.72.0/22","2400:cb00::/32","2606:4700::/32","2803:f800::/32","2405:b500::/32","2405:8100::/32","2a06:98c0::/29","2c0f:f248::/32"], {IpInRange(evt.Meta.source_ip, #)})
statics:
  - meta: cf_verbindung
    expression: evt.Meta.source_ip
  - meta: source_ip
    expression: TrimSpace(evt.Unmarshaled.traefik['request_Cf-Connecting-Ip'])
