# Direct-WAN Routes (De-Swarm): www/apex -> www-LXC (CT118 .41), rosenweg9 -> stweg3-LXC (CT122 .45).
# nextcloud bleibt auf swarm-https-svc. edge terminiert TLS (cf), HTTP zum LXC-Backend.
http:
  routers:
    rw4303-apex-www:
      entryPoints: [websecure]
      rule: Host(`www.rosenweg4303.ch`) || Host(`rosenweg4303.ch`)
      service: www-lxc-svc
      tls: { certResolver: cf }
    rw9-apex-www:
      entryPoints: [websecure]
      rule: Host(`www.rosenweg9.ch`) || Host(`rosenweg9.ch`)
      service: rw9-lxc-svc
      tls: { certResolver: cf }
    nextcloud-rw4303:
      entryPoints: [websecure]
      rule: Host(`nextcloud.rosenweg4303.ch`)
      service: nextcloud-lxc-svc
      tls: { certResolver: cf }
    auth-rw4303:
      entryPoints: [websecure]
      rule: Host(`auth.rosenweg4303.ch`)
      service: authentik-hosts-svc
      tls: { certResolver: cf }
    authentik-rw4303:
      entryPoints: [websecure]
      rule: Host(`authentik.rosenweg4303.ch`)
      service: authentik-hosts-svc
      tls: { certResolver: cf }
    # MQTT-over-WebSocket: wss://mqtt.rosenweg4303.ch -> Mosquitto :9001 (plain ws).
    # edge terminiert TLS, Traefik handhabt den WS-Upgrade transparent.
    # mqtt.rosenweg4303.ch: WS-Upgrade -> Broker (:9001), sonst -> Seite (www-Frontend);
    # exakt "/" wird auf /mqtt.html umgeschrieben.
    mqtt-ws-rw4303:
      entryPoints: [websecure]
      rule: Host(`mqtt.rosenweg4303.ch`) && HeaderRegexp(`Upgrade`, `(?i)websocket`)
      priority: 100
      service: mqtt-ws-svc
      tls:
        certResolver: cf
        domains:
          - main: mqtt.rosenweg4303.ch
    mqtt-root-rw4303:
      entryPoints: [websecure]
      rule: Host(`mqtt.rosenweg4303.ch`) && Path(`/`)
      priority: 50
      service: www-lxc-svc
      middlewares: [mqtt-root-rewrite]
      tls:
        certResolver: cf
        domains:
          - main: mqtt.rosenweg4303.ch
    mqtt-page-rw4303:
      entryPoints: [websecure]
      rule: Host(`mqtt.rosenweg4303.ch`)
      priority: 10
      service: www-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: mqtt.rosenweg4303.ch
    # Audience-Subdomain admin.rosenweg4303.ch -> www-Frontend (fokussierte Admin-Nav via Host).
    # Oeffentlich (CF-CNAME admin -> kooperation, proxied) wie www/pwa; intern UDM-DNS -> .40.
    admin-rw4303:
      entryPoints: [websecure]
      rule: Host(`admin.rosenweg4303.ch`)
      service: www-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: admin.rosenweg4303.ch
    # Audience-Subdomain ausschuss.rosenweg4303.ch -> www-Frontend (fokussierte Ausschuss-Nav).
    # Oeffentlich (CF-CNAME ausschuss -> kooperation, proxied) wie www/pwa; intern UDM-DNS -> .40.
    ausschuss-rw4303:
      entryPoints: [websecure]
      rule: Host(`ausschuss.rosenweg4303.ch`)
      service: www-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: ausschuss.rosenweg4303.ch
    # PWA-Subdomain pwa.rosenweg4303.ch -> dedizierter PWA-Frontend-LXC (CT130/.54).
    # Oeffentlich (CF-CNAME pwa -> kooperation, proxied) wie www.
    pwa-rw4303:
      entryPoints: [websecure]
      rule: Host(`pwa.rosenweg4303.ch`)
      service: pwa-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: pwa.rosenweg4303.ch
    # access.rosenweg4303.ch -> www-Frontend (Zutrittsverwaltung + PWA). "/" -> /access.html.
    access-root-rw4303:
      entryPoints: [websecure]
      rule: Host(`access.rosenweg4303.ch`) && Path(`/`)
      priority: 50
      service: www-lxc-svc
      middlewares: [access-root-rewrite]
      tls:
        certResolver: cf
        domains:
          - main: access.rosenweg4303.ch
    access-page-rw4303:
      entryPoints: [websecure]
      rule: Host(`access.rosenweg4303.ch`)
      priority: 10
      service: www-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: access.rosenweg4303.ch
    # wetter.rosenweg4303.ch -> www-Frontend (Wetterstation R9). "/" -> /wetter.html.
    # CF-CNAME wetter -> kooperation (proxied). OEFFENTLICH (kein Login) — Seite nutzt
    # read-only MQTT-User wetter-public (nur wetter/r9/# lesen), eingebettet.
    wetter-root-rw4303:
      entryPoints: [websecure]
      rule: Host(`wetter.rosenweg4303.ch`) && Path(`/`)
      priority: 50
      service: www-lxc-svc
      middlewares: [wetter-root-rewrite]
      tls:
        certResolver: cf
        domains:
          - main: wetter.rosenweg4303.ch
    wetter-page-rw4303:
      entryPoints: [websecure]
      rule: Host(`wetter.rosenweg4303.ch`)
      priority: 10
      service: www-lxc-svc
      tls:
        certResolver: cf
        domains:
          - main: wetter.rosenweg4303.ch
    # Kurze IPTV-URL: tv.rosenweg4303.ch -> api /api/tv/playlist.m3u (242 Kanaele).
    tv-rw4303:
      entryPoints: [websecure]
      rule: Host(`tv.rosenweg4303.ch`)
      service: tv-playlist-svc
      middlewares: [tv-playlist-path]
      tls:
        certResolver: cf
        domains:
          - main: tv.rosenweg4303.ch
    # XMLTV-EPG: tv.rosenweg4303.ch/epg.xml -> api /api/tv/epg.xml (spezifischer Pfad).
    tv-epg-rw4303:
      entryPoints: [websecure]
      rule: Host(`tv.rosenweg4303.ch`) && Path(`/epg.xml`)
      service: tv-playlist-svc
      middlewares: [tv-epg-path]
      tls:
        certResolver: cf
        domains:
          - main: tv.rosenweg4303.ch

    # Heizung-Operator-View (ioBroker auf 100.64.90.50:8082) hinter Authentik-
    # Forward-Auth. ioBroker selbst hat KEINE Auth (setState moeglich) -> die
    # Subdomain ist NUR mit gueltiger Authentik-Session erreichbar.
    # /outpost.goauthentik.io/* muss OHNE Auth zur Authentik (Login-Flow + Callback).
    heizung-outpost-rw9:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg9.ch`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      service: authentik-hosts-svc
      tls: { certResolver: cf }
    # Nur die Heizung-View + ihre Assets durchlassen (socket.io-Client unter
    # /lib, WS /socket.io) — NICHT den vollen ioBroker-Web (vis-2-Editor etc.).
    heizung-view-rw9:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg9.ch`) && (PathPrefix(`/web.0/heizung`) || PathPrefix(`/socket.io`) || PathPrefix(`/lib`))
      priority: 50
      service: iobroker-svc
      middlewares: [authentik-fwd]
      tls: { certResolver: cf }
    # Alles andere (/, /vis-2/, …) -> auf die View umleiten (kein Editor-Zugriff).
    heizung-redirect-rw9:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg9.ch`)
      priority: 10
      service: iobroker-svc
      middlewares: [heizung-to-view]
      tls: { certResolver: cf }
    # Zweiter Host heizung.rosenweg4303.ch (same-site fürs Einbetten auf dem
    # rosenweg4303-Portal). Gleiche View/Outpost/Policy, eigener Proxy-Provider.
    heizung4303-outpost:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg4303.ch`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      service: authentik-hosts-svc
      tls: { certResolver: cf }
    heizung4303-view:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg4303.ch`) && (PathPrefix(`/web.0/heizung`) || PathPrefix(`/socket.io`) || PathPrefix(`/lib`))
      priority: 50
      service: iobroker-svc
      middlewares: [authentik-fwd]
      tls: { certResolver: cf }
    heizung4303-redirect:
      entryPoints: [websecure]
      rule: Host(`heizung.rosenweg4303.ch`)
      priority: 10
      service: iobroker-svc
      middlewares: [heizung4303-to-view]
      tls: { certResolver: cf }
  middlewares:
    # Catch-all auf heizung.rosenweg9.ch -> direkt in die View (statt Editor).
    heizung-to-view:
      redirectRegex:
        regex: ^https?://heizung\.rosenweg9\.ch/.*
        replacement: https://heizung.rosenweg9.ch/web.0/heizung/index.html
    heizung4303-to-view:
      redirectRegex:
        regex: ^https?://heizung\.rosenweg4303\.ch/.*
        replacement: https://heizung.rosenweg4303.ch/web.0/heizung/index.html
    tv-playlist-path:
      replacePath:
        path: /api/tv/playlist.m3u
    tv-epg-path:
      replacePath:
        path: /api/tv/epg.xml
    mqtt-root-rewrite:
      replacePath:
        path: /mqtt.html
    access-root-rewrite:
      replacePath:
        path: /access.html
    wetter-root-rewrite:
      replacePath:
        path: /wetter.html
    # Authentik Forward-Auth (Embedded Outpost). Provider "heizung-forward"
    # (forward_single, external_host=https://heizung.rosenweg9.ch).
    authentik-fwd:
      forwardAuth:
        address: http://100.64.2.37:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
  services:
    www-lxc-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.41
    pwa-lxc-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.54
    rw9-lxc-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.45
    nextcloud-lxc-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.36
    authentik-hosts-svc:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /-/health/live/
          interval: 10s
          timeout: 3s
        servers:
          - url: http://100.64.2.37:9000
    mqtt-ws-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.51:9001
    tv-playlist-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.2.52:3000
    iobroker-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://100.64.90.50:8082
tcp:
  routers:
    contacts-rw4303-passthrough:
      entryPoints: [websecure]
      rule: HostSNI(`contacts.rosenweg4303.ch`)
      service: contacts-rw4303-svc
      tls: { passthrough: true }
    personen-rw4303-passthrough:
      entryPoints: [websecure]
      rule: HostSNI(`personen.rosenweg4303.ch`)
      service: personen-rw4303-svc
      tls: { passthrough: true }
  services:
    contacts-rw4303-svc:
      loadBalancer:
        servers:
          - address: 100.64.2.38:443
    personen-rw4303-svc:
      loadBalancer:
        servers:
          - address: 100.64.2.33:443
