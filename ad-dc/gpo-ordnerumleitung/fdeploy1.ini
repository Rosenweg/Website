# Vorlage fuer User\Documents & Settings\fdeploy1.ini (Ordnerumleitung,
# [MS-GPFR] Version One). einrichten.sh entfernt die #-Zeilen, schreibt
# CRLF und UTF-16LE mit BOM - so verlangt es die Spezifikation.
#
# Ordner (Known Folder IDs):
#   {B4BFCC3A-DB2C-424C-B029-7FE99A87C641}  Desktop
#   {FDD39AD0-238F-46AF-ADB4-6C85480369C7}  Dokumente (Personal)
#   {33E28130-4E1E-4676-835A-98395C3BC3BB}  Bilder (My Pictures)
#
# S-1-1-0 (Jeder): Wer die Umleitung bekommt, entscheidet die
# Sicherheitsfilterung der Richtlinie (Gruppe Ordnerumleitung), nicht diese
# Datei. So bleibt sie gleich, wenn spaeter alle umgeleitet werden.
#
# Flags=1001 (hex):
#   0x1000  auf FullPath umleiten
#   0x0001  Inhalte an den neuen Ort verschieben
# Bewusst NICHT gesetzt:
#   0x0010  "Exklusive Rechte" - wuerde die ACL der Homes ersetzen (Nextcloud-
#           Dienst nextcloud-dienst verloere den Zugriff, docs/plans/
#           persoenlicher-ordner.md)
#   0x0200  "Besitz pruefen" - die Ordner von logon.bat bzw. die per Nextcloud
#           angelegten gehoeren nicht immer der Person; Windows wuerde die
#           Umleitung dann still auslassen
#   0x0020  "Beim Entfernen zuruecklegen" - faellt jemand aus der Gruppe, bleiben
#           die Dateien auf dem Server und der Ordner zeigt weiter dorthin
#
# Ziel genau wie bisher in logon.bat, damit bei stefan.mueller nichts
# verschoben wird: alter und neuer Ort sind derselbe.
[version]
version=100
[Folder_Redirection]
{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}=S-1-1-0
{FDD39AD0-238F-46AF-ADB4-6C85480369C7}=S-1-1-0
{33E28130-4E1E-4676-835A-98395C3BC3BB}=S-1-1-0
[{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}_S-1-1-0]
Flags=1001
FullPath=\\dokumente\home\%USERNAME%\Desktop
[{FDD39AD0-238F-46AF-ADB4-6C85480369C7}_S-1-1-0]
Flags=1001
FullPath=\\dokumente\home\%USERNAME%\Documents
[{33E28130-4E1E-4676-835A-98395C3BC3BB}_S-1-1-0]
Flags=1001
FullPath=\\dokumente\home\%USERNAME%\Pictures
