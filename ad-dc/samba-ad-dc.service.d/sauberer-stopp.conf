# Samba beendet sich auf SIGTERM mit Status 127 (sig_term() in
# source4/samba/server.c). Die mitgelieferte Unit kennt das nicht als Erfolg:
# JEDER geordnete Stopp — Neustart, Herunterfahren, HA-Umzug — erschien als
# "Failed with result 'exit-code'". Am 18.09.2026 bei jedem der acht Umzuege
# von dc1, jeweils direkt nach "Stopping samba-ad-dc.service".
#
# Ein angeforderter Stopp ist kein Fehler. Stuerzt Samba dagegen von selbst
# ab, endet es nicht mit 127, und Restart=on-failure greift wie vorher.
[Service]
SuccessExitStatus=127
