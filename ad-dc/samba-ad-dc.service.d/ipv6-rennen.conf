# dc2 stand vom 09.09. bis 12.09.2026 still: beim Boot war die per RA
# zugeteilte IPv6 noch nicht benutzbar, Samba brach beim Binden ab, und
# Restart=no liess es dabei bewenden. Siehe warte-ipv6.sh.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
ExecStartPre=/usr/local/sbin/warte-ipv6.sh
# Nur das Sicherheitsnetz. Der Start soll dank warte-ipv6.sh gar nicht erst
# scheitern; ein Neustart hier ist ein Befund, kein Normalbetrieb.
Restart=on-failure
RestartSec=15
