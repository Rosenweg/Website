version: "3.8"

services:
  # ============================================
  # Authentik Server
  # ============================================
  server:
    image: ghcr.io/goauthentik/server:2024.12
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_EMAIL__HOST: mail-eu.smtp2go.com
      AUTHENTIK_EMAIL__PORT: 2525
      AUTHENTIK_EMAIL__USERNAME: "${SMTP_USER}"
      AUTHENTIK_EMAIL__PASSWORD: "${SMTP_PASS}"
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__FROM: "noreply@rosenweg4303.ch"
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    networks:
      - authentik-net
      - rosenweg-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.authentik.rule=Host(`authentik.rosenweg4303.ch`)"
        - "traefik.http.routers.authentik.entrypoints=websecure"
        - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"
        - "traefik.http.services.authentik.loadbalancer.server.scheme=http"
        - "traefik.docker.network=rosenweg_rosenweg-net"

  # ============================================
  # Authentik Worker
  # ============================================
  worker:
    image: ghcr.io/goauthentik/server:2024.12
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_EMAIL__HOST: mail-eu.smtp2go.com
      AUTHENTIK_EMAIL__PORT: 2525
      AUTHENTIK_EMAIL__USERNAME: "${SMTP_USER}"
      AUTHENTIK_EMAIL__PASSWORD: "${SMTP_PASS}"
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__FROM: "noreply@rosenweg4303.ch"
    networks:
      - authentik-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ============================================
  # Authentik PostgreSQL
  # ============================================
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
    volumes:
      - authentik-pgdata:/var/lib/postgresql/data
    networks:
      - authentik-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Authentik Redis
  # ============================================
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data
    networks:
      - authentik-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-pve1
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  authentik-net:
    driver: overlay
    attachable: true
  rosenweg-net:
    external: true
    name: rosenweg_rosenweg-net

volumes:
  authentik-pgdata:
  authentik-media:
  authentik-templates:
  authentik-redis:
