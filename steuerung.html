<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steuerung · Rosenweg 9</title>
  <link rel="icon" href="/logo-rosenweg.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/authentik-auth.js?v=2"></script>
  <script src="/js/site-config.js"></script>
  <style>
    .tab-btn.active { background:#1d4ed8; color:#fff; }
    /* Höhe aus dem Seitenverhältnis der View (5:3), nur durch die Viewporthöhe gedeckelt. */
    .view-box { width:100%; aspect-ratio:5 / 3; max-height:calc(100dvh - 170px); }
    @supports not (aspect-ratio:1) { .view-box { height:70vh; } } /* alte Browser */
    #view-frame { width:100%; height:100%; border:0; display:block; background:#0b1220; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Same-Site-Guard: die Heizung-View (heizung.rosenweg9.ch) lässt sich nur
       einbetten, wenn die Seite selbst unter rosenweg9.ch läuft (sonst ist das
       Auth-Cookie third-party und wird geblockt). Sonst dorthin umleiten. -->
  <script>
    if (!/(^|\.)rosenweg9\.ch$/i.test(location.hostname)) {
      location.replace('https://rosenweg9.ch/steuerung.html');
    }
  </script>

  <nav id="main-nav" class="bg-white shadow-lg sticky top-0 z-50"></nav>
  <script src="/js/nav.js?v=3"></script>
  <script>RosenwegNav.init({ active: 'steuerung', basePath: '/' });</script>

  <!-- Login-Gate -->
  <div id="loginGate" class="flex-1 flex items-center justify-center">
    <div class="text-center bg-white rounded-xl shadow p-8">
      <h2 class="text-2xl font-bold mb-2">⚙️ Steuerung · Rosenweg 9</h2>
      <p class="text-gray-500 mb-6">Bitte anmelden, um die Anlagen-Ansichten zu sehen.</p>
      <div id="login-container"></div>
    </div>
  </div>

  <!-- Inhalt -->
  <main id="app" class="flex-1 flex flex-col" style="display:none">
    <section class="bg-gradient-to-r from-blue-700 to-blue-900 text-white">
      <div class="max-w-7xl mx-auto px-4 py-5 flex items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">Steuerung &amp; Anlagen</h1>
          <p class="text-blue-100 text-sm">Live-Ansichten der Haustechnik · Rosenweg 9</p>
        </div>
        <a id="open-tab" href="#" target="_blank" rel="noopener"
           class="shrink-0 text-sm bg-white/15 hover:bg-white/25 text-white px-3 py-2 rounded-lg">↗ In neuem Tab</a>
      </div>
    </section>

    <!-- Tabs -->
    <div class="bg-white border-b">
      <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto" id="tabbar">
        <button class="tab-btn active px-4 py-2 rounded-t-lg font-medium text-sm" data-view="heizung">🔥 Heizung</button>
      </div>
    </div>

    <!-- Helfer-Leiste (Freischalten / Neuer Tab) -->
    <div id="helpbar" class="bg-amber-50 border-b border-amber-200 text-amber-900 text-sm">
      <div class="max-w-7xl mx-auto px-4 py-2 flex items-center gap-3 flex-wrap">
        <span>Bleibt die Ansicht leer? Einmalig freischalten:</span>
        <button id="unlock-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded font-medium">🔓 Anmelden &amp; laden</button>
        <a id="help-tab" href="#" target="_blank" rel="noopener" class="underline">oder in neuem Tab öffnen ↗</a>
        <button id="helpbar-x" class="ml-auto text-amber-500 hover:text-amber-700" title="ausblenden">✕</button>
      </div>
    </div>

    <!-- View-Container — Höhe aus dem Seitenverhältnis der View (1000×600 = 5:3),
         nicht aus dem Viewport: robust über Desktop/Tablet/Smartphone. 100dvh
         (mobil-stabil, kein Adressleisten-Springen) nur als oberer Deckel. -->
    <div class="bg-gray-100 p-3">
      <div class="view-box max-w-7xl mx-auto bg-[#0b1220] rounded-xl shadow overflow-hidden">
        <iframe id="view-frame" title="Anlagen-Ansicht" allow="fullscreen"></iframe>
      </div>
    </div>
  </main>

  <script>
    const VIEWS = {
      heizung: 'https://heizung.rosenweg9.ch/web.0/heizung/index.html?v=2',
    };
    const frame   = document.getElementById('view-frame');
    const openTab = document.getElementById('open-tab');
    const helpTab = document.getElementById('help-tab');
    let current = 'heizung';

    function showView(key) {
      const url = VIEWS[key]; if (!url) return;
      current = key;
      openTab.href = url; helpTab.href = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === key));
      frame.src = 'about:blank';
      frame.src = url;
    }

    document.getElementById('tabbar').addEventListener('click', (e) => {
      const b = e.target.closest('.tab-btn'); if (b) showView(b.dataset.view);
    });
    document.getElementById('helpbar-x').addEventListener('click', () => {
      document.getElementById('helpbar').style.display = 'none';
    });
    document.getElementById('unlock-btn').addEventListener('click', () => {
      // Top-Level-Anmeldung in neuem Tab: setzt das Proxy-Cookie auf
      // heizung.rosenweg9.ch (kein iframe-Block). Danach iframe neu laden.
      window.open(VIEWS[current], 'heizung_auth');
      const onFocus = () => { window.removeEventListener('focus', onFocus); setTimeout(() => showView(current), 600); };
      window.addEventListener('focus', onFocus);
    });

    (async function () {
      const enter = () => {
        document.getElementById('loginGate').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        showView('heizung');
      };
      const user = await AuthentikAuth.init({ requireAuth: false, onLogin: () => enter() });
      if (!user) { AuthentikAuth.createLoginButton('login-container'); return; }
      enter();
    })();
  </script>
</body>
</html>
