# www.rosenweg4303.ch — native nginx (De-Swarm, ersetzt rosenweg_website + nginx.conf).
# Unterschiede zur Docker-Variante (nginx.conf):
#   - root: /var/www/rosenweg statt /usr/share/nginx/html
#   - /api/-Upstreams: upstream rw_api/rw_energy (conf.d/upstreams.conf) statt
#     Docker-DNS-resolver 127.0.0.11 + Overlay-Alias api:3000/energy-collector:3001
#   - X-Forwarded-Proto "https" hart gesetzt: edge-traefik terminiert TLS und
#     spricht HTTP zur Origin -> ohne den Override baut die API http://-Callbacks.
server {
    listen 80;
    listen [::]:80;
    server_name www.rosenweg4303.ch rosenweg4303.ch localhost;

    root /var/www/rosenweg;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Energy API proxy to collector (^~ prevents regex location override)
    location ^~ /api/energy/ {
        proxy_pass http://rw_energy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
    }

    # API proxy to backend (^~ prevents regex location override for .png/.js etc)
    location ^~ /api/ {
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Short URLs
    location = /td {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/#technischer-dienst-section"><script>location.replace("/#technischer-dienst-section")</script></head></html>';
    }
    # Freundlicher Alias fuer Defekt-/Reklamationsmeldung (im Aushang verlinkt) -> PWA Reparatur-Melder
    location = /defekt-melden { return 302 /pwa/reparatur/; }
    location = /defekt-melden/ { return 302 /pwa/reparatur/; }
    location = /reparatur { return 302 /pwa/reparatur/; }

    # HTML pages - no caching (always fresh)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    # Main site - try files, .html-fallback (clean URLs), then directories, then 404
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # PWA Web-App-Manifest — korrekter Content-Type (sonst octet-stream -> Install-Warnung)
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # JSON files - proper content type and CORS for API calls
    location ~* \.json$ {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        try_files $uri =404;
    }

    # Cache static assets - images/fonts long, JS/CSS short (revalidate on each request)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow .well-known for ACME (must come before /\. deny-all)
    location ~ /.well-known {
        allow all;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Custom 404 page
    error_page 404 =404 /index.html;
}
