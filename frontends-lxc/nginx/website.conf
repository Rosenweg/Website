# www.rosenweg4303.ch — native nginx (De-Swarm, ersetzt rosenweg_website + nginx.conf).
# Unterschiede zur Docker-Variante (nginx.conf):
#   - root: /var/www/rosenweg statt /usr/share/nginx/html
#   - /api/-Upstreams: upstream rw_api/rw_energy (conf.d/upstreams.conf) statt
#     Docker-DNS-resolver 127.0.0.11 + Overlay-Alias api:3000/energy-collector:3001
#   - X-Forwarded-Proto "https" hart gesetzt: edge-traefik terminiert TLS und
#     spricht HTTP zur Origin -> ohne den Override baut die API http://-Callbacks.
server {
    listen 80;
    listen [::]:80;
    server_name www.rosenweg4303.ch rosenweg4303.ch localhost;

    root /var/www/rosenweg;
    # Sicherheits-Header (frontends-lxc/nginx/sicherheit-header.conf)
    include /etc/nginx/snippets/rosenweg-sicherheit.conf;
    index index.html;
    # nicht-web-dateien: Quelltext, Doku, Konfiguration und Sicherungen werden nie
    # ausgeliefert — auch wenn wieder ein ganzer Repo-Baum hierher kopiert wird (5.9.2026).
    # /.well-known/ (ACME, security.txt) bleibt erreichbar; .run (Installer) neu gesperrt.
    location ~* (^/\.(?!well-known/)|\.(md|py|sh|yml|yaml|service|timer|sql|env|zone|csv|xlsx|conf|cfg|bak|alt|run|vor-[a-z0-9-]+)$) { return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Energie-API (D-1, 17.11.2026): nur die bewusst offenen Geraete-/Anzeige-
    # Routen (Shelly, LaMetric, Solar-Anzeige, Tarife) gehen direkt zum Collector.
    # Alles andere (Lastprofile, Zaehlerlisten mit IP, Bewohner-Zuordnungen)
    # geht an die Haupt-API (api/routes/energie-lesen.js): Anmeldung + nur
    # zugeordnete Zaehler. Verschachtelt, weil ^~ die Regex-Locations sonst
    # gar nicht erst prueft. Die proxy_set_header gelten auch innen.
    location ^~ /api/energy/ {
        location ~ ^/api/energy/(surplus|surplus-available|lametric|shelly|solar-live|tariffs|tariffs/current)/?$ {
            proxy_pass http://rw_energy;
        }
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        # Dynamisch, nie cachen (wie /api/).
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }

    # API proxy to backend (^~ prevents regex location override for .png/.js etc)
    location ^~ /api/ {
        limit_req zone=rw_otp burst=10 nodelay;   # nur Code-Endpunkte, siehe upstreams.conf
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
        # Dynamische API NIE cachen — sonst 304/Stale auf /api/auth/me etc. -> Login-Loop.
        # Bedingte Anfragen wegstrippen, sonst liefert die API trotz no-store weiter 304.
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Short URLs
    location = /td {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/#technischer-dienst-section"><script>location.replace("/#technischer-dienst-section")</script></head></html>';
    }
    # Freundlicher Alias fuer Defekt-/Reklamationsmeldung (im Aushang verlinkt) -> PWA-Subdomain
    location = /defekt-melden { return 302 https://pwa.rosenweg4303.ch/reparatur/; }
    location = /defekt-melden/ { return 302 https://pwa.rosenweg4303.ch/reparatur/; }
    location = /reparatur { return 302 https://pwa.rosenweg4303.ch/reparatur/; }
    location = /pwa { return 302 https://pwa.rosenweg4303.ch/; }
    # Gedruckte Poster (z. B. Waschkueche, QR rosenweg4303.ch/stweg3/#waschkueche) zeigen auf
    # /stwegN/ – die STWEG-Seiten liegen auf eigenen Subdomains. Der #-Teil bleibt im Browser erhalten.
    location ~ ^/stweg([1-7])/?$ { return 302 https://stweg$1.rosenweg4303.ch/; }
    location ~ ^/meg/?$ { return 302 https://meg.rosenweg4303.ch/; }

    # HTML pages - no caching (always fresh)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    # Main site - try files, .html-fallback (clean URLs), then directories, then 404
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # PWA Web-App-Manifest — korrekter Content-Type (sonst octet-stream -> Install-Warnung)
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        try_files $uri =404;
    }

    # JSON: nur die drei oeffentlichen Konfig-/Manifest-Dateien. Frueher lieferte
    # eine Pauschalregel jede .json mit ACAO * aus — so waren Schluessel-Exporte
    # (networks_full.json, devices_full.json) abrufbar. Alles andere -> 404.
    location ~* ^/(site-config|zaehler-config|access-manifest)\.json$ {
        default_type application/json;  # add_header haette den Typ aus mime.types verdoppelt
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        try_files $uri =404;
    }
    location ~* \.json$ { return 404; }

    # Cache static assets - images/fonts long, JS/CSS short (revalidate on each request)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        include /etc/nginx/snippets/rosenweg-sicherheit.conf;
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    # Sicherheits-Header: siehe include oben (sicherheit-header.conf).

    # Allow .well-known for ACME (must come before /\. deny-all)
    location ~ /.well-known {
        allow all;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Custom 404 page
    error_page 404 =404 /index.html;
}
