# Geteilte Backend-Upstreams für die Frontend-LXCs (De-Swarm).
# EINZIGE Quelle für die api/energy-IP — in /etc/nginx/conf.d/ included (http-Kontext).
#
# Interim (api + energy-collector laufen noch im Swarm): beide sind über den
# Swarm-VIP host-published erreichbar:
#   - api          -> 100.64.2.27:3000  (ingress, schon von der WhatsApp-Bridge genutzt)
#   - energy-collector -> 100.64.2.27:3001  (muss vor dem stweg3-Cutover host-published werden)
#
# Nach De-Swarm-Schritt 2/4 (api/energy in eigene LXCs): nur die IPs hier ändern
# und `nginx -s reload` — die vhosts (website/isp/stweg) bleiben unverändert.
upstream rw_api    { server 100.64.2.52:3000; }
upstream rw_energy { server 100.64.2.53:3001; }

# ── Drossel fuer die Einmal-Code-Endpunkte (17.11.2026) ──────────────────
# In einer Nacht wurden gegen /api/reklamationen/oeffentlich 3,6 Mio. Codes
# durchprobiert. Die API zaehlt Fehlversuche am Code; das hier ist die zweite
# Linie davor: je Client-IP 10 Anfragen pro Minute (Burst 10) auf
#   /api/reklamationen/{code,oeffentlich}, /api/doodle/{code,verify}, /api/otp/{send,verify}.
# Client-IP: Traefik (CT245) vertraut keinem eingehenden X-Forwarded-For und
# setzt den Header selbst auf die Quelle, die es sieht (Cloudflare-Edge oder
# direkter Client). Darum gilt hier der erste Eintrag; ohne Header remote_addr.
# Leerer Schluessel = nicht gedrosselt, d.h. alle anderen /api/-Pfade bleiben frei.
map $http_x_forwarded_for $rw_client_ip {
    ""                    $remote_addr;
    "~^(?<rw_ip>[^,\s]+)" $rw_ip;
}
map $uri $rw_otp_pfad {
    "~^/api/(reklamationen/(code|oeffentlich)|doodle/(code|verify)|otp/(send|verify))/?$" 1;
    default "";
}
map "$rw_otp_pfad|$rw_client_ip" $rw_otp_key {
    "~^1\|(?<rw_k>.+)$" $rw_k;
    default "";
}
limit_req_zone $rw_otp_key zone=rw_otp:10m rate=10r/m;
limit_req_status 429;
