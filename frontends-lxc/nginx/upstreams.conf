# Geteilte Backend-Upstreams für die Frontend-LXCs (De-Swarm).
# EINZIGE Quelle für die api/energy-IP — in /etc/nginx/conf.d/ included (http-Kontext).
#
# Interim (api + energy-collector laufen noch im Swarm): beide sind über den
# Swarm-VIP host-published erreichbar:
#   - api          -> 100.64.2.27:3000  (ingress, schon von der WhatsApp-Bridge genutzt)
#   - energy-collector -> 100.64.2.27:3001  (muss vor dem stweg3-Cutover host-published werden)
#
# Nach De-Swarm-Schritt 2/4 (api/energy in eigene LXCs): nur die IPs hier ändern
# und `nginx -s reload` — die vhosts (website/isp/stweg) bleiben unverändert.
upstream rw_api    { server 100.64.2.52:3000; }
upstream rw_energy { server 100.64.2.53:3001; }
