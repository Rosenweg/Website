# Multi-STWEG/MEG-Frontend — native nginx (De-Swarm, ersetzt rosenweg_stweg1..7+meg
# + nginx.stweg.conf). EINE Config, der $site-Host-Map wählt den docroot /stwegN.
# Jeder STWEG/MEG bekommt einen eigenen LXC (Isolation/HA), aber alle laufen DIESE
# identische Config + identischen docroot — Routing macht edge-traefik pro Host.
#
# Unterschiede zur Docker-Variante (nginx.stweg.conf):
#   - root: /var/www/rosenweg statt /usr/share/nginx/html
#   - /api/-Upstreams: upstream rw_api/rw_energy (conf.d/upstreams.conf)
#   - WASCHKUECHE: statt envsubst-${WASCHKUECHE} pro Service jetzt eine $host->$wk-Map
#     (stweg3 + rosenweg9 = 1, Rest = 0). Damit ist die Config über alle stweg-LXCs
#     identisch — die Waschküche ist nur unter dem stweg3-Host aktiv.

# Host -> docroot-Name (stweg1..7, meg; rosenweg9.ch = STWEG 3).
map $host $site {
    ~^(?<s>stweg[1-7]|meg)\.rosenweg4303\.ch$   $s;
    rosenweg9.ch                                 stweg3;
    www.rosenweg9.ch                             stweg3;
    default                                      stweg3;
}

# Host -> Waschküche-Flag (ersetzt das frühere per-Service-Env WASCHKUECHE=1).
# Nur STWEG 3 (inkl. rosenweg9-Eigendomain) hat das Smart-Waschküche-Modul.
map $host $wk {
    stweg3.rosenweg4303.ch  1;
    rosenweg9.ch            1;
    www.rosenweg9.ch        1;
    default                 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(stweg[1-7]|meg)\.rosenweg4303\.ch$ rosenweg9.ch www.rosenweg9.ch localhost;

    root /var/www/rosenweg;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Energy-API zum Collector (Solaranlage-Live auf stweg3). Muss VOR dem
    # generischen /api/-Block stehen (längeres ^~ Prefix gewinnt).
    location ^~ /api/energy/ {
        proxy_pass http://rw_energy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
    }

    # API-Proxy zur geteilten rosenweg_api. X-Forwarded-Proto hardcoded "https".
    location ^~ /api/ {
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Shared JS/CSS + site-config (host-unabhängig, am html-Root)
    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /css/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
    location = /site-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Waschküche-Modul (nur unter dem stweg3-Host aktiv, $wk aus der Map oben).
    # Exact-Match schlägt die \.html$-Regex. Bei !=1 -> 404 (Modul aus).
    location = /waschkueche.html {
        if ($wk != "1") { return 404; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /_waschkueche.html =404;
    }

    # Saubere Kurz-URL: stweg3.rosenweg4303.ch/solar -> Solaranlage-Live.
    location = /solar {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /$site/pages/solaranlage-live.html =404;
    }

    # Technische Zähleruebersicht (rosenweg9.ch/zaehler-technik). Nur stweg3 hat die Datei.
    location = /zaehler-technik {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /$site/pages/zaehler-technik.html =404;
    }

    # STWEG-spezifischer HTML-Content (kein Cache, unter /stwegN). Fehlt die Seite
    # im STWEG-Dir -> @www_fallback (Cross-Site-Links landen auf www statt 404).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /$site$uri @www_fallback;
    }

    # Bild/Font/PDF: erst im STWEG-Dir, dann shared am Root (z.B. Logo)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|pdf)$ {
        try_files /$site$uri $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # Bare-Root explizit (sonst Loop über das Dir-try_files).
    location = / {
        try_files /$site/index.html =404;
    }

    # Catch-all: saubere URLs ohne .html, Verzeichnisse via index.html.
    location / {
        try_files /$site$uri /$site$uri.html /$site$uri/index.html @www_fallback;
    }

    # Was im STWEG/MEG-Dir nicht existiert (z.B. ../energie-monitor.html), wird auf
    # www umgeleitet — erspart das Rewriten der Cross-Site-Links.
    location @www_fallback {
        return 302 https://www.rosenweg4303.ch$uri$is_args$args;
    }
}
