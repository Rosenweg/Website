# pwa.rosenweg4303.ch — native nginx (De-Swarm, PWA-Subdomain).
# Docroot = pwa/-Inhalt: / = geführte Übersicht/Launcher, /reparatur/ etc. = installierbare
# Apps, /icons/, /js/. /api/ -> rw_api (X-Forwarded-Proto https, edge terminiert TLS).
server {
    listen 80;
    listen [::]:80;
    server_name pwa.rosenweg4303.ch localhost;

    root /var/www/rosenweg;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Energy-API -> collector
    location ^~ /api/energy/ {
        proxy_pass http://rw_energy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
    }
    # API -> backend
    location ^~ /api/ {
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
        # Dynamische API NIE cachen — sonst 304/Stale auf /api/auth/me etc. -> Login-Loop.
        # Bedingte Anfragen wegstrippen, sonst liefert die API trotz no-store weiter 304
        # gegen bereits gecachte Browser-Eintraege.
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA-Manifest — korrekter Content-Type (sonst Install-Warnung)
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Service Worker — nie cachen (muss aktualisierbar bleiben). MUSS vor .js stehen.
    location ~* sw\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }
    # HTML — no-cache (immer frisch)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.json$ {
        add_header Content-Type application/json;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }
    # Übersicht + Apps: clean URLs + Verzeichnis-Index
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /.well-known { allow all; }
    location ~ /\. { deny all; return 404; }
    error_page 404 =404 /index.html;
}
