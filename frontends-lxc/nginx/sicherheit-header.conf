# Gemeinsame Sicherheits-Header fuer alle Frontends (I-12/F-23).
# Installiert nach /etc/nginx/snippets/rosenweg-sicherheit.conf (deploy.sh bzw.
# Dockerfile*). nginx vererbt add_header NICHT in eine location, die selbst ein
# add_header hat — darum wird diese Datei auf Server-Ebene UND in jeder solchen
# location eingebunden.
#
# Bewusst KEINE script-src-CSP: die Seiten arbeiten mit Inline-Skripten und
# -Handlern, die eine strenge CSP brechen wuerde. frame-ancestors 'self' +
# X-Frame-Options verhindern nur das Einbetten durch fremde Seiten (Clickjacking);
# geprueft: keine Seite im Repo wird von einer anderen Herkunft eingebettet
# (steuerung.html bettet heizung.* ein — das liefert ioBroker, nicht dieses nginx).
# HSTS ohne includeSubDomains, damit kein interner http-Dienst ausgesperrt wird.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
