# isp.rosenweg4303.ch + noc.rosenweg4303.ch — native nginx (De-Swarm,
# ersetzt rosenweg_isp + nginx.isp.conf).
# Unterschiede zur Docker-Variante:
#   - root: /var/www/rosenweg statt /usr/share/nginx/html
#   - /api/-Upstream: upstream rw_api (conf.d/upstreams.conf) statt Overlay-Alias api:3000
#   - X-Forwarded-Proto "https" bleibt hart gesetzt (wie zuvor).
# HINWEIS tv-stream: proxyt zu 100.64.9.250:3000 (VLAN 9). Vor dem isp-Cutover
# prüfen, ob der LXC (vmbr2/VLAN 2) diese IP routen kann — sonst /tv-stream/ via
# Firewall-Route freischalten. Die Multicast-M3U läuft ohnehin über /api/tv/playlist.m3u.
server {
    listen 80;
    listen [::]:80;
    server_name isp.rosenweg4303.ch localhost;

    root /var/www/rosenweg;
    index isp.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # TV7-Stream-Proxy direkt zum tv7-streamer (LXC 250 @ 100.64.9.250:3000).
    # MPEG-TS zero-copy gepiped (kein Buffering), Auth via HMAC-Token in der URL.
    location ^~ /tv-stream/ {
        rewrite ^/tv-stream/(.*)$ /stream/$1 break;
        proxy_pass http://100.64.9.250:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 100.64.9.250:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # API-Proxy zur geteilten rosenweg_api. X-Forwarded-Proto hardcoded "https"
    # (edge-traefik spricht intern HTTP zur Origin -> sonst http://-OAuth-Callbacks).
    location ^~ /api/ {
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100m;
        proxy_buffer_size 16k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    # Cache-Headers: HTML nicht cachen, JS/CSS/Bilder schon
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # Saubere URLs ohne .html: /isp-admin -> isp-admin.html
    location / {
        try_files $uri $uri.html $uri/ /isp.html;
    }
}

# Wallboard-Modus: noc.rosenweg4303.ch zeigt direkt das NOC-Fullscreen-Panel.
# DNS-only (kein CF), Route via edge-traefik. Read-only Metriken — kein PII.
server {
    listen 80;
    listen [::]:80;
    server_name noc.rosenweg4303.ch;

    root /var/www/rosenweg;
    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /health { access_log off; return 200 'OK'; add_header Content-Type text/plain; }

    location ^~ /api/ {
        proxy_pass http://rw_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto "https";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d; add_header Cache-Control "public, immutable" always;
    }
    # / -> NOC-Wallboard direkt
    location = / { rewrite ^ /noc-fullscreen.html last; }
    location / { try_files $uri /noc-fullscreen.html; }
}
