<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Quelle: Repo Rosenweg/Website. Liegt auf fe-www (www.…/noc-fullscreen.html) UND
       fe-isp (noc.rosenweg4303.ch); ausrollen mit scripts/rw-web-ausrollen.sh.
       Die Kacheln selbst stehen in js/noc-cockpit.js — dieselbe Datei bedient das
       Cockpit in isp-admin.html. Wer hier etwas ergaenzt, ergaenzt es dort mit. -->
  <title>NOC — Rosenweg ISP</title>
  <link rel="icon" href="/logo-rosenweg-isp.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b1220; color: #cbd5e1; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</head>
<body class="min-h-screen p-6">
  <header class="flex items-center gap-3 mb-4 pb-3 border-b border-slate-700">
    <img src="/logo-rosenweg-isp.png" class="w-10 h-10 rounded-full bg-white p-0.5" alt="">
    <div>
      <div class="text-xs uppercase tracking-widest text-cyan-300">ROSENWEG ISP — NOC WALLBOARD</div>
      <div class="text-2xl font-bold text-slate-100">Network Operations Center</div>
    </div>
  </header>

  <div id="noc"></div>

  <footer class="mt-4 text-xs text-slate-600 text-center">
    Wallboard · powered by isp.rosenweg4303.ch
  </footer>

  <script src="/js/authentik-auth.js?v=2"></script>
  <script src="/js/noc-cockpit.js?v=1"></script>
  <script>
    // Mit ?token=… laeuft die Seite als Wandbildschirm ohne Anmeldung; ohne
    // Token, aber angemeldet, nimmt sie die geschuetzten Endpunkte. Beides
    // regelt das Modul, damit ein Menueeintrag nicht nur Striche zeigt.
    NocCockpit.starten(document.getElementById('noc'), { modus: 'wandbild', intervallMs: 5000 });
  </script>
</body>
</html>
